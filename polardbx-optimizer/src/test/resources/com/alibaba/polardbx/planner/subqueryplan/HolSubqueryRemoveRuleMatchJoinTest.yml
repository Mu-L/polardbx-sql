    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 partition by key(`v1`) PARTITIONS 3;
  t1:
    CREATE TABLE `t1` (
    `v4` int(11) NOT NULL,
    `v5` int(11) NOT NULL,
    `v6` int(11) NOT NULL,
    PRIMARY KEY (`v4`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 partition by key(`v4`) PARTITIONS 3;
  t2:
    CREATE TABLE `t2` (
    `v7` bigint NULL COMMENT "",
    `v8` bigint NULL COMMENT "",
    `v9` bigint NULL,
    PRIMARY KEY (`v7`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 partition by key(`v7`) PARTITIONS 3;
