- #// @desc
  #// AONE-85026505: outer JOIN(a,b) plus correlated EXISTS aggregate subquery on
  #// co-located table c (same shard key) must not merge the correlated join
  #// condition into the inner aggregate's HAVING clause, otherwise the pushed-down
  #// native SQL references an out-of-scope outer column.
  sql: |
    select a.id
    from
      test_hash_tb a
      join test_hash_tb2 b on a.id = b.id
