- sql: |
    -- query 41
    select  distinct(i_product_name) from item i1 where i_manufact_id between 738 and 738+40 and (select count(*) as item_cnt from item where i_manufact = i1.i_manufact and (( ((i_category = 'Women' and (i_color = 'powder' or i_color = 'khaki') and (i_units = 'Ounce' or i_units = 'Oz') and (i_size = 'medium' or i_size = 'extra large') ) or (i_category = 'Women' and (i_color = 'brown' or i_color = 'honeydew') and (i_units = 'Bunch' or i_units = 'Ton') and (i_size = 'N/A' or i_size = 'small') ) or (i_category = 'Men' and (i_color = 'floral' or i_color = 'deep') and (i_units = 'N/A' or i_units = 'Dozen') and (i_size = 'petite' or i_size = 'large') ) or (i_category = 'Men' and (i_color = 'light' or i_color = 'cornflower') and (i_units = 'Box' or i_units = 'Pound') and (i_size = 'medium' or i_size = 'extra large') ))) or ( ((i_category = 'Women' and (i_color = 'midnight' or i_color = 'snow') and (i_units = 'Pallet' or i_units = 'Gross') and (i_size = 'medium' or i_size = 'extra large') ) or (i_category = 'Women' and (i_color = 'cyan' or i_color = 'papaya') and (i_units = 'Cup' or i_units = 'Dram') and (i_size = 'N/A' or i_size = 'small') ) or (i_category = 'Men' and (i_color = 'orange' or i_color = 'frosted') and (i_units = 'Each' or i_units = 'Tbl') and (i_size = 'petite' or i_size = 'large') ) or (i_category = 'Men' and (i_color = 'forest' or i_color = 'ghost') and (i_units = 'Lb' or i_units = 'Bundle') and (i_size = 'medium' or i_size = 'extra large') ))))) > 0 order by i_product_name limit 100;
  plan: |
    topn(sort="i_product_name asc", offset=0, fetch=?60)
      exchange(distribution=single, collation=[0 asc-nulls-first])
        topn(sort="i_product_name asc", fetch=?60)
          hashagg(group="i_product_name")
            exchange(distribution=hash[0]20, collation=[])
              partialhashagg(group="i_product_name")
                filter(condition="case(is null($3), 0, $2) > ?59")
                  hashjoin(condition="i_manufact = i_manufact", type="left")
                    exchange(distribution=hash[0]20, collation=[])
                      osstablescan(tables="cci_item[p1]", sql="select `i_manufact`, `i_product_name` from `cci_item` as `cci_item` where (`i_manufact_id` between ? and 778)")
                    project(item_cnt="item_cnt", i_manufact="i_manufact")
                      hashagg(group="i_manufact", item_cnt="sum(item_cnt)")
                        exchange(distribution=hash[0]20, collation=[])
                          partialhashagg(group="i_manufact", item_cnt="count()")
                            osstablescan(tables="cci_item[p1]", sql="select `i_manufact` from `cci_item` as `cci_item` where (((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))) or ((`i_category` = ?) and (`i_color` in(?, ?)) and (`i_units` in(?, ?)) and (`i_size` in(?, ?))))")

- sql: |
    -- query 42
    select  dt.d_year ,item.i_category_id ,item.i_category ,sum(ss_ext_sales_price) from 	date_dim dt ,store_sales ,item where dt.d_date_sk = store_sales.ss_sold_date_sk and store_sales.ss_item_sk = item.i_item_sk and item.i_manager_id = 1 and dt.d_moy=11 and dt.d_year=2000 group by 	dt.d_year ,item.i_category_id ,item.i_category order by       sum(ss_ext_sales_price) desc,dt.d_year ,item.i_category_id ,item.i_category limit 100 ;
  plan: |
    topn(sort="sum(ss_ext_sales_price) desc,d_year asc,i_category_id asc,i_category asc", offset=0, fetch=?3)
      exchange(distribution=single, collation=[3 desc-nulls-last, 0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first])
        topn(sort="sum(ss_ext_sales_price) desc,d_year asc,i_category_id asc,i_category asc", fetch=?3)
          hashagg(group="d_year,i_category_id,i_category", sum(ss_ext_sales_price)="sum(sum(ss_ext_sales_price))")
            exchange(distribution=hash[1]192, collation=[])
              partialhashagg(group="d_year,i_category_id,i_category", sum(ss_ext_sales_price)="sum(ss_ext_sales_price)")
                hashjoin(condition="i_item_sk = ss_item_sk", type="inner")
                  project(d_date_sk="d_date_sk", d_year="d_year", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_ext_sales_price="ss_ext_sales_price")
                    hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                      osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_ext_sales_price` from `cci_store_sales` as `cci_store_sales`")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_year` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = ?))")
                  exchange(distribution=hash[0]192, collation=[])
                    osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_category_id`, `i_category` from `cci_item` as `cci_item` where (`i_manager_id` = ?)")

- sql: |
    -- query 43
    select  s_store_name, s_store_id, sum(case when (d_day_name='Sunday') then ss_sales_price else null end) sun_sales, sum(case when (d_day_name='Monday') then ss_sales_price else null end) mon_sales, sum(case when (d_day_name='Tuesday') then ss_sales_price else  null end) tue_sales, sum(case when (d_day_name='Wednesday') then ss_sales_price else null end) wed_sales, sum(case when (d_day_name='Thursday') then ss_sales_price else null end) thu_sales, sum(case when (d_day_name='Friday') then ss_sales_price else null end) fri_sales, sum(case when (d_day_name='Saturday') then ss_sales_price else null end) sat_sales from date_dim, store_sales, store where d_date_sk = ss_sold_date_sk and s_store_sk = ss_store_sk and s_gmt_offset = -5 and d_year = 2000 group by s_store_name, s_store_id order by s_store_name, s_store_id,sun_sales,mon_sales,tue_sales,wed_sales,thu_sales,fri_sales,sat_sales limit 100;
  plan: |
