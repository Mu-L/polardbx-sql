                        partialhashagg(group="c_customer_sk", revenue="sum(ss_ext_sales_price)")
                          filter(condition="between asymmetric($11, $12, $13)")
                            nljoin(condition="true", type="left")
                              nljoin(condition="true", type="left")
                                project(c_customer_sk="c_customer_sk", c_current_addr_sk="c_current_addr_sk", ca_address_sk="ca_address_sk", ca_county="ca_county", ca_state="ca_state", s_county="s_county", s_state="s_state", ss_sold_date_sk="ss_sold_date_sk", ss_customer_sk="ss_customer_sk", ss_ext_sales_price="ss_ext_sales_price", d_date_sk="d_date_sk", d_month_seq="d_month_seq")
                                  hashjoin(condition="ca_county = s_county and ca_state = s_state", type="inner")
                                    hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                                      project(c_customer_sk="c_customer_sk", c_current_addr_sk="c_current_addr_sk", ca_address_sk="ca_address_sk", ca_county="ca_county", ca_state="ca_state", ss_sold_date_sk="ss_sold_date_sk", ss_customer_sk="ss_customer_sk", ss_ext_sales_price="ss_ext_sales_price")
                                        hashjoin(condition="ss_customer_sk = c_customer_sk", type="inner")
