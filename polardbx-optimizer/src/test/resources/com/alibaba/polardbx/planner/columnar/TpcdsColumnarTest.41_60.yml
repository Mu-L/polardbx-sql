      exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first, 3 asc-nulls-first, 4 asc-nulls-first, 5 asc-nulls-first, 6 asc-nulls-first, 7 asc-nulls-first, 8 asc-nulls-first])
        memsort(sort="s_store_name asc,s_store_id asc,sat_sales asc,sat_sales_0 asc,sat_sales_1 asc,sat_sales_2 asc,sat_sales_3 asc,sat_sales_4 asc,sat_sales_5 asc")
          hashagg(group="s_store_name,s_store_id", sat_sales="sum(sat_sales)", sat_sales_0="sum(sat_sales_0)", sat_sales_1="sum(sat_sales_1)", sat_sales_2="sum(sat_sales_2)", sat_sales_3="sum(sat_sales_3)", sat_sales_4="sum(sat_sales_4)", sat_sales_5="sum(sat_sales_5)")
            exchange(distribution=hash[0]192, collation=[])
              partialhashagg(group="s_store_name,s_store_id", sat_sales="sum($f2)", sat_sales_0="sum($f3)", sat_sales_1="sum($f4)", sat_sales_2="sum($f5)", sat_sales_3="sum($f6)", sat_sales_4="sum($f7)", sat_sales_5="sum($f8)")
                project(s_store_name="s_store_name", s_store_id="s_store_id", $f2="case(=($2, ?0), $1, null)", $f3="case(=($2, ?1), $1, null)", $f4="case(=($2, ?2), $1, null)", $f5="case(=($2, ?3), $1, null)", $f6="case(=($2, ?4), $1, null)", $f7="case(=($2, ?5), $1, null)", $f8="case(=($2, ?6), $1, null)")
                  hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                    project(ss_store_sk="ss_store_sk", ss_sales_price="ss_sales_price", d_day_name="d_day_name")
                      hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                        osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_store_sk`, `ss_sales_price` from `cci_store_sales` as `cci_store_sales`")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_day_name` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")
                    exchange(distribution=broadcast, collation=[])
                      osstablescan(tables="cci_store[p1]", sql="select `s_store_sk`, `s_store_id`, `s_store_name` from `cci_store` as `cci_store` where (`s_gmt_offset` = ?)")

- sql: |
    -- query 44
    select  asceding.rnk, i1.i_product_name best_performing, i2.i_product_name worst_performing from(select * from (select item_sk,rank() over (order by rank_col asc) rnk from (select ss_item_sk item_sk,avg(ss_net_profit) rank_col from store_sales ss1 where ss_store_sk = 4 group by ss_item_sk having avg(ss_net_profit) > 0.9*(select avg(ss_net_profit) rank_col from store_sales where ss_store_sk = 4 and ss_addr_sk is null group by ss_store_sk))V1)V11 where rnk  < 11) asceding, (select * from (select item_sk,rank() over (order by rank_col desc) rnk from (select ss_item_sk item_sk,avg(ss_net_profit) rank_col from store_sales ss1 where ss_store_sk = 4 group by ss_item_sk having avg(ss_net_profit) > 0.9*(select avg(ss_net_profit) rank_col from store_sales where ss_store_sk = 4 and ss_addr_sk is null group by ss_store_sk))V2)V21 where rnk  < 11) descending, item i1, item i2 where asceding.rnk = descending.rnk and i1.i_item_sk=asceding.item_sk and i2.i_item_sk=descending.item_sk order by asceding.rnk limit 100;
  plan: |
    topn(sort="rnk asc", offset=0, fetch=?8)
      exchange(distribution=single, collation=[0 asc-nulls-first])
        topn(sort="rnk asc", fetch=?8)
          project(rnk="f2w0$o0", best_performing="i_product_name", worst_performing="i_product_name0")
            hashjoin(condition="f2w0$o0 = f2w0$o0", type="inner")
              project(f2w0$o0="f2w0$o0", i_product_name="i_product_name")
                hashjoin(condition="i_item_sk = item_sk", type="inner")
                  project(item_sk="item_sk", f2w0$o0="f2w0$o0")
                    exchange(distribution=hash[2]192, collation=[])
                      filter(condition="f2w0$o0 < ?3")
                        sortwindow(item_sk="item_sk", rank_col="rank_col", f2w0$o0="window#0rank($1)", reference windows="window#0=window(partition {} order by [1 asc-nulls-first] rows between unbounded preceding and current row aggs [rank($1)])")
                          exchange(distribution=single, collation=[1 asc-nulls-first])
                            memsort(sort="rank_col asc")
                              project(item_sk="item_sk", rank_col="$f1 / $f2")
                                nljoin(condition="$f1 / $f2 > ?1 * $f1 / $f2", type="inner")
                                  hashagg(group="item_sk", $f1="sum($f1)", $f2="sum($f2)")
                                    exchange(distribution=hash[0]192, collation=[])
                                      partialhashagg(group="item_sk", $f1="sum(ss_net_profit)", $f2="count(ss_net_profit)")
                                        osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, sql="select `ss_item_sk` as `item_sk`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales` where (`ss_store_sk` = ?)")
                                  exchange(distribution=broadcast, collation=[])
                                    project($f1="$f1", $f2="$f2")
                                      hashagg(group="ss_store_sk", $f1="sum($f1)", $f2="sum($f2)")
                                        exchange(distribution=hash[0], collation=[])
                                          partialhashagg(group="ss_store_sk", $f1="sum(ss_net_profit)", $f2="count(ss_net_profit)")
                                            osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, sql="select `ss_store_sk`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales` where ((`ss_store_sk` = ?) and (`ss_addr_sk` is null))")
                  exchange(distribution=broadcast, collation=[])
                    osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_product_name` from `cci_item` as `cci_item`")
              project(f2w0$o0="f2w0$o0", i_product_name="i_product_name")
                hashjoin(condition="i_item_sk = item_sk", type="inner")
                  project(item_sk="item_sk", f2w0$o0="f2w0$o0")
                    exchange(distribution=hash[2]192, collation=[])
                      filter(condition="f2w0$o0 < ?7")
                        sortwindow(item_sk="item_sk", rank_col="rank_col", f2w0$o0="window#0rank($1)", reference windows="window#0=window(partition {} order by [1 desc-nulls-last] rows between unbounded preceding and current row aggs [rank($1)])")
                          exchange(distribution=single, collation=[1 desc-nulls-last])
                            memsort(sort="rank_col desc")
                              project(item_sk="item_sk", rank_col="$f1 / $f2")
                                nljoin(condition="$f1 / $f2 > ?5 * $f1 / $f2", type="inner")
                                  hashagg(group="item_sk", $f1="sum($f1)", $f2="sum($f2)")
                                    exchange(distribution=hash[0]192, collation=[])
                                      partialhashagg(group="item_sk", $f1="sum(ss_net_profit)", $f2="count(ss_net_profit)")
                                        osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, sql="select `ss_item_sk` as `item_sk`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales` where (`ss_store_sk` = ?)")
                                  exchange(distribution=broadcast, collation=[])
                                    project($f1="$f1", $f2="$f2")
                                      hashagg(group="ss_store_sk", $f1="sum($f1)", $f2="sum($f2)")
                                        exchange(distribution=hash[0], collation=[])
