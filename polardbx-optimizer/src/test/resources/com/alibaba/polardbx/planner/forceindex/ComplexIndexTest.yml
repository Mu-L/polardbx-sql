DDL:
  example1:
    CREATE TABLE `example1` (
    `id` varchar(100) NOT NULL,
    `name` varchar(100) NOT NULL,
    `a` int DEFAULT NULL,
    `b` text NOT NULL,
    first_name VARCHAR(64) NOT NULL,
    last_name VARCHAR(64) NOT NULL,
    email VARCHAR(255) NOT NULL,
    phone VARCHAR(32),
    content TEXT,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
    full_name VARCHAR(130) GENERATED ALWAYS AS (CONCAT_WS(' ', first_name, last_name)) VIRTUAL,
    rev_phone VARCHAR(32) GENERATED ALWAYS AS (REVERSE(phone)) STORED,
    PRIMARY KEY (`id` desc,`b`(30)),
    KEY `index1` (`a`,`id`(30)),
    KEY `index2` (`a`,`name`(30) desc),
    KEY `index3` (`a`, b(30) desc),
    KEY `index4` (`id`, b(29) desc),
    KEY `index5` (`id`, b),
    INDEX idx_lower_lastname ((LOWER(last_name))),
    INDEX idx_full_name (full_name(10) asc),
    INDEX idx_rev_phone (rev_phone desc),
    INDEX (rev_phone(10)),
    FULLTEXT INDEX ft_content (content) WITH PARSER ngram
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
    partition by key(id) partitions 10
  ample2:
    CREATE TABLE `example2` (
    `id` varchar(100) NOT NULL,
    `name` varchar(100) NOT NULL,
    `a` int DEFAULT NULL,
    `b` text NOT NULL,
    first_name VARCHAR(64) NOT NULL,
    last_name VARCHAR(64) NOT NULL,
    email VARCHAR(255) NOT NULL,
    phone VARCHAR(32),
    content TEXT,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
    full_name VARCHAR(130) GENERATED ALWAYS AS (CONCAT_WS(' ', first_name, last_name)) VIRTUAL,
    rev_phone VARCHAR(32) GENERATED ALWAYS AS (REVERSE(phone)) STORED,
    PRIMARY KEY (`id` desc,`b`),
    KEY `index1` (`a`,`id`(30)),
    KEY `index2` (`a`,`name`(30) desc),
    INDEX idx_lower_lastname ((LOWER(last_name))),
    INDEX idx_full_name (full_name(10) asc),
    INDEX idx_rev_phone (rev_phone desc),
    INDEX (rev_phone(10)),
    FULLTEXT INDEX ft_content (content) WITH PARSER ngram,
    unique key uk(created_at),
    global index gsi_a(a) partition by key(a) partitions 10
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
    partition by key(id) partitions 10
