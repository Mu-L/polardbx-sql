SQL:
  - sql: |
      WITH cte_lineitem AS (
        SELECT l_orderkey, l_suppkey, l_quantity, l_extendedprice FROM lineitem WHERE l_shipdate >= '1994-01-01'
      )
      select upper(l1.l_orderkey) + l2.l_quantity, l1.l_suppkey  FROM cte_lineitem l1, cte_lineitem l2
      WHERE l1.l_suppkey > 10 and l2.l_quantity > 11
    plan: |
      columnoriginnames:l_orderkey l_quantity,l_suppkey
      columnorigins:l_orderkey l_quantity
      tablereferences:lineitem_col_index,lineitem_col_index
      maxrowcount:infinity
      uniquekeys:[]
DDL:
  lineitem:
    CREATE TABLE IF NOT EXISTS `lineitem` (  `l_orderkey` bigint(20) NOT NULL,  `l_partkey` int(11) NOT NULL,  `l_suppkey` int(11) NOT NULL,  `l_linenumber` bigint(20) NOT NULL,  `l_quantity` decimal(15, 2) NOT NULL,  `l_extendedprice` decimal(15, 2) NOT NULL,  `l_discount` decimal(15, 2) NOT NULL,  `l_tax` decimal(15, 2) NOT NULL,  `l_returnflag` varchar(1) NOT NULL,  `l_linestatus` varchar(1) NOT NULL,  `l_shipdate` date NOT NULL,  `l_commitdate` date NOT NULL,  `l_receiptdate` date NOT NULL,  `l_shipinstruct` varchar(25) NOT NULL,  `l_shipmode` varchar(10) NOT NULL,  `l_comment` varchar(44) NOT NULL,  PRIMARY KEY (`l_orderkey`, `l_linenumber`),  CLUSTERED COLUMNAR INDEX `lineitem_col_index`(`l_shipdate`, `l_orderkey`) PARTITION BY HASH (`l_orderkey`) PARTITIONS 6 ) ENGINE = InnoDB DEFAULT CHARSET = latin1 PARTITION BY KEY (`l_orderkey`) PARTITIONS 8;
