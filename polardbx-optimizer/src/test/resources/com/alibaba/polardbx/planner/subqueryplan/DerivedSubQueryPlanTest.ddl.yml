  `IS_GROUP_LEADER` int(11) DEFAULT NULL COMMENT '是否团长订单:1(是),0(否)',
  `SOURCING_MODEL` varchar(16) DEFAULT 'area' COMMENT '寻源模式:area(区域寻源),lnglat(经纬度寻源)',
  `CREATE_BY` varchar(64) DEFAULT NULL COMMENT '创建人',
