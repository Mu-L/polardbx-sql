OR_OUT_STOCK:
  CREATE TABLE `OR_OUT_STOCK` (
  `ID` bigint(20) NOT NULL AUTO_INCREMENT BY GROUP COMMENT '主键ID',
  `OUT_STOCK_NO` varchar(64) DEFAULT NULL COMMENT '出库单号',
  `ORDER_NO` varchar(64) DEFAULT NULL COMMENT '中台订单号',
  `TRANS_NO` varchar(64) DEFAULT NULL COMMENT '平台交易号',
  `PLATFORM_CODE` varchar(32) DEFAULT NULL COMMENT '平台编码',
  `PLATFORM_NAME` varchar(64) DEFAULT NULL COMMENT '平台名称',
  `SHOP_CODE` varchar(32) DEFAULT NULL COMMENT '店铺编码',
  `SHOP_NAME` varchar(128) DEFAULT NULL COMMENT '店铺名称',
  `DELIVERY_WAREHOUSE_CODE` varchar(32) DEFAULT NULL COMMENT '发货店铺编码/仓库编码',
  `DELIVERY_WAREHOUSE_NAME` varchar(128) DEFAULT NULL COMMENT '发货店铺名称/仓库名称',
  `DELIVERY_WAREHOUSE_TYPE` varchar(32) DEFAULT NULL COMMENT '发货仓库类型:warehouse(仓库),shop(店铺)',
  `OUT_STOCK_TYPE` varchar(32) DEFAULT NULL COMMENT '出库类型:out(销售出库),return(销售退货)',
  `CHANNEL_TYPE` varchar(16) DEFAULT NULL COMMENT '订单渠道类型:online(线上)、offline(线下)',
  `TYPE` varchar(16) DEFAULT NULL COMMENT '订单类型:B2C、B2B、O2O、POS ',
  `BUSINESS_TYPE` varchar(16) DEFAULT NULL COMMENT '订单业务类型:sale(销售订单)、barter(换货订单)、fictitious(虚拟订单)',
  `BUSINESS_DATE` datetime DEFAULT NULL COMMENT '业务日期',
  `CREATE_TYPE` varchar(16) DEFAULT NULL COMMENT '订单创建类型:manual(手工创建)、auto(自动创建)',
  `IS_COPY` int(11) DEFAULT NULL COMMENT '是否是复制订单:0(否),1(是)',
  `ORDER_TIME` datetime DEFAULT NULL COMMENT '平台下单时间',
  `PLATFORM_USER_ID` varchar(64) DEFAULT NULL COMMENT '用户平台ID',
  `IS_FETCH` int(11) DEFAULT NULL COMMENT '是否自提:1(是),0(否)',
  `O2O_DIST_MODE` varchar(16) DEFAULT NULL COMMENT 'O2O配送方式:store(门店配送)、knight(骑士配送)、zb(众包配送)',
  `CONSIGNEE_NAME` varchar(128) DEFAULT NULL COMMENT '收货人姓名',
  `CONSIGNEE_TELEPHONE` varchar(32) DEFAULT NULL COMMENT '收货人电话',
  `CONSIGNEE_POSTCODE` varchar(16) DEFAULT NULL COMMENT '城市邮编',
  `CONSIGNEE_PROVINCE_CODE` varchar(16) DEFAULT NULL COMMENT '收货省份编码',
  `CONSIGNEE_PROVINCE_NAME` varchar(64) DEFAULT NULL COMMENT '收货省份名称',
  `CONSIGNEE_CITY_CODE` varchar(16) DEFAULT NULL COMMENT '收货城市编码',
  `CONSIGNEE_CITY_NAME` varchar(64) DEFAULT NULL COMMENT '收货城市名称',
  `CONSIGNEE_AREA_CODE` varchar(16) DEFAULT NULL COMMENT '收货区域编码',
  `CONSIGNEE_AREA_NAME` varchar(128) DEFAULT NULL COMMENT '收货区域名称',
  `CONSIGNEE_ADDRESS` varchar(256) DEFAULT NULL COMMENT '收货人地址',
  `EXPRESS_COMPANY` varchar(64) DEFAULT NULL COMMENT '快递公司',
  `LOGISTICS_NO` varchar(64) DEFAULT NULL COMMENT '物流单号',
  `TOTAL_AMOUNT` decimal(10,2) DEFAULT NULL COMMENT '商品总金额',
  `ADJUST_AMOUNT` decimal(10,2) DEFAULT NULL COMMENT '手工调整金额',
  `FREIGHT_AMOUNT` decimal(10,2) DEFAULT NULL COMMENT '运费金额',
  `DISCOUNT_AMOUNT` decimal(10,2) DEFAULT NULL COMMENT '优惠金额',
  `PAYMENT_AMOUNT` decimal(10,2) DEFAULT NULL COMMENT '支付金额',
  `PAYMENT_TYPE` varchar(32) DEFAULT NULL COMMENT '支付方式:cod(货到付款)、online(在线支付)',
  `USED_INTEGRAL` int(11) DEFAULT NULL COMMENT '使用积分点数',
  `PAYMENT_TIME` datetime DEFAULT NULL COMMENT '支付时间',
  `BUYER_REMARK` varchar(256) DEFAULT NULL COMMENT '买家备注',
  `SELLER_REMARK` varchar(256) DEFAULT NULL COMMENT '客服备注',
  `IS_NEED_INVOICE` int(11) DEFAULT NULL COMMENT '是否需要发票:1(是),0(否)',
  `INVOICE_TYPE` varchar(32) DEFAULT NULL COMMENT '发票类别',
  `INVOICE_HEADER` varchar(128) DEFAULT NULL COMMENT '发票抬头',
  `INVOICE_CONTENT` varchar(256) DEFAULT NULL COMMENT '发票内容',
  `PRODUCT_WEIGHT` decimal(10,2) DEFAULT NULL COMMENT '商品总重量',
  `PLATFORM_COMMISION` decimal(10,2) DEFAULT NULL COMMENT '平台佣金',
  `DISTRIBUTOR_COMMISION` decimal(10,2) DEFAULT NULL COMMENT '分销商佣金',
  `PRODUCT_VOLUME` decimal(10,2) DEFAULT NULL COMMENT '商品总体积',
  `CREATE_BY` varchar(64) DEFAULT NULL COMMENT '创建人',
  `CREATE_TIME` datetime DEFAULT NULL COMMENT '创建时间',
  `LAST_UPDATE_BY` varchar(64) DEFAULT NULL COMMENT '最新修改人',
  `LAST_UPDATE_TIME` datetime DEFAULT NULL COMMENT '最新修改时间',
  `PACKAGE_FEE` decimal(10,2) DEFAULT NULL COMMENT '餐盒费',
  `PACKAGE_NUMBER` int(11) DEFAULT NULL COMMENT '餐盒数量',
  `SALESMAN_MOBILE` varchar(32) DEFAULT NULL COMMENT '销售员手机号',
  `INVOICE_TAXER_ID` varchar(32) DEFAULT NULL COMMENT '纳税人识别号',
  `SHOP_INCOME` decimal(10,2) DEFAULT NULL COMMENT '店铺实收',
  `RETURN_FLAG` int(11) DEFAULT NULL COMMENT '是否退款(1:是,0:否)',
  `GROUP_CODE` varchar(32) DEFAULT NULL COMMENT '团购编码',
  `IS_GROUP_LEADER` int(11) DEFAULT NULL COMMENT '是否团长订单:1(是),0(否)',
  `DELIVERY_STATUS` varchar(32) DEFAULT NULL COMMENT '送货状态',
  `LOCK_STOCK_TYPE` int(11) DEFAULT NULL COMMENT '1:只扣减店铺库存,2:扣减店铺和总上架数量3:扣减仓库和总上架数量',
  `RETURN_TYPE` varchar(32) DEFAULT NULL COMMENT '退单类型:0(仅退款),1(退货退款),2(换货),3(仅退货)',
  `SALESMAN_COMMISION` decimal(10,2) DEFAULT NULL COMMENT '销售员奖励金',
  `SALESMAN_SECOND_COMMISION` decimal(10,2) DEFAULT NULL COMMENT '销售员二级奖励金',
  `IS_ERP` varchar(2) DEFAULT NULL,
  PRIMARY KEY (`ID`),
  KEY `auto_shard_key_ORDER_NO` (`ORDER_NO`)
  ) ENGINE=InnoDB AUTO_INCREMENT=1400009 DEFAULT CHARSET=utf8 COMMENT='存放全渠道中台出库单主表信息' dbpartition by hash(`ORDER_NO`);

