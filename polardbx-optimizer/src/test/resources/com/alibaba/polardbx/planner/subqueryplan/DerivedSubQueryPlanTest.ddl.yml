  `SALESMAN_COMMISION` decimal(10,2) DEFAULT NULL COMMENT '销售员奖励金',
  `RETURN_TYPE` varchar(64) DEFAULT NULL COMMENT '退单类型:0(仅退款);1(退货退款);2(换货);3(仅退货)',
  `FACTORY_COST` decimal(10,2) DEFAULT NULL COMMENT '出厂成本',
