                  logicalview(tables="part[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `p_partkey`, `p_name`, `p_mfgr`, `p_brand`, `p_type`, `p_size`, `p_container`, `p_retailprice`, `p_comment` from `part` as `part`")
  - sql: |
      select 1 from lineitem where 1 = (select max(c_address) from customer where c_mktsegment <> l_receiptdate)
        and l_orderkey < (select max(c_address) from customer where c_mktsegment <> l_receiptdate);
    plan: |
      project(1="?0")
        filter(condition="l_orderkey < max(c_address)0")
          project(l_orderkey="l_orderkey", max(c_address)0="max(c_address)")
            colcorrelate(cor=$cor4, type=left)
              project(l_orderkey="l_orderkey", l_receiptdate="l_receiptdate")
                filter(condition="?1 = max(c_address)")
                  colcorrelate(cor=$cor5, type=left)
                    project(l_orderkey="l_orderkey", l_receiptdate="l_receiptdate")
                      logicalview(tables="lineitem[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `l_orderkey`, `l_partkey`, `l_suppkey`, `l_linenumber`, `l_quantity`, `l_extendedprice`, `l_discount`, `l_tax`, `l_returnflag`, `l_linestatus`, `l_shipdate`, `l_commitdate`, `l_receiptdate`, `l_shipinstruct`, `l_shipmode`, `l_comment` from `lineitem` as `lineitem`")
                    project(max(c_address)="max(c_address)")
                      logicalagg(max(c_address)="max(c_address)")
                        project(c_address="c_address")
                          filter(condition="c_mktsegment <> $cor5.l_receiptdate")
                            project(c_address="c_address", c_mktsegment="c_mktsegment")
                              logicalview(tables="customer[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `c_custkey`, `c_name`, `c_address`, `c_nationkey`, `c_phone`, `c_acctbal`, `c_mktsegment`, `c_comment` from `customer` as `customer`")
