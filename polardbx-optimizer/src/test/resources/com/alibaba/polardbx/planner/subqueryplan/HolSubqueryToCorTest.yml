                filter(condition="?1 < m")
                  logicalagg(m="max(c_address)")
                    project(c_address="c_address")
                      filter(condition="c_mktsegment <> $cor1.l_receiptdate")
                        project(c_address="c_address", c_mktsegment="c_mktsegment")
                          logicalview(tables="customer[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `c_custkey`, `c_name`, `c_address`, `c_nationkey`, `c_phone`, `c_acctbal`, `c_mktsegment`, `c_comment` from `customer` as `customer`")
              logicalagg(l="min(c_address)", u="max(c_address)")
                project(c_address="c_address")
                  logicalview(tables="customer[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `c_custkey`, `c_name`, `c_address`, `c_nationkey`, `c_phone`, `c_acctbal`, `c_mktsegment`, `c_comment` from `customer` as `customer`")
  - sql: |
      # some
      select 1 from lineitem where 1 <= some(select c_address from customer where c_mktsegment <> l_receiptdate)
                and l_orderkey <> some(select c_address from customer where c_mktsegment = l_receiptdate);
    plan: |
      project(1="?0")
