SQL:
  - sql: |
      # scalar 
      select 1 from lineitem where l_orderkey > (select max(p_partkey) from part) or 1 > (select max(p_partkey) from part);
    plan: |
      project(1="?0")
        filter(condition="l_orderkey > max(p_partkey) or ?1 > max(p_partkey)0")
          project(l_orderkey="l_orderkey", max(p_partkey)="max(p_partkey)", max(p_partkey)0="max(p_partkey)0")
            logicaljoin(condition="true", type="left")
              logicaljoin(condition="true", type="left")
                logicalview(tables="lineitem[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `l_orderkey`, `l_partkey`, `l_suppkey`, `l_linenumber`, `l_quantity`, `l_extendedprice`, `l_discount`, `l_tax`, `l_returnflag`, `l_linestatus`, `l_shipdate`, `l_commitdate`, `l_receiptdate`, `l_shipinstruct`, `l_shipmode`, `l_comment` from `lineitem` as `lineitem`")
                logicalagg(max(p_partkey)="max(p_partkey)")
                  project(p_partkey="p_partkey")
                    logicalview(tables="part[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `p_partkey`, `p_name`, `p_mfgr`, `p_brand`, `p_type`, `p_size`, `p_container`, `p_retailprice`, `p_comment` from `part` as `part`")
              logicalagg(max(p_partkey)="max(p_partkey)")
