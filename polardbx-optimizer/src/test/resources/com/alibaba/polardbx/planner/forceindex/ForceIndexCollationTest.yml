DDL:
  t_order:
    CREATE TABLE `t_order` (
    `id` bigint(11) NOT NULL AUTO_INCREMENT,
    `order_id` int(20) DEFAULT NULL,
    `buyer_id` varchar(20) DEFAULT NULL,
    `seller_id` int(20) DEFAULT NULL,
    `product_id` int(20) DEFAULT NULL,
    `extra_id` int(20) DEFAULT NULL,
    `order_snapshot` longtext,
    `order_detail` longtext,
    PRIMARY KEY (`id`),
    KEY `prdo_long` (`product_id`,`order_id` desc,`seller_id`,`buyer_id`(15) desc),
    KEY `extra` (`extra_id`,`buyer_id`(16) desc,`seller_id`),
    unique KEY `uk` USING BTREE (`order_snapshot`,`product_id`),
    GLOBAL INDEX `g_i_buyer`(`buyer_id`) COVERING (`id`, `order_id`, `seller_id`, `order_snapshot`) partition by key(`buyer_id`) PARTITIONS 6,
    GLOBAL INDEX `g_i_seller` (`seller_id`) COVERING (`id`, `order_id`, `buyer_id`, `order_snapshot`) partition by key(`seller_id`) PARTITIONS 6
    ) ENGINE = InnoDB AUTO_INCREMENT = 2300006 CHARSET = utf8 partition by key(`order_id`) PARTITIONS 6
  btc_utxo:
    CREATE TABLE `btc_utxo` (       `id` bigint(20) NOT NULL AUTO_INCREMENT,        `chain_index` varchar(4) COLLATE utf8mb4_bin NOT NULL,  `address` varchar(128) COLLATE utf8mb4_bin NOT NULL,    `block_height` bigint(20) DEFAULT NULL,         `block_hash` varchar(255) COLLATE utf8mb4_bin DEFAULT NULL,     `blocktime` bigint(20) DEFAULT NULL,    `txhash` varchar(128) COLLATE utf8mb4_bin NOT NULL,     `lock_time` bigint(20) DEFAULT NULL,    `vout_index` int(11) NOT NULL,  `value_sat_str` varchar(255) COLLATE utf8mb4_bin DEFAULT NULL,  `value_str` varchar(255) COLLATE utf8mb4_bin DEFAULT NULL,      `value` decimal(65, 30) DEFAULT NULL,   `script_hex` varchar(512) COLLATE utf8mb4_bin DEFAULT NULL,     `from_coinbase` tinyint(1) DEFAULT NULL,        `spent` tinyint(1) DEFAULT NULL,        `script_type` varchar(255) COLLATE utf8mb4_bin DEFAULT NULL,    `address_count` bigint(20) DEFAULT NULL,        `spent_self` tinyint(1) DEFAULT NULL,   `utxo_id` varchar(128) COLLATE utf8mb4_bin NOT NULL,    `has_brc20_asset` tinyint(1) DEFAULT NULL,      `has_runes_asset` tinyint(1) DEFAULT NULL,      `has_ordinal_nft_asset` tinyint(1) DEFAULT NULL,        `modify_time` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,         PRIMARY KEY (`id`),     UNIQUE KEY `uqx_address_utxo_id` (`address`, `utxo_id`),        KEY `idx_address_spent_value_desc_id` (`address`, `spent`, `value`, `id`),      KEY `idx_utxo_id` (`utxo_id`),  KEY `idx_block_height_spent` (`block_height`, `spent`),         KEY `idx_cover_assets_nonzero` (`chain_index`, `address`, `spent`, `value` desc, `id`, `has_brc20_asset`, `has_runes_asset`, `has_ordinal_nft_asset`),KEY `idx1` (`chain_index`, `address`, `spent`, has_brc20_asset,`value` desc, `id`),KEY `idx2` (`chain_index`, `address`, `spent`, has_runes_asset,`value` , `id` desc),KEY `idx3` (`chain_index`, `address`, `spent`, has_ordinal_nft_asset,`value` , `id` desc) ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 DEFAULT COLLATE = utf8mb4_bin PARTITION BY KEY (`address`) PARTITIONS 3;
