  PRIMARY KEY (`ITEM_ID`),
  UNIQUE KEY `IDX_PR_ITEM_ITEMCODE` USING BTREE (`ITEM_CODE`)
  ) ENGINE = InnoDB DEFAULT CHARSET = utf8
  BROADCAST;
