- #// @desc
  #// DISABLE_SUBQUERY_TO_SEMI_JOIN hint forces correlated scalar-subquery in the
  #// projection list (handleProject path) to CorrelateApply as well
  sql: |
    /*+TDDL:cmd_extra(DISABLE_SUBQUERY_TO_SEMI_JOIN=true)*/
    select a.id, (
                    select id
                    from test_hash_tb2 b
                    where b.name=a.name
                  )
    from
      test_hash_tb a

  plan: |

    project(id="id", $f0="$f0")
      correlateapply(cor=$cor0, leftconditions=[], opkind=null, type=left)
        gather(concurrent=true)
          logicalview(tables="[0000-0003].test_hash_tb", shardcount=4, sql="select `id`, `name` from `test_hash_tb` as `test_hash_tb`")
        project($f0="id")
          filter(condition="name = $cor0.name")
            gather(concurrent=true)
              logicalview(tables="[0000-0003].test_hash_tb2", shardcount=4, sql="select `id`, `name` from `test_hash_tb2` as `test_hash_tb2`")
    cache node:

    gather(concurrent=true)
      logicalview(tables="[0000-0003].test_hash_tb2", shardcount=4, sql="select `id`, `name` from `test_hash_tb2` as `test_hash_tb2`")

- #// @desc
  #// DISABLE_SUBQUERY_TO_SEMI_JOIN=false (default) keeps existing semi-hash-join plan
  #// for the same scalar-subquery-in-projection case
  sql: |
    /*+TDDL:cmd_extra(DISABLE_SUBQUERY_TO_SEMI_JOIN=false)*/
    select a.id, (
                    select id
                    from test_hash_tb2 b
                    where b.name=a.name
                  )
    from
      test_hash_tb a

  plan: |

    project(id="id", (((select b.id from test_hash_tb2 as b where (b.name = a.name))))="id0", cor=[$cor0])
      semihashjoin(condition="name = name", type="left", build="inner")
        gather(concurrent=true)
          logicalview(tables="[0000-0003].test_hash_tb", shardcount=4, sql="select `id`, `name`, `create_time`, `int_col1`, `int_col2`, `int_col3`, `int_col4`, `int_col5`, `int_col6` from `test_hash_tb` as `test_hash_tb`")
        gather(concurrent=true)
          logicalview(tables="[0000-0003].test_hash_tb2", shardcount=4, sql="select `id`, `name` from `test_hash_tb2` as `test_hash_tb2`")
