- sql: |
    -- query 89
    select  * from( select i_category, i_class, i_brand, s_store_name, s_company_name, d_moy, sum(ss_sales_price) sum_sales, avg(sum(ss_sales_price)) over (partition by i_category, i_brand, s_store_name, s_company_name) avg_monthly_sales from item, store_sales, date_dim, store where ss_item_sk = i_item_sk and ss_sold_date_sk = d_date_sk and ss_store_sk = s_store_sk and d_year in (1999) and ((i_category in ('Books','Electronics','Sports') and i_class in ('computers','stereo','football') ) or (i_category in ('Men','Jewelry','Women') and i_class in ('shirts','birdal','dresses') )) group by i_category, i_class, i_brand, s_store_name, s_company_name, d_moy) tmp1 where case when (avg_monthly_sales <> 0) then (abs(sum_sales - avg_monthly_sales) / avg_monthly_sales) else null end > 0.1 order by sum_sales - avg_monthly_sales, s_store_name limit 100;
  plan: |
    project(i_category="i_category", i_class="i_class", i_brand="i_brand", s_store_name="s_store_name", s_company_name="s_company_name", d_moy="d_moy", sum_sales="sum_sales", avg_monthly_sales="avg_monthly_sales")
      topn(sort="(tmp1.sum_sales - tmp1.avg_monthly_sales) asc,s_store_name asc", offset=0, fetch=?7)
        exchange(distribution=single, collation=[8 asc-nulls-first, 3 asc-nulls-first])
          topn(sort="(tmp1.sum_sales - tmp1.avg_monthly_sales) asc,s_store_name asc", fetch=?7)
            project(i_category="i_category", i_class="i_class", i_brand="i_brand", s_store_name="s_store_name", s_company_name="s_company_name", d_moy="d_moy", sum_sales="sum_sales", avg_monthly_sales="f7w0$o0", (tmp1.sum_sales - tmp1.avg_monthly_sales)="sum_sales - f7w0$o0")
              filter(condition="case(<>($7, ?5), /(abs(-($6, $7)), $7), null) > ?6")
                hashwindow(i_category="i_category", i_class="i_class", i_brand="i_brand", s_store_name="s_store_name", s_company_name="s_company_name", d_moy="d_moy", sum_sales="sum_sales", f7w0$o0="window#0avg($6)", reference windows="window#0=window(partition {0, 2, 3, 4} order by [] range between unbounded preceding and unbounded following aggs [avg($6)])")
                  project(i_category="i_category", i_class="i_class", i_brand="i_brand", s_store_name="s_store_name", s_company_name="s_company_name", d_moy="d_moy", sum_sales="sum_sales")
                    hashagg(group="d_moy,i_brand,i_class,i_category,s_store_name,s_company_name", sum_sales="sum(ss_sales_price)")
                      hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                        exchange(distribution=hash[3]192, collation=[])
                          project(d_date_sk="d_date_sk", d_moy="d_moy", i_item_sk="i_item_sk", i_brand="i_brand", i_class="i_class", i_category="i_category", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_store_sk="ss_store_sk", ss_sales_price="ss_sales_price")
                            hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                              project(i_item_sk="i_item_sk", i_brand="i_brand", i_class="i_class", i_category="i_category", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_store_sk="ss_store_sk", ss_sales_price="ss_sales_price")
                                hashjoin(condition="ss_item_sk = i_item_sk", type="inner")
                                  osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_store_sk`, `ss_sales_price` from `cci_store_sales` as `cci_store_sales`")
                                  exchange(distribution=hash[0]192, collation=[])
                                    osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_brand`, `i_class`, `i_category` from `cci_item` as `cci_item` where (((`i_category` in(?)) and (`i_class` in(?))) or ((`i_category` in(?)) and (`i_class` in(?))))")
                              exchange(distribution=broadcast, collation=[])
                                osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_moy` from `cci_date_dim` as `cci_date_dim` where (`d_year` in(?))")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_store[p1]", sql="select `s_store_sk`, `s_store_name`, `s_company_name` from `cci_store` as `cci_store`")

