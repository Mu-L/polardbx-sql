                                            hashjoin(condition="ws_order_number = wr_order_number and wr_item_sk = ws_item_sk", type="inner")
                                              osstablescan(tables="cci_web_returns[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `wr_item_sk`, `wr_refunded_cdemo_sk`, `wr_refunded_addr_sk`, `wr_returning_cdemo_sk`, `wr_reason_sk`, `wr_order_number`, `wr_fee`, `wr_refunded_cash` from `cci_web_returns` as `cci_web_returns`")
