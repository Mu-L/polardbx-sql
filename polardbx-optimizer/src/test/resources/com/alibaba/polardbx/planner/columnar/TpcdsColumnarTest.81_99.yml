                          hashjoin(condition="wr_reason_sk = r_reason_sk", type="inner")
                            project(ws_sold_date_sk="ws_sold_date_sk", ws_item_sk="ws_item_sk", ws_web_page_sk="ws_web_page_sk", ws_order_number="ws_order_number", ws_quantity="ws_quantity", ws_sales_price="ws_sales_price", ws_net_profit="ws_net_profit", wr_item_sk="wr_item_sk", wr_refunded_cdemo_sk="wr_refunded_cdemo_sk", wr_refunded_addr_sk="wr_refunded_addr_sk", wr_returning_cdemo_sk="wr_returning_cdemo_sk", wr_reason_sk="wr_reason_sk", wr_order_number="wr_order_number", wr_fee="wr_fee", wr_refunded_cash="wr_refunded_cash", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk", ca_state="ca_state", ca_country="ca_country", cd_demo_sk="cd_demo_sk", cd_marital_status="cd_marital_status", cd_education_status="cd_education_status", cd_demo_sk0="cd_demo_sk0", cd_marital_status0="cd_marital_status0", cd_education_status0="cd_education_status0")
                              hashjoin(condition="wr_refunded_addr_sk = ca_address_sk and ((ca_country = ?15 and ca_state in row(?16) and between asymmetric($9, ?17, ?18)) or (ca_country = ?19 and ca_state in row(?20) and between asymmetric($9, ?21, ?22)) or (ca_country = ?23 and ca_state in row(?24) and between asymmetric($9, ?25, ?26)))", type="inner")
                                osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk`, `ca_state`, `ca_country` from `cci_customer_address` as `cci_customer_address` where (((`ca_country` = ?) and (`ca_state` in(?))) or ((`ca_country` = ?) and (`ca_state` in(?))) or ((`ca_country` = ?) and (`ca_state` in(?))))")
                                exchange(distribution=hash[9]192, collation=[])
                                  project(ws_sold_date_sk="ws_sold_date_sk", ws_item_sk="ws_item_sk", ws_web_page_sk="ws_web_page_sk", ws_order_number="ws_order_number", ws_quantity="ws_quantity", ws_sales_price="ws_sales_price", ws_net_profit="ws_net_profit", wr_item_sk="wr_item_sk", wr_refunded_cdemo_sk="wr_refunded_cdemo_sk", wr_refunded_addr_sk="wr_refunded_addr_sk", wr_returning_cdemo_sk="wr_returning_cdemo_sk", wr_reason_sk="wr_reason_sk", wr_order_number="wr_order_number", wr_fee="wr_fee", wr_refunded_cash="wr_refunded_cash", d_date_sk="d_date_sk", cd_demo_sk="cd_demo_sk0", cd_marital_status="cd_marital_status0", cd_education_status="cd_education_status0", cd_demo_sk0="cd_demo_sk", cd_marital_status0="cd_marital_status", cd_education_status0="cd_education_status")
                                    hashjoin(condition="wr_returning_cdemo_sk = cd_demo_sk and ((cd_marital_status = ?3 and cd_marital_status = cd_marital_status and cd_education_status = ?4 and cd_education_status = cd_education_status and between asymmetric($8, ?5, ?6)) or (cd_marital_status = ?7 and cd_marital_status = cd_marital_status and cd_education_status = ?8 and cd_education_status = cd_education_status and between asymmetric($8, ?9, ?10)) or (cd_marital_status = ?11 and cd_marital_status = cd_marital_status and cd_education_status = ?12 and cd_education_status = cd_education_status and between asymmetric($8, ?13, ?14)))", type="inner")
                                      exchange(distribution=hash[0]192, collation=[])
                                        osstablescan(tables="cci_customer_demographics[p1]", sql="select `cd_demo_sk`, `cd_marital_status`, `cd_education_status` from `cci_customer_demographics` as `cci_customer_demographics`")
                                      exchange(distribution=hash[10]192, collation=[])
