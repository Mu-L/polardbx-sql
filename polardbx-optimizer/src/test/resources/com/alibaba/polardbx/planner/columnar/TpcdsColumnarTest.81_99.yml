- sql: |
    -- query 86
    select *, rank() over ( partition by lochierarchy, case when classgroup = 0 then i_category end order by total_sum desc) as rank_within_parent from ( select sum(ws_net_paid) as total_sum ,i_category ,i_class ,grouping(i_class) as classgroup ,grouping(i_category)+grouping(i_class) as lochierarchy from web_sales ,date_dim       d1 ,item where d1.d_month_seq between 1200 and 1200+11 and d1.d_date_sk = ws_sold_date_sk and i_item_sk  = ws_item_sk group by rollup(i_category,i_class) ) order by lochierarchy desc, case when lochierarchy = 0 then i_category end, rank_within_parent limit 100;
  plan: |
    project(total_sum="total_sum", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", rank_within_parent="rank_within_parent")
      topn(sort="lochierarchy desc,$6 asc,rank_within_parent asc", offset=0, fetch=?4)
        exchange(distribution=single, collation=[4 desc-nulls-last, 6 asc-nulls-first, 5 asc-nulls-first])
          topn(sort="lochierarchy desc,$6 asc,rank_within_parent asc", fetch=?4)
            project(total_sum="total_sum", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", rank_within_parent="f7w0$o0", $6="$6")
              sortwindow(total_sum="total_sum", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", $5="$5", $6="$6", f7w0$o0="window#0rank($0)", reference windows="window#0=window(partition {4, 5} order by [0 desc-nulls-last] rows between unbounded preceding and current row aggs [rank($0)])")
                memsort(sort="lochierarchy asc,$5 asc,total_sum desc")
                  exchange(distribution=hash[4, 5], collation=[])
                    project(total_sum="total_sum", i_category="i_category", i_class="i_class", classgroup="case(=($2, 0), 0, =($2, 2), 1, 1)", lochierarchy="case(=($2, 0), 0, =($2, 2), 0, 1) + case(=($2, 0), 0, =($2, 2), 1, 1)", $5="case(=(case(=($2, 0), 0, =($2, 2), 1, 1), 0), $1, null)", $6="case(=(+(case(=($2, 0), 0, =($2, 2), 0, 1), case(=($2, 0), 0, =($2, 2), 1, 1)), ?3), $1, null)")
                      hashagg(group="i_class,i_category,$e", total_sum="sum(total_sum)")
                        exchange(distribution=hash[2]192, collation=[])
                          partialhashagg(group="i_class,i_category,$e", total_sum="sum(ws_net_paid)")
                            expand(projects="{d_date_sk=d_date_sk, ws_sold_date_sk=ws_sold_date_sk, ws_item_sk=ws_item_sk, ws_net_paid=ws_net_paid, i_item_sk=i_item_sk, i_class=i_class, i_category=i_category, $e=0}, {d_date_sk=d_date_sk, ws_sold_date_sk=ws_sold_date_sk, ws_item_sk=ws_item_sk, ws_net_paid=ws_net_paid, i_item_sk=i_item_sk, i_class=null, i_category=i_category, $e=2}, {d_date_sk=d_date_sk, ws_sold_date_sk=ws_sold_date_sk, ws_item_sk=ws_item_sk, ws_net_paid=ws_net_paid, i_item_sk=i_item_sk, i_class=null, i_category=null, $e=3}")
                              hashjoin(condition="i_item_sk = ws_item_sk", type="inner")
                                project(d_date_sk="d_date_sk", ws_sold_date_sk="ws_sold_date_sk", ws_item_sk="ws_item_sk", ws_net_paid="ws_net_paid")
                                  hashjoin(condition="ws_sold_date_sk = d_date_sk", type="inner")
                                    osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_item_sk`, `ws_net_paid` from `cci_web_sales` as `cci_web_sales`")
                                    exchange(distribution=broadcast, collation=[])
                                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_class`, `i_category` from `cci_item` as `cci_item`")

- sql: |
    -- query 87
    select count(*) from ((select distinct c_last_name, c_first_name, d_date from store_sales, date_dim, customer where store_sales.ss_sold_date_sk = date_dim.d_date_sk and store_sales.ss_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200+11) except (select distinct c_last_name, c_first_name, d_date from catalog_sales, date_dim, customer where catalog_sales.cs_sold_date_sk = date_dim.d_date_sk and catalog_sales.cs_bill_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200+11) except (select distinct c_last_name, c_first_name, d_date from web_sales, date_dim, customer where web_sales.ws_sold_date_sk = date_dim.d_date_sk and web_sales.ws_bill_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200+11) ) cool_cust ;
  plan: |
    hashagg(count(*)="sum(count(*))")
      exchange(distribution=single, collation=[])
        partialhashagg(count(*)="count()")
          semihashjoin(condition="c_last_name <=> c_last_name and c_first_name <=> c_first_name and d_date <=> d_date", type="anti", build="inner")
            semihashjoin(condition="c_last_name <=> c_last_name and c_first_name <=> c_first_name and d_date <=> d_date", type="anti", build="inner")
              hashagg(group="d_date,c_first_name,c_last_name")
                exchange(distribution=hash[2]192, collation=[])
                  partialhashagg(group="d_date,c_first_name,c_last_name")
                    hashjoin(condition="c_customer_sk = ss_customer_sk", type="inner")
                      hashagg(group="d_date,ss_customer_sk")
                        exchange(distribution=hash[1]192, collation=[])
                          project(d_date="d_date", ss_customer_sk="ss_customer_sk")
                            partialhashagg(group="ss_customer_sk,d_date")
                              hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                                osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_customer_sk` from `cci_store_sales` as `cci_store_sales`")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                      osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")
              project(c_last_name="c_last_name", c_first_name="c_first_name", d_date="d_date")
                hashagg(group="d_date,c_first_name,c_last_name")
                  exchange(distribution=hash[2]192, collation=[])
                    partialhashagg(group="d_date,c_first_name,c_last_name")
                      hashjoin(condition="c_customer_sk = cs_bill_customer_sk", type="inner")
                        hashagg(group="d_date,cs_bill_customer_sk")
                          exchange(distribution=hash[1]192, collation=[])
                            project(d_date="d_date", cs_bill_customer_sk="cs_bill_customer_sk")
                              partialhashagg(group="cs_bill_customer_sk,d_date")
                                hashjoin(condition="cs_sold_date_sk = d_date_sk", type="inner")
                                  osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `cs_sold_date_sk`, `cs_bill_customer_sk` from `cci_catalog_sales` as `cci_catalog_sales`")
                                  exchange(distribution=broadcast, collation=[])
                                    osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                        osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")
            project(c_last_name="c_last_name", c_first_name="c_first_name", d_date="d_date")
              hashagg(group="d_date,c_first_name,c_last_name")
                exchange(distribution=hash[2]192, collation=[])
                  partialhashagg(group="d_date,c_first_name,c_last_name")
                    hashjoin(condition="c_customer_sk = ws_bill_customer_sk", type="inner")
                      hashagg(group="d_date,ws_bill_customer_sk")
                        exchange(distribution=hash[1]192, collation=[])
                          project(d_date="d_date", ws_bill_customer_sk="ws_bill_customer_sk")
                            partialhashagg(group="ws_bill_customer_sk,d_date")
                              hashjoin(condition="ws_sold_date_sk = d_date_sk", type="inner")
                                osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_bill_customer_sk` from `cci_web_sales` as `cci_web_sales`")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                      osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")

