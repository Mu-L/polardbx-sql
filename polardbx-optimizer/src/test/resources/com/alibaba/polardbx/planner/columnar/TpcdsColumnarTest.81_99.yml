    limit(offset=0, fetch=?12)
      exchange(distribution=single, collation=[0 asc-nulls-first])
        memsort(sort="am_pm_ratio asc")
          project(am_pm_ratio="cast(amc) / cast(pmc)")
            nljoin(condition="true", type="inner")
              hashagg(pmc="sum(pmc)")
                exchange(distribution=single, collation=[])
                  partialhashagg(pmc="count()")
                    hashjoin(condition="ws_ship_hdemo_sk = hd_demo_sk", type="inner")
                      hashjoin(condition="t_time_sk = ws_sold_time_sk", type="inner")
                        project(wp_web_page_sk="wp_web_page_sk", ws_sold_time_sk="ws_sold_time_sk", ws_ship_hdemo_sk="ws_ship_hdemo_sk", ws_web_page_sk="ws_web_page_sk")
                          hashjoin(condition="ws_web_page_sk = wp_web_page_sk", type="inner")
                            osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_time_sk`, `ws_ship_hdemo_sk`, `ws_web_page_sk` from `cci_web_sales` as `cci_web_sales`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_web_page[p1]", sql="select `wp_web_page_sk` from `cci_web_page` as `cci_web_page` where (`wp_char_count` between ? and ?)")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_time_dim[p1]", sql="select `t_time_sk` from `cci_time_dim` as `cci_time_dim` where (`t_hour` between ? and 20)")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_household_demographics[p1]", sql="select `hd_demo_sk` from `cci_household_demographics` as `cci_household_demographics` where (`hd_dep_count` = ?)")
              hashagg(amc="sum(amc)")
                exchange(distribution=single, collation=[])
                  partialhashagg(amc="count()")
                    hashjoin(condition="ws_ship_hdemo_sk = hd_demo_sk", type="inner")
                      hashjoin(condition="t_time_sk = ws_sold_time_sk", type="inner")
                        project(wp_web_page_sk="wp_web_page_sk", ws_sold_time_sk="ws_sold_time_sk", ws_ship_hdemo_sk="ws_ship_hdemo_sk", ws_web_page_sk="ws_web_page_sk")
                          hashjoin(condition="ws_web_page_sk = wp_web_page_sk", type="inner")
                            osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_time_sk`, `ws_ship_hdemo_sk`, `ws_web_page_sk` from `cci_web_sales` as `cci_web_sales`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_web_page[p1]", sql="select `wp_web_page_sk` from `cci_web_page` as `cci_web_page` where (`wp_char_count` between ? and ?)")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_time_dim[p1]", sql="select `t_time_sk` from `cci_time_dim` as `cci_time_dim` where (`t_hour` between ? and 9)")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_household_demographics[p1]", sql="select `hd_demo_sk` from `cci_household_demographics` as `cci_household_demographics` where (`hd_dep_count` = ?)")

- sql: |
    -- query 91
    select cc_call_center_id Call_Center, cc_name Call_Center_Name, cc_manager Manager, sum(cr_net_loss) Returns_Loss from call_center, catalog_returns, date_dim, customer, customer_address, customer_demographics, household_demographics where cr_call_center_sk       = cc_call_center_sk and     cr_returned_date_sk     = d_date_sk and     cr_returning_customer_sk= c_customer_sk and     cd_demo_sk              = c_current_cdemo_sk and     hd_demo_sk              = c_current_hdemo_sk and     ca_address_sk           = c_current_addr_sk and     d_year                  = 1998 and     d_moy                   = 11 and     ( (cd_marital_status       = 'M' and cd_education_status     = 'Unknown') or(cd_marital_status       = 'W' and cd_education_status     = 'Advanced Degree')) and     hd_buy_potential like 'Unknown%' and     ca_gmt_offset           = -7 group by cc_call_center_id,cc_name,cc_manager,cd_marital_status,cd_education_status order by sum(cr_net_loss) desc;
  plan: |
    exchange(distribution=single, collation=[3 desc-nulls-last])
      memsort(sort="returns_loss desc")
        project(call_center="cc_call_center_id", call_center_name="cc_name", manager="cc_manager", returns_loss="returns_loss")
          hashagg(group="cd_marital_status,cd_education_status,cc_call_center_id,cc_name,cc_manager", returns_loss="sum(cr_net_loss)")
            hashjoin(condition="cr_call_center_sk = cc_call_center_sk", type="inner")
              exchange(distribution=hash[12]192, collation=[])
                project(d_date_sk="d_date_sk", cr_returned_date_sk="cr_returned_date_sk", cr_returning_customer_sk="cr_returning_customer_sk", cr_call_center_sk="cr_call_center_sk", cr_net_loss="cr_net_loss", c_customer_sk="c_customer_sk", c_current_cdemo_sk="c_current_cdemo_sk", c_current_hdemo_sk="c_current_hdemo_sk", c_current_addr_sk="c_current_addr_sk", hd_demo_sk="hd_demo_sk", cd_demo_sk="cd_demo_sk", cd_marital_status="cd_marital_status", cd_education_status="cd_education_status", ca_address_sk="ca_address_sk")
                  hashjoin(condition="ca_address_sk = c_current_addr_sk", type="inner")
                    osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk` from `cci_customer_address` as `cci_customer_address` where (`ca_gmt_offset` = ?)")
                    exchange(distribution=hash[8]192, collation=[])
                      hashjoin(condition="c_current_cdemo_sk = cd_demo_sk", type="inner")
                        exchange(distribution=hash[6]192, collation=[])
                          hashjoin(condition="hd_demo_sk = c_current_hdemo_sk", type="inner")
                            project(d_date_sk="d_date_sk", cr_returned_date_sk="cr_returned_date_sk", cr_returning_customer_sk="cr_returning_customer_sk", cr_call_center_sk="cr_call_center_sk", cr_net_loss="cr_net_loss", c_customer_sk="c_customer_sk", c_current_cdemo_sk="c_current_cdemo_sk", c_current_hdemo_sk="c_current_hdemo_sk", c_current_addr_sk="c_current_addr_sk")
                              hashjoin(condition="c_customer_sk = cr_returning_customer_sk", type="inner")
                                osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_current_cdemo_sk`, `c_current_hdemo_sk`, `c_current_addr_sk` from `cci_customer` as `cci_customer`")
                                exchange(distribution=hash[2]192, collation=[])
                                  project(d_date_sk="d_date_sk", cr_returned_date_sk="cr_returned_date_sk", cr_returning_customer_sk="cr_returning_customer_sk", cr_call_center_sk="cr_call_center_sk", cr_net_loss="cr_net_loss")
                                    hashjoin(condition="cr_returned_date_sk = d_date_sk", type="inner")
                                      osstablescan(tables="cci_catalog_returns[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `cr_returned_date_sk`, `cr_returning_customer_sk`, `cr_call_center_sk`, `cr_net_loss` from `cci_catalog_returns` as `cci_catalog_returns`")
                                      exchange(distribution=broadcast, collation=[])
                                        osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = ?))")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_household_demographics[p1]", sql="select `hd_demo_sk` from `cci_household_demographics` as `cci_household_demographics` where (`hd_buy_potential` like ?)")
                        exchange(distribution=hash[0]192, collation=[])
                          osstablescan(tables="cci_customer_demographics[p1]", sql="select `cd_demo_sk`, `cd_marital_status`, `cd_education_status` from `cci_customer_demographics` as `cci_customer_demographics` where (((`cd_marital_status` = ?) and (`cd_education_status` = ?)) or ((`cd_marital_status` = ?) and (`cd_education_status` = ?)))")
              exchange(distribution=broadcast, collation=[])
                osstablescan(tables="cci_call_center[p1]", sql="select `cc_call_center_sk`, `cc_call_center_id`, `cc_name`, `cc_manager` from `cci_call_center` as `cci_call_center`")

- sql: |
    -- query 92
    select sum(ws_ext_discount_amt)  as "Excess Discount Amount" from web_sales ,item ,date_dim where i_manufact_id = 350 and i_item_sk = ws_item_sk and d_date between '2000-01-27' and date_add(cast('2000-01-27' as date), 90) and d_date_sk = ws_sold_date_sk and ws_ext_discount_amt > ( SELECT 1.3 * avg(ws_ext_discount_amt) FROM web_sales ,date_dim WHERE ws_item_sk = i_item_sk and d_date between '2000-01-27' and date_add(cast('2000-01-27' as date), 90) and d_date_sk = ws_sold_date_sk ) order by sum(ws_ext_discount_amt) limit 100;
  plan: |
    limit(offset=0, fetch=?8)
      memsort(sort="excess discount amount asc")
        hashagg(excess discount amount="sum(excess discount amount)")
          exchange(distribution=single, collation=[])
            partialhashagg(excess discount amount="sum(ws_ext_discount_amt)")
              hashjoin(condition="ws_item_sk = ws_item_sk and ws_ext_discount_amt > ?4 * $f1 / $f2 and ws_item_sk = i_item_sk", type="inner")
                hashjoin(condition="d_date_sk = ws_sold_date_sk", type="inner")
                  osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_item_sk`, `ws_ext_discount_amt` from `cci_web_sales` as `cci_web_sales`")
                  exchange(distribution=broadcast, collation=[])
                    osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_date` between ? and '2000-04-26')")
                exchange(distribution=broadcast, collation=[])
                  hashjoin(condition="i_item_sk = ws_item_sk", type="inner")
                    hashagg(group="ws_item_sk", $f1="sum($f1)", $f2="sum($f2)")
                      exchange(distribution=hash[0]192, collation=[])
                        partialhashagg(group="ws_item_sk", $f1="sum(ws_ext_discount_amt)", $f2="count(ws_ext_discount_amt)")
                          hashjoin(condition="ws_sold_date_sk = d_date_sk", type="inner")
                            semihashjoin(condition="ws_item_sk = i_item_sk", type="semi", build="inner")
                              osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_item_sk`, `ws_ext_discount_amt` from `cci_web_sales` as `cci_web_sales`")
                              exchange(distribution=broadcast, collation=[])
                                osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item` where (`i_manufact_id` = ?)")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_date` between ? and '2000-04-26')")
                    exchange(distribution=hash[0]192, collation=[])
                      osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item` where (`i_manufact_id` = ?)")

- sql: |
    -- query 93
    select  ss_customer_sk ,sum(act_sales) sumsales from (select ss_item_sk ,ss_ticket_number ,ss_customer_sk ,case when sr_return_quantity is not null then (ss_quantity-sr_return_quantity)*ss_sales_price else (ss_quantity*ss_sales_price) end act_sales from store_sales left outer join store_returns on (sr_item_sk = ss_item_sk and sr_ticket_number = ss_ticket_number) ,reason where sr_reason_sk = r_reason_sk and r_reason_desc = 'reason 28') t group by ss_customer_sk order by sumsales, ss_customer_sk limit 100;
  plan: |
    topn(sort="sumsales asc,ss_customer_sk asc", offset=0, fetch=?1)
      exchange(distribution=single, collation=[1 asc-nulls-first, 0 asc-nulls-first])
        topn(sort="sumsales asc,ss_customer_sk asc", fetch=?1)
          hashagg(group="ss_customer_sk", sumsales="sum(sumsales)")
            exchange(distribution=hash[0]192, collation=[])
              partialhashagg(group="ss_customer_sk", sumsales="sum(case)")
                project(r_reason_sk="r_reason_sk", ss_customer_sk="ss_customer_sk", sr_reason_sk="sr_reason_sk", case="case(is not null($8), *(-($3, $8), $4), *($3, $4))")
                  hashjoin(condition="sr_item_sk = ss_item_sk and sr_ticket_number = ss_ticket_number", type="inner", partition=[local])
                    osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `ss_item_sk`, `ss_customer_sk`, `ss_ticket_number`, `ss_quantity`, `ss_sales_price` from `cci_store_sales` as `cci_store_sales`")
                    hashjoin(condition="sr_reason_sk = r_reason_sk", type="inner")
                      osstablescan(tables="cci_store_returns[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `sr_item_sk`, `sr_reason_sk`, `sr_ticket_number`, `sr_return_quantity` from `cci_store_returns` as `cci_store_returns`")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_reason[p1]", sql="select `r_reason_sk` from `cci_reason` as `cci_reason` where (`r_reason_desc` = ?)")

- sql: |
    -- query 94
    select count(distinct ws_order_number) as "order count" ,sum(ws_ext_ship_cost) as "total shipping cost" ,sum(ws_net_profit) as "total net profit" from web_sales ws1 ,date_dim ,customer_address ,web_site where d_date between '1999-2-01' and date_add(cast('1999-2-01' as date), 60) and ws1.ws_ship_date_sk = d_date_sk and ws1.ws_ship_addr_sk = ca_address_sk and ca_state = 'IL' and ws1.ws_web_site_sk = web_site_sk and web_company_name = 'pri' and exists (select * from web_sales ws2 where ws1.ws_order_number = ws2.ws_order_number and ws1.ws_warehouse_sk <> ws2.ws_warehouse_sk) and not exists(select * from web_returns wr1 where ws1.ws_order_number = wr1.wr_order_number) order by count(distinct ws_order_number) limit 100;
  plan: |
    limit(offset=0, fetch=?5)
      memsort(sort="order count asc")
        hashagg(order count="count(ws_order_number) filter $3", total shipping cost="min(total shipping cost) filter $4", total net profit="min(total net profit) filter $4")
          project(ws_order_number="ws_order_number", total shipping cost="total shipping cost", total net profit="total net profit", $g_0="case(=($1, 0), 0, 1) = 0", $g_1="case(=($1, 0), 0, 1) = 1")
            exchange(distribution=single, collation=[])
              hashagg(group="ws_order_number,$e", total shipping cost="sum(total shipping cost)", total net profit="sum(total net profit)")
                exchange(distribution=hash[0]192, collation=[])
                  partialhashagg(group="ws_order_number,$e", total shipping cost="sum(ws_ext_ship_cost)", total net profit="sum(ws_net_profit)")
                    expand(projects="{web_site_sk=web_site_sk, ws_ship_date_sk=ws_ship_date_sk, ws_ship_addr_sk=ws_ship_addr_sk, ws_web_site_sk=ws_web_site_sk, ws_warehouse_sk=ws_warehouse_sk, ws_order_number=ws_order_number, ws_ext_ship_cost=ws_ext_ship_cost, ws_net_profit=ws_net_profit, d_date_sk=d_date_sk, ca_address_sk=ca_address_sk, $e=0}, {web_site_sk=web_site_sk, ws_ship_date_sk=ws_ship_date_sk, ws_ship_addr_sk=ws_ship_addr_sk, ws_web_site_sk=ws_web_site_sk, ws_warehouse_sk=ws_warehouse_sk, ws_order_number=null, ws_ext_ship_cost=ws_ext_ship_cost, ws_net_profit=ws_net_profit, d_date_sk=d_date_sk, ca_address_sk=ca_address_sk, $e=1}")
                      hashjoin(condition="ca_address_sk = ws_ship_addr_sk", type="inner")
                        exchange(distribution=hash[2]192, collation=[])
                          semihashjoin(condition="ws_order_number = ws_order_number and ws_warehouse_sk <> ws_warehouse_sk", type="semi", build="outer", partition=[local])
                            project(web_site_sk="web_site_sk", ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_warehouse_sk="ws_warehouse_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk")
                              hashjoin(condition="ws_web_site_sk = web_site_sk", type="inner")
                                semihashjoin(condition="ws_order_number = wr_order_number", type="anti", build="inner")
                                  hashjoin(condition="ws_ship_date_sk = d_date_sk", type="inner")
                                    osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `ws_ship_date_sk`, `ws_ship_addr_sk`, `ws_web_site_sk`, `ws_warehouse_sk`, `ws_order_number`, `ws_ext_ship_cost`, `ws_net_profit` from `cci_web_sales` as `cci_web_sales`")
                                    exchange(distribution=broadcast, collation=[])
                                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_date` between ? and '1999-04-02')")
                                  exchange(distribution=hash[0]192, collation=[])
                                    osstablescan(tables="cci_web_returns[p1,p2,p3,...p192]", shardcount=192, sql="select `wr_order_number` from `cci_web_returns` as `cci_web_returns`")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_web_site[p1]", sql="select `web_site_sk` from `cci_web_site` as `cci_web_site` where (`web_company_name` = ?)")
                            osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `ws_warehouse_sk`, `ws_order_number` from `cci_web_sales` as `cci_web_sales`")
                        osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk` from `cci_customer_address` as `cci_customer_address` where (`ca_state` = ?)")

- sql: |
    -- query 95
    /*+TDDL:cmd_extra(enable_semi_join_reorder=false COLUMNAR_CBO_TOO_MANY_JOIN_LIMIT=20)*/with ws_wh as (select ws1.ws_order_number,ws1.ws_warehouse_sk wh1,ws2.ws_warehouse_sk wh2 from web_sales ws1,web_sales ws2 where ws1.ws_order_number = ws2.ws_order_number and ws1.ws_warehouse_sk <> ws2.ws_warehouse_sk) select count(distinct ws_order_number) as "order count" ,sum(ws_ext_ship_cost) as "total shipping cost" ,sum(ws_net_profit) as "total net profit" from web_sales ws1 ,date_dim ,customer_address ,web_site where d_date between '1999-2-01' and date_add(cast('1999-2-01' as date), 60) and ws1.ws_ship_date_sk = d_date_sk and ws1.ws_ship_addr_sk = ca_address_sk and ca_state = 'IL' and ws1.ws_web_site_sk = web_site_sk and web_company_name = 'pri' and ws1.ws_order_number in (select ws_order_number from ws_wh) and ws1.ws_order_number in (select wr_order_number from web_returns,ws_wh where wr_order_number = ws_wh.ws_order_number) order by count(distinct ws_order_number) limit 100;
  plan: |
    limit(offset=0, fetch=?5)
      memsort(sort="order count asc")
        hashagg(order count="count(ws_order_number) filter $3", total shipping cost="min(total shipping cost) filter $4", total net profit="min(total net profit) filter $4")
          project(ws_order_number="ws_order_number", total shipping cost="total shipping cost", total net profit="total net profit", $g_0="case(=($1, 0), 0, 1) = 0", $g_1="case(=($1, 0), 0, 1) = 1")
            exchange(distribution=single, collation=[])
              hashagg(group="ws_order_number,$e", total shipping cost="sum(total shipping cost)", total net profit="sum(total net profit)")
                exchange(distribution=hash[1]192, collation=[])
                  partialhashagg(group="ws_order_number,$e", total shipping cost="sum(ws_ext_ship_cost)", total net profit="sum(ws_net_profit)")
                    expand(projects="{web_site_sk=web_site_sk, ws_ship_date_sk=ws_ship_date_sk, ws_ship_addr_sk=ws_ship_addr_sk, ws_web_site_sk=ws_web_site_sk, ws_order_number=ws_order_number, ws_ext_ship_cost=ws_ext_ship_cost, ws_net_profit=ws_net_profit, d_date_sk=d_date_sk, ca_address_sk=ca_address_sk, $e=0}, {web_site_sk=web_site_sk, ws_ship_date_sk=ws_ship_date_sk, ws_ship_addr_sk=ws_ship_addr_sk, ws_web_site_sk=ws_web_site_sk, ws_order_number=null, ws_ext_ship_cost=ws_ext_ship_cost, ws_net_profit=ws_net_profit, d_date_sk=d_date_sk, ca_address_sk=ca_address_sk, $e=1}")
                      project(web_site_sk="web_site_sk", ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk")
                        filter(condition="$f9 = min_node_id_$10")
                          hashwindow(web_site_sk="web_site_sk", ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk", $f9="$f9", min_node_id_$10="window#0min($9)", reference windows="window#0=window(partition {0, 1, 2, 3, 4, 5, 6, 7, 8} order by [] range between unbounded preceding and unbounded preceding aggs [min($9)])")
                            exchange(distribution=hash[0]192, collation=[])
                              project(web_site_sk="web_site_sk", ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk", $f9="node_id()")
                                semihashjoin(condition="ws_order_number = wr_order_number", type="semi", build="outer")
                                  exchange(distribution=broadcast, collation=[])
                                    semihashjoin(condition="ws_order_number = ws_order_number", type="semi", build="outer")
                                      project(web_site_sk="web_site_sk", ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk")
                                        hashjoin(condition="ws_web_site_sk = web_site_sk", type="inner")
                                          project(ws_ship_date_sk="ws_ship_date_sk", ws_ship_addr_sk="ws_ship_addr_sk", ws_web_site_sk="ws_web_site_sk", ws_order_number="ws_order_number", ws_ext_ship_cost="ws_ext_ship_cost", ws_net_profit="ws_net_profit", d_date_sk="d_date_sk", ca_address_sk="ca_address_sk")
