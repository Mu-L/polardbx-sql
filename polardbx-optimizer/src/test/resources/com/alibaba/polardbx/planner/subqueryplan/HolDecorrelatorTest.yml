  - sql: |
      # agg
      select 1 from lineitem where l_extendedprice in 
      (select c_address from 
      (select c_mktsegment,c_address,max(c_address)as x,count(1) as cnt from customer
      where l_receiptdate > c_acctbal group by c_address,c_mktsegment) x
       where c_mktsegment = l_receiptdate and cnt > 10)
    plan: |
      project(1="?0")
        logicalsemijoin(condition="l_extendedprice = c_address0 and l_receiptdate = c_mktsegment0", type="semi")
          project(l_extendedprice="l_extendedprice", l_receiptdate="l_receiptdate")
            logicalview(tables="lineitem[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `l_orderkey`, `l_partkey`, `l_suppkey`, `l_linenumber`, `l_quantity`, `l_extendedprice`, `l_discount`, `l_tax`, `l_returnflag`, `l_linestatus`, `l_shipdate`, `l_commitdate`, `l_receiptdate`, `l_shipinstruct`, `l_shipmode`, `l_comment` from `lineitem` as `lineitem`")
          project(c_address0="c_address0", c_mktsegment0="c_mktsegment0")
            filter(condition="c_address0 = c_address")
              project(c_address="c_address", c_address0="c_address0", c_mktsegment0="c_mktsegment0")
                filter(condition="c_mktsegment = c_mktsegment0 and cnt > ?1")
                  project(c_mktsegment="c_mktsegment", c_address="c_address", cnt="cnt", c_address0="c_address0", c_mktsegment0="c_mktsegment0")
                    logicalagg(group="c_address,c_mktsegment,c_address0,c_mktsegment0", x="max(c_address)", cnt="count()")
                      project(c_address="c_address", c_mktsegment="c_mktsegment", $f2="1", c_address0="c_address0", c_mktsegment0="c_mktsegment0")
                        filter(condition="c_mktsegment0 > c_acctbal")
                          project(c_address="c_address", c_acctbal="c_acctbal", c_mktsegment="c_mktsegment", c_address0="c_address", c_mktsegment0="c_mktsegment")
                            project(c_address="c_address", c_acctbal="c_acctbal", c_mktsegment="c_mktsegment")
                              logicalview(tables="customer[p1,p2,p3,p4,p5,p6,p7,p8]", shardcount=8, sql="select `c_custkey`, `c_name`, `c_address`, `c_nationkey`, `c_phone`, `c_acctbal`, `c_mktsegment`, `c_comment` from `customer` as `customer`")
  - sql: |
