- sql: |
    -- query 1
    with customer_total_return as (select sr_customer_sk as ctr_customer_sk ,sr_store_sk as ctr_store_sk ,sum(SR_RETURN_AMT) as ctr_total_return from store_returns ,date_dim where sr_returned_date_sk = d_date_sk and d_year =2000 group by sr_customer_sk ,sr_store_sk) select  c_customer_id from customer_total_return ctr1 ,store ,customer where ctr1.ctr_total_return > (select avg(ctr_total_return)*1.2 from customer_total_return ctr2 where ctr1.ctr_store_sk = ctr2.ctr_store_sk) and s_store_sk = ctr1.ctr_store_sk and s_state = 'TN' and ctr1.ctr_customer_sk = c_customer_sk order by c_customer_id limit 100;
  plan: |
    project(c_customer_id="c_customer_id")
      topn(sort="c_customer_id asc", offset=0, fetch=?3)
        exchange(distribution=single, collation=[5 asc-nulls-first])
          topn(sort="c_customer_id asc", fetch=?3)
            hashjoin(condition="sr_store_sk = s_store_sk and sr_store_sk = sr_store_sk and ctr_total_return > $f1 / $f2 * ?1", type="inner")
              project(sr_customer_sk="sr_customer_sk", sr_store_sk="sr_store_sk", ctr_total_return="ctr_total_return", s_store_sk="s_store_sk", c_customer_sk="c_customer_sk", c_customer_id="c_customer_id")
                hashjoin(condition="c_customer_sk = sr_customer_sk", type="inner")
                  osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_customer_id` from `cci_customer` as `cci_customer`")
                  hashjoin(condition="s_store_sk = sr_store_sk", type="inner")
                    hashagg(group="sr_customer_sk,sr_store_sk", ctr_total_return="sum(ctr_total_return)")
                      exchange(distribution=hash[0]192, collation=[])
                        partialhashagg(group="sr_customer_sk,sr_store_sk", ctr_total_return="sum(sr_return_amt)")
                          hashjoin(condition="sr_returned_date_sk = d_date_sk", type="inner")
                            osstablescan(tables="cci_store_returns[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `sr_returned_date_sk`, `sr_customer_sk`, `sr_store_sk`, `sr_return_amt` from `cci_store_returns` as `cci_store_returns`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")
                    exchange(distribution=broadcast, collation=[])
                      osstablescan(tables="cci_store[p1]", sql="select `s_store_sk` from `cci_store` as `cci_store` where (`s_state` = ?)")
              exchange(distribution=broadcast, collation=[])
                hashagg(group="sr_store_sk", $f1="sum(ctr_total_return)", $f2="count(ctr_total_return)")
                  hashagg(group="sr_customer_sk,sr_store_sk", ctr_total_return="sum(ctr_total_return)")
                    exchange(distribution=hash[1]192, collation=[])
                      partialhashagg(group="sr_customer_sk,sr_store_sk", ctr_total_return="sum(sr_return_amt)")
                        hashjoin(condition="sr_returned_date_sk = d_date_sk", type="inner")
                          osstablescan(tables="cci_store_returns[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `sr_returned_date_sk`, `sr_customer_sk`, `sr_store_sk`, `sr_return_amt` from `cci_store_returns` as `cci_store_returns`")
                          exchange(distribution=broadcast, collation=[])
                            osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")

- sql: |
    -- query 2
    with wscs as (select sold_date_sk ,sales_price from (select ws_sold_date_sk sold_date_sk ,ws_ext_sales_price sales_price from web_sales union all select cs_sold_date_sk sold_date_sk ,cs_ext_sales_price sales_price from catalog_sales) t), wswscs as (select d_week_seq, sum(case when (d_day_name='Sunday') then sales_price else null end) sun_sales, sum(case when (d_day_name='Monday') then sales_price else null end) mon_sales, sum(case when (d_day_name='Tuesday') then sales_price else  null end) tue_sales, sum(case when (d_day_name='Wednesday') then sales_price else null end) wed_sales, sum(case when (d_day_name='Thursday') then sales_price else null end) thu_sales, sum(case when (d_day_name='Friday') then sales_price else null end) fri_sales, sum(case when (d_day_name='Saturday') then sales_price else null end) sat_sales from wscs ,date_dim where d_date_sk = sold_date_sk group by d_week_seq) select d_week_seq1 ,round(sun_sales1/sun_sales2,2) ,round(mon_sales1/mon_sales2,2) ,round(tue_sales1/tue_sales2,2) ,round(wed_sales1/wed_sales2,2) ,round(thu_sales1/thu_sales2,2) ,round(fri_sales1/fri_sales2,2) ,round(sat_sales1/sat_sales2,2) from (select wswscs.d_week_seq d_week_seq1 ,sun_sales sun_sales1 ,mon_sales mon_sales1 ,tue_sales tue_sales1 ,wed_sales wed_sales1 ,thu_sales thu_sales1 ,fri_sales fri_sales1 ,sat_sales sat_sales1 from wswscs,date_dim where date_dim.d_week_seq = wswscs.d_week_seq and d_year = 2001) y, (select wswscs.d_week_seq d_week_seq2 ,sun_sales sun_sales2 ,mon_sales mon_sales2 ,tue_sales tue_sales2 ,wed_sales wed_sales2 ,thu_sales thu_sales2 ,fri_sales fri_sales2 ,sat_sales sat_sales2 from wswscs ,date_dim where date_dim.d_week_seq = wswscs.d_week_seq and d_year = 2001+1) z where d_week_seq1=d_week_seq2-53 order by d_week_seq1;
  plan: |
    exchange(distribution=single, collation=[0 asc-nulls-first])
      memsort(sort="d_week_seq1 asc")
        project(d_week_seq1="d_week_seq", round(sun_sales1 / sun_sales2, 2)="round(sat_sales0 / sat_sales, ?7)", round(mon_sales1 / mon_sales2, 2)="round(sat_sales_00 / sat_sales_0, ?8)", round(tue_sales1 / tue_sales2, 2)="round(sat_sales_10 / sat_sales_1, ?9)", round(wed_sales1 / wed_sales2, 2)="round(sat_sales_20 / sat_sales_2, ?10)", round(thu_sales1 / thu_sales2, 2)="round(sat_sales_30 / sat_sales_3, ?11)", round(fri_sales1 / fri_sales2, 2)="round(sat_sales_40 / sat_sales_4, ?12)", round(sat_sales1 / sat_sales2, 2)="round(sat_sales_50 / sat_sales_5, ?13)")
          hashjoin(condition="d_week_seq = -", type="inner")
            project(sat_sales="sat_sales", sat_sales_0="sat_sales_0", sat_sales_1="sat_sales_1", sat_sales_2="sat_sales_2", sat_sales_3="sat_sales_3", sat_sales_4="sat_sales_4", sat_sales_5="sat_sales_5", -="d_week_seq - ?17")
              hashjoin(condition="d_week_seq = d_week_seq", type="inner")
                hashagg(group="d_week_seq", sat_sales="sum(sat_sales)", sat_sales_0="sum(sat_sales_0)", sat_sales_1="sum(sat_sales_1)", sat_sales_2="sum(sat_sales_2)", sat_sales_3="sum(sat_sales_3)", sat_sales_4="sum(sat_sales_4)", sat_sales_5="sum(sat_sales_5)")
                  exchange(distribution=hash[0]192, collation=[])
                    partialhashagg(group="d_week_seq", sat_sales="sum($f1)", sat_sales_0="sum($f2)", sat_sales_1="sum($f3)", sat_sales_2="sum($f4)", sat_sales_3="sum($f5)", sat_sales_4="sum($f6)", sat_sales_5="sum($f7)")
                      semihashjoin(condition="d_week_seq = d_week_seq", type="semi", build="inner")
                        project(d_week_seq="d_week_seq", $f1="case(=($4, ?0), $1, null)", $f2="case(=($4, ?1), $1, null)", $f3="case(=($4, ?2), $1, null)", $f4="case(=($4, ?3), $1, null)", $f5="case(=($4, ?4), $1, null)", $f6="case(=($4, ?5), $1, null)", $f7="case(=($4, ?6), $1, null)")
                          hashjoin(condition="sold_date_sk = d_date_sk", type="inner")
                            unionall(concurrent=true)
                              osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk` as `sold_date_sk`, `ws_ext_sales_price` as `sales_price` from `cci_web_sales` as `cci_web_sales`")
                              osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `cs_sold_date_sk` as `sold_date_sk`, `cs_ext_sales_price` as `sales_price` from `cci_catalog_sales` as `cci_catalog_sales`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_week_seq`, `d_day_name` from `cci_date_dim` as `cci_date_dim`")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_date_dim[p1]", sql="select `d_week_seq` from `cci_date_dim` as `cci_date_dim` where (`d_year` = 2002)")
                exchange(distribution=hash[0]192, collation=[])
                  osstablescan(tables="cci_date_dim[p1]", sql="select `d_week_seq` from `cci_date_dim` as `cci_date_dim` where (`d_year` = 2002)")
            project(d_week_seq="d_week_seq", sat_sales="sat_sales", sat_sales_0="sat_sales_0", sat_sales_1="sat_sales_1", sat_sales_2="sat_sales_2", sat_sales_3="sat_sales_3", sat_sales_4="sat_sales_4", sat_sales_5="sat_sales_5")
              exchange(distribution=broadcast, collation=[])
                hashjoin(condition="d_week_seq = d_week_seq", type="inner")
                  hashagg(group="d_week_seq", sat_sales="sum(sat_sales)", sat_sales_0="sum(sat_sales_0)", sat_sales_1="sum(sat_sales_1)", sat_sales_2="sum(sat_sales_2)", sat_sales_3="sum(sat_sales_3)", sat_sales_4="sum(sat_sales_4)", sat_sales_5="sum(sat_sales_5)")
                    exchange(distribution=hash[0]192, collation=[])
                      partialhashagg(group="d_week_seq", sat_sales="sum($f1)", sat_sales_0="sum($f2)", sat_sales_1="sum($f3)", sat_sales_2="sum($f4)", sat_sales_3="sum($f5)", sat_sales_4="sum($f6)", sat_sales_5="sum($f7)")
                        semihashjoin(condition="d_week_seq = d_week_seq", type="semi", build="inner")
                          project(d_week_seq="d_week_seq", $f1="case(=($4, ?0), $1, null)", $f2="case(=($4, ?1), $1, null)", $f3="case(=($4, ?2), $1, null)", $f4="case(=($4, ?3), $1, null)", $f5="case(=($4, ?4), $1, null)", $f6="case(=($4, ?5), $1, null)", $f7="case(=($4, ?6), $1, null)")
                            hashjoin(condition="sold_date_sk = d_date_sk", type="inner")
                              unionall(concurrent=true)
                                osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk` as `sold_date_sk`, `ws_ext_sales_price` as `sales_price` from `cci_web_sales` as `cci_web_sales`")
                                osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `cs_sold_date_sk` as `sold_date_sk`, `cs_ext_sales_price` as `sales_price` from `cci_catalog_sales` as `cci_catalog_sales`")
                              exchange(distribution=broadcast, collation=[])
                                osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_week_seq`, `d_day_name` from `cci_date_dim` as `cci_date_dim`")
                          exchange(distribution=broadcast, collation=[])
                            osstablescan(tables="cci_date_dim[p1]", sql="select `d_week_seq` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")
                  exchange(distribution=hash[0]192, collation=[])
                    osstablescan(tables="cci_date_dim[p1]", sql="select `d_week_seq` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")

- sql: |
    -- query 3
    select  dt.d_year ,item.i_brand_id brand_id ,item.i_brand brand ,sum(ss_ext_sales_price) sum_agg from  date_dim dt ,store_sales ,item where dt.d_date_sk = store_sales.ss_sold_date_sk and store_sales.ss_item_sk = item.i_item_sk and item.i_manufact_id = 128 and dt.d_moy=11 group by dt.d_year ,item.i_brand ,item.i_brand_id order by dt.d_year ,sum_agg desc ,brand_id limit 100;
  plan: |
    project(d_year="d_year", brand_id="i_brand_id", brand="i_brand", sum_agg="sum_agg")
      topn(sort="d_year asc,sum_agg desc,i_brand_id asc", offset=0, fetch=?2)
        exchange(distribution=single, collation=[2 asc-nulls-first, 3 desc-nulls-last, 0 asc-nulls-first])
          topn(sort="d_year asc,sum_agg desc,i_brand_id asc", fetch=?2)
            hashagg(group="i_brand_id,i_brand,d_year", sum_agg="sum(sum_agg)")
              exchange(distribution=hash[1]192, collation=[])
                partialhashagg(group="i_brand_id,i_brand,d_year", sum_agg="sum(ss_ext_sales_price)")
                  hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                    hashjoin(condition="i_item_sk = ss_item_sk", type="inner")
                      osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_ext_sales_price` from `cci_store_sales` as `cci_store_sales`")
                      exchange(distribution=hash[0]192, collation=[])
                        osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_brand_id`, `i_brand` from `cci_item` as `cci_item` where (`i_manufact_id` = ?)")
                    exchange(distribution=broadcast, collation=[])
                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_year` from `cci_date_dim` as `cci_date_dim` where (`d_moy` = ?)")

- sql: |
