- sql: |
    -- query 20
    select  i_item_id ,i_item_desc ,i_category ,i_class ,i_current_price ,sum(cs_ext_sales_price) as itemrevenue ,sum(cs_ext_sales_price)*100/sum(sum(cs_ext_sales_price)) over (partition by i_class) as revenueratio from	catalog_sales ,item ,date_dim where cs_item_sk = i_item_sk and i_category in ('Sports','Books','Home') and cs_sold_date_sk = d_date_sk and d_date between cast('1999-02-22' as date) and date_add(cast('1999-02-22' as date), 30) group by i_item_id ,i_item_desc ,i_category ,i_class ,i_current_price order by i_category ,i_class ,i_item_id ,i_item_desc ,revenueratio limit 100;
  plan: |
    topn(sort="i_category asc,i_class asc,i_item_id asc,i_item_desc asc,revenueratio asc", offset=0, fetch=?5)
      exchange(distribution=single, collation=[2 asc-nulls-first, 3 asc-nulls-first, 0 asc-nulls-first, 1 asc-nulls-first, 6 asc-nulls-first])
        topn(sort="i_category asc,i_class asc,i_item_id asc,i_item_desc asc,revenueratio asc", fetch=?5)
          project(i_item_id="i_item_id", i_item_desc="i_item_desc", i_category="i_category", i_class="i_class", i_current_price="i_current_price", itemrevenue="itemrevenue", revenueratio="$6 / f7w0$o0")
            hashwindow(i_item_id="i_item_id", i_item_desc="i_item_desc", i_category="i_category", i_class="i_class", i_current_price="i_current_price", itemrevenue="itemrevenue", $6="$6", f7w0$o0="window#0sum($5)", reference windows="window#0=window(partition {3} order by [] range between unbounded preceding and unbounded following aggs [sum($5)])")
              project(i_item_id="i_item_id", i_item_desc="i_item_desc", i_category="i_category", i_class="i_class", i_current_price="i_current_price", itemrevenue="itemrevenue", $6="itemrevenue * ?0")
                hashagg(group="i_item_id,i_item_desc,i_current_price,i_class,i_category", itemrevenue="sum(itemrevenue)")
                  exchange(distribution=hash[3]192, collation=[])
                    partialhashagg(group="i_item_id,i_item_desc,i_current_price,i_class,i_category", itemrevenue="sum(itemrevenue)")
                      hashjoin(condition="i_item_sk = cs_item_sk", type="inner")
                        hashagg(group="cs_item_sk", itemrevenue="sum(cs_ext_sales_price)", partition=[local])
                          hashjoin(condition="cs_sold_date_sk = d_date_sk", type="inner")
                            osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `cs_sold_date_sk`, `cs_item_sk`, `cs_ext_sales_price` from `cci_catalog_sales` as `cci_catalog_sales`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_date` between '1999-02-22' and '1999-03-24')")
                        exchange(distribution=hash[0]192, collation=[])
                          osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_item_id`, `i_item_desc`, `i_current_price`, `i_class`, `i_category` from `cci_item` as `cci_item` where (`i_category` in(?))")
