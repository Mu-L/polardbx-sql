            hashagg(group="channel,i_brand_id,i_class_id,i_category_id,$e", sum(sales)="sum(sum(sales))", sum(number_sales)="sum(sum(number_sales))")
              exchange(distribution=hash[4]192, collation=[])
                partialhashagg(group="channel,i_brand_id,i_class_id,i_category_id,$e", sum(sales)="sum(sales)", sum(number_sales)="sum(number_sales)")
                  expand(projects="{channel=channel, i_brand_id=i_brand_id, i_class_id=i_class_id, i_category_id=i_category_id, sales=sales, number_sales=number_sales, $e=0}, {channel=channel, i_brand_id=i_brand_id, i_class_id=i_class_id, i_category_id=null, sales=sales, number_sales=number_sales, $e=1}, {channel=channel, i_brand_id=i_brand_id, i_class_id=null, i_category_id=null, sales=sales, number_sales=number_sales, $e=3}, {channel=channel, i_brand_id=null, i_class_id=null, i_category_id=null, sales=sales, number_sales=number_sales, $e=7}, {channel=null, i_brand_id=null, i_class_id=null, i_category_id=null, sales=sales, number_sales=number_sales, $e=15}")
