fit) as profit from (select 'store channel' as channel , 'store' || store_id as id , sales , returns , profit from   ssr union all select 'catalog channel' as channel , 'catalog_page' || catalog_page_id as id , sales , returns , profit from  csr union all select 'web channel' as channel , 'web_site' || web_site_id as id , sales , returns , profit from   wsr ) x group by rollup (channel, id) order by channel ,id limit 100;
