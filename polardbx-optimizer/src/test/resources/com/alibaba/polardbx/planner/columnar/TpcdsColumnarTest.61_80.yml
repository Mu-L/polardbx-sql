- sql: |
    -- query 70
    select *, rank() over ( partition by lochierarchy, case when countygroup = 0 then s_state end order by total_sum desc) as rank_within_parent from ( select sum(ss_net_profit) as total_sum ,s_state ,s_county ,grouping(s_county) as countygroup ,grouping(s_state)+grouping(s_county) as lochierarchy from store_sales ,date_dim       d1 ,store where d1.d_month_seq between 1200 and 1200+11 and d1.d_date_sk = ss_sold_date_sk and s_store_sk  = ss_store_sk and s_state in ( select s_state from ( select s_state, rank() over ( partition by s_state order by s_profit_sum desc ) as ranking from ( select s_state as s_state, sum(ss_net_profit) as s_profit_sum from store_sales, store, date_dim where d_month_seq between 1200 and 1200 + 11 and d_date_sk = ss_sold_date_sk and s_store_sk = ss_store_sk group by s_state ) tmp1 ) where ranking <= 5 ) group by rollup(s_state,s_county) ) order by lochierarchy desc ,case when lochierarchy = 0 then s_state end ,rank_within_parent limit 100;
  plan: |
    project(total_sum="total_sum", s_state="s_state", s_county="s_county", countygroup="countygroup", lochierarchy="lochierarchy", rank_within_parent="rank_within_parent")
