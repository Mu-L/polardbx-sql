        exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first, 3 asc-nulls-first, 4 asc-nulls-first])
          memsort(sort="cd_gender asc,cd_marital_status asc,cd_education_status asc,cd_purchase_estimate asc,cd_credit_rating asc")
            hashagg(group="cd_gender,cd_marital_status,cd_education_status,cd_purchase_estimate,cd_credit_rating", cnt3="sum(cnt3)")
              exchange(distribution=hash[4]192, collation=[])
                hashjoin(condition="c_current_cdemo_sk = cd_demo_sk", type="inner")
                  hashagg(group="c_current_cdemo_sk", cnt3="sum(cnt3)")
                    exchange(distribution=hash[0]192, collation=[])
                      partialhashagg(group="c_current_cdemo_sk", cnt3="count()")
                        hashjoin(condition="c_current_addr_sk = ca_address_sk", type="inner")
                          osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk` from `cci_customer_address` as `cci_customer_address` where (`ca_state` in(?))")
                          exchange(distribution=hash[2]192, collation=[])
