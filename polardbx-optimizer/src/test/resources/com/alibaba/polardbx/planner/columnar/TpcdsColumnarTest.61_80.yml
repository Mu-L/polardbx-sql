            project(total_sum="total_sum", s_state="s_state", s_county="s_county", countygroup="countygroup", lochierarchy="lochierarchy", rank_within_parent="f7w0$o0", $6="$6")
              sortwindow(total_sum="total_sum", s_state="s_state", s_county="s_county", countygroup="countygroup", lochierarchy="lochierarchy", $5="$5", $6="$6", f7w0$o0="window#0rank($0)", reference windows="window#0=window(partition {4, 5} order by [0 desc-nulls-last] rows between unbounded preceding and current row aggs [rank($0)])")
                memsort(sort="lochierarchy asc,$5 asc,total_sum desc")
                  exchange(distribution=hash[4, 5], collation=[])
                    project(total_sum="total_sum", s_state="s_state", s_county="s_county", countygroup="case(=($2, 0), 0, =($2, 2), 1, 1)", lochierarchy="case(=($2, 0), 0, =($2, 2), 0, 1) + case(=($2, 0), 0, =($2, 2), 1, 1)", $5="case(=(case(=($2, 0), 0, =($2, 2), 1, 1), 0), $1, null)", $6="case(=(+(case(=($2, 0), 0, =($2, 2), 0, 1), case(=($2, 0), 0, =($2, 2), 1, 1)), ?7), $1, null)")
                      hashagg(group="s_county,s_state,$e", total_sum="sum(total_sum)")
                        exchange(distribution=hash[2]192, collation=[])
                          partialhashagg(group="s_county,s_state,$e", total_sum="sum(ss_net_profit)")
                            expand(projects="{d_date_sk=d_date_sk, ss_sold_date_sk=ss_sold_date_sk, ss_store_sk=ss_store_sk, ss_net_profit=ss_net_profit, s_store_sk=s_store_sk, s_county=s_county, s_state=s_state, $e=0}, {d_date_sk=d_date_sk, ss_sold_date_sk=ss_sold_date_sk, ss_store_sk=ss_store_sk, ss_net_profit=ss_net_profit, s_store_sk=s_store_sk, s_county=null, s_state=s_state, $e=2}, {d_date_sk=d_date_sk, ss_sold_date_sk=ss_sold_date_sk, ss_store_sk=ss_store_sk, ss_net_profit=ss_net_profit, s_store_sk=s_store_sk, s_county=null, s_state=null, $e=3}")
                              hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                                project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_store_sk="ss_store_sk", ss_net_profit="ss_net_profit")
                                  hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                                    osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_store_sk`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales`")
                                    exchange(distribution=broadcast, collation=[])
                                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                                exchange(distribution=broadcast, collation=[])
                                  semihashjoin(condition="s_state = s_state", type="semi", build="inner")
                                    osstablescan(tables="cci_store[p1]", partition=[remote], sql="select `s_store_sk`, `s_county`, `s_state` from `cci_store` as `cci_store`")
                                    exchange(distribution=broadcast, collation=[])
                                      project(s_state="s_state")
                                        filter(condition="f2w0$o0 <= ?6")
                                          sortwindow(s_state="s_state", s_profit_sum="s_profit_sum", f2w0$o0="window#0rank($1)", reference windows="window#0=window(partition {0} order by [1 desc-nulls-last] rows between unbounded preceding and current row aggs [rank($1)])")
                                            memsort(sort="s_state asc,s_profit_sum desc")
                                              hashagg(group="s_state", s_profit_sum="sum(s_profit_sum)")
                                                exchange(distribution=hash[0]192, collation=[])
                                                  partialhashagg(group="s_state", s_profit_sum="sum(s_profit_sum)")
                                                    hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                                                      hashagg(group="ss_store_sk", s_profit_sum="sum(s_profit_sum)")
                                                        exchange(distribution=hash[0]192, collation=[])
                                                          partialhashagg(group="ss_store_sk", s_profit_sum="sum(ss_net_profit)")
                                                            hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                                                              osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_store_sk`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales`")
