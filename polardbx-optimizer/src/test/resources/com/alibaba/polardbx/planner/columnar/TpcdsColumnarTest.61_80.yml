- sql: |
    -- query 61
    /*+TDDL:cmd_extra(COLUMNAR_CBO_TOO_MANY_JOIN_LIMIT=20)*/select  promotions,total,cast(promotions as decimal(15,4))/cast(total as decimal(15,4))*100 from (select sum(ss_ext_sales_price) promotions from  store_sales ,store ,promotion ,date_dim ,customer ,customer_address ,item where ss_sold_date_sk = d_date_sk and   ss_store_sk = s_store_sk and   ss_promo_sk = p_promo_sk and   ss_customer_sk= c_customer_sk and   ca_address_sk = c_current_addr_sk and   ss_item_sk = i_item_sk and   ca_gmt_offset = -5 and   i_category = 'Jewelry' and   (p_channel_dmail = 'Y' or p_channel_email = 'Y' or p_channel_tv = 'Y') and   s_gmt_offset = -5 and   d_year = 1998 and   d_moy  = 11) promotional_sales, (select sum(ss_ext_sales_price) total from  store_sales ,store ,date_dim ,customer ,customer_address ,item where ss_sold_date_sk = d_date_sk and   ss_store_sk = s_store_sk and   ss_customer_sk= c_customer_sk and   ca_address_sk = c_current_addr_sk and   ss_item_sk = i_item_sk and   ca_gmt_offset = -5 and   i_category = 'Jewelry' and   s_gmt_offset = -5 and   d_year = 1998 and   d_moy  = 11) all_sales order by promotions, total limit 100;
  plan: |
    project(promotions="promotions", total="total", cast(promotions as decimal(15, 4)) / cast(total as decimal(15, 4)) * 100="cast(promotions) / cast(total) * ?0")
      limit(offset=0, fetch=?14)
        memsort(sort="promotions asc,total asc")
          nljoin(condition="true", type="inner")
            hashagg(promotions="sum(promotions)")
              exchange(distribution=single, collation=[])
                partialhashagg(promotions="sum(ss_ext_sales_price)")
                  hashjoin(condition="c_current_addr_sk = ca_address_sk", type="inner")
                    exchange(distribution=hash[11]192, collation=[])
                      project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_promo_sk="ss_promo_sk", ss_ext_sales_price="ss_ext_sales_price", s_store_sk="s_store_sk", p_promo_sk="p_promo_sk", i_item_sk="i_item_sk", c_customer_sk="c_customer_sk", c_current_addr_sk="c_current_addr_sk")
                        hashjoin(condition="ss_customer_sk = c_customer_sk", type="inner")
                          osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_current_addr_sk` from `cci_customer` as `cci_customer`")
                          exchange(distribution=hash[3]192, collation=[])
                            project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_promo_sk="ss_promo_sk", ss_ext_sales_price="ss_ext_sales_price", s_store_sk="s_store_sk", p_promo_sk="p_promo_sk", i_item_sk="i_item_sk")
                              hashjoin(condition="p_promo_sk = ss_promo_sk", type="inner")
                                project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_promo_sk="ss_promo_sk", ss_ext_sales_price="ss_ext_sales_price", s_store_sk="s_store_sk", i_item_sk="i_item_sk")
                                  hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                                    hashjoin(condition="i_item_sk = ss_item_sk", type="inner")
                                      project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_promo_sk="ss_promo_sk", ss_ext_sales_price="ss_ext_sales_price")
                                        hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                                          osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_customer_sk`, `ss_store_sk`, `ss_promo_sk`, `ss_ext_sales_price` from `cci_store_sales` as `cci_store_sales`")
                                          exchange(distribution=broadcast, collation=[])
                                            osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = ?))")
                                      exchange(distribution=hash[0]192, collation=[])
                                        osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item` where (`i_category` = ?)")
                                    exchange(distribution=broadcast, collation=[])
                                      osstablescan(tables="cci_store[p1]", sql="select `s_store_sk` from `cci_store` as `cci_store` where (`s_gmt_offset` = ?)")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_promotion[p1]", sql="select `p_promo_sk` from `cci_promotion` as `cci_promotion` where ((`p_channel_dmail` = ?) or (`p_channel_email` = ?) or (`p_channel_tv` = ?))")
                    osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk` from `cci_customer_address` as `cci_customer_address` where (`ca_gmt_offset` = ?)")
            hashagg(total="sum(total)")
              exchange(distribution=single, collation=[])
                partialhashagg(total="sum(ss_ext_sales_price)")
                  hashjoin(condition="c_current_addr_sk = ca_address_sk", type="inner")
                    exchange(distribution=hash[9]192, collation=[])
                      project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_ext_sales_price="ss_ext_sales_price", s_store_sk="s_store_sk", i_item_sk="i_item_sk", c_customer_sk="c_customer_sk", c_current_addr_sk="c_current_addr_sk")
                        hashjoin(condition="ss_customer_sk = c_customer_sk", type="inner")
                          osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_current_addr_sk` from `cci_customer` as `cci_customer`")
                          exchange(distribution=hash[3]192, collation=[])
                            project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_ext_sales_price="ss_ext_sales_price", s_store_sk="s_store_sk", i_item_sk="i_item_sk")
                              hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                                hashjoin(condition="i_item_sk = ss_item_sk", type="inner")
                                  project(d_date_sk="d_date_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_customer_sk="ss_customer_sk", ss_store_sk="ss_store_sk", ss_ext_sales_price="ss_ext_sales_price")
                                    hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                                      osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_customer_sk`, `ss_store_sk`, `ss_ext_sales_price` from `cci_store_sales` as `cci_store_sales`")
                                      exchange(distribution=broadcast, collation=[])
                                        osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = ?))")
                                  exchange(distribution=hash[0]192, collation=[])
                                    osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item` where (`i_category` = ?)")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_store[p1]", sql="select `s_store_sk` from `cci_store` as `cci_store` where (`s_gmt_offset` = ?)")
                    osstablescan(tables="cci_customer_address[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ca_address_sk` from `cci_customer_address` as `cci_customer_address` where (`ca_gmt_offset` = ?)")

- sql: |
    -- query 62
    select substr(w_warehouse_name,1,20) ,sm_type ,web_name ,sum(case when (ws_ship_date_sk - ws_sold_date_sk <= 30 ) then 1 else 0 end)  as "30 days" ,sum(case when (ws_ship_date_sk - ws_sold_date_sk > 30) and (ws_ship_date_sk - ws_sold_date_sk <= 60) then 1 else 0 end )  as "31-60 days" ,sum(case when (ws_ship_date_sk - ws_sold_date_sk > 60) and (ws_ship_date_sk - ws_sold_date_sk <= 90) then 1 else 0 end)  as "61-90 days" ,sum(case when (ws_ship_date_sk - ws_sold_date_sk > 90) and (ws_ship_date_sk - ws_sold_date_sk <= 120) then 1 else 0 end)  as "91-120 days" ,sum(case when (ws_ship_date_sk - ws_sold_date_sk  > 120) then 1 else 0 end)  as ">120 days" from web_sales ,warehouse ,ship_mode ,web_site ,date_dim where d_month_seq between 1200 and 1200 + 11 and ws_ship_date_sk   = d_date_sk and ws_warehouse_sk   = w_warehouse_sk and ws_ship_mode_sk   = sm_ship_mode_sk and ws_web_site_sk    = web_site_sk group by substr(w_warehouse_name,1,20) ,sm_type ,web_name order by substr(w_warehouse_name,1,20) ,sm_type ,web_name limit 100;
  plan: |
    project(substr(w_warehouse_name, 1, 20)="substr($f3, ?0, ?1)", sm_type="sm_type", web_name="web_name", 30 days="30 days", 31-60 days="91-120 days", 61-90 days="91-120 days_0", 91-120 days="91-120 days_1", >120 days=">120 days")
      topn(sort="substr asc,sm_type asc,web_name asc", offset=0, fetch=?27)
        exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first])
          topn(sort="substr asc,sm_type asc,web_name asc", fetch=?27)
            hashagg(group="substr,sm_type,web_name", $f3="__first_value(w_warehouse_name)", 30 days="sum(case)", 91-120 days="sum(case5)", 91-120 days_0="sum(case6)", 91-120 days_1="sum(case7)", >120 days="sum(case8)")
              project(w_warehouse_sk="w_warehouse_sk", w_warehouse_name="w_warehouse_name", substr="substr(w_warehouse_name, ?23, ?24)", ws_ship_date_sk="ws_ship_date_sk", ws_web_site_sk="ws_web_site_sk", ws_ship_mode_sk="ws_ship_mode_sk", ws_warehouse_sk="ws_warehouse_sk", case="case(<=(-($3, $2), ?2), ?3, ?4)", case5="case(and(>(-($3, $2), ?5), <=(-($3, $2), ?6)), ?7, ?8)", case6="case(and(>(-($3, $2), ?9), <=(-($3, $2), ?10)), ?11, ?12)", case7="case(and(>(-($3, $2), ?13), <=(-($3, $2), ?14)), ?15, ?16)", case8="case(>(-($3, $2), ?17), ?18, ?19)", sm_ship_mode_sk="sm_ship_mode_sk", sm_type="sm_type", web_site_sk="web_site_sk", web_name="web_name", d_date_sk="d_date_sk")
                hashjoin(condition="web_site_sk = ws_web_site_sk", type="inner")
                  project(w_warehouse_sk="w_warehouse_sk", w_warehouse_name="w_warehouse_name", ws_sold_date_sk="ws_sold_date_sk", ws_ship_date_sk="ws_ship_date_sk", ws_web_site_sk="ws_web_site_sk", ws_ship_mode_sk="ws_ship_mode_sk", ws_warehouse_sk="ws_warehouse_sk", sm_ship_mode_sk="sm_ship_mode_sk", sm_type="sm_type", d_date_sk="d_date_sk")
                    hashjoin(condition="ws_warehouse_sk = w_warehouse_sk", type="inner")
                      exchange(distribution=hash[6]192, collation=[])
                        project(ws_sold_date_sk="ws_sold_date_sk", ws_ship_date_sk="ws_ship_date_sk", ws_web_site_sk="ws_web_site_sk", ws_ship_mode_sk="ws_ship_mode_sk", ws_warehouse_sk="ws_warehouse_sk", sm_ship_mode_sk="sm_ship_mode_sk", sm_type="sm_type", d_date_sk="d_date_sk")
                          hashjoin(condition="sm_ship_mode_sk = ws_ship_mode_sk", type="inner")
                            hashjoin(condition="ws_ship_date_sk = d_date_sk", type="inner")
                              osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_ship_date_sk`, `ws_web_site_sk`, `ws_ship_mode_sk`, `ws_warehouse_sk` from `cci_web_sales` as `cci_web_sales`")
                              exchange(distribution=broadcast, collation=[])
                                osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_ship_mode[p1]", sql="select `sm_ship_mode_sk`, `sm_type` from `cci_ship_mode` as `cci_ship_mode`")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_warehouse[p1]", sql="select `w_warehouse_sk`, `w_warehouse_name` from `cci_warehouse` as `cci_warehouse`")
                  exchange(distribution=broadcast, collation=[])
                    osstablescan(tables="cci_web_site[p1]", sql="select `web_site_sk`, `web_name` from `cci_web_site` as `cci_web_site`")

- sql: |
    -- query 63
    select  * from (select i_manager_id ,sum(ss_sales_price) sum_sales ,avg(sum(ss_sales_price)) over (partition by i_manager_id) avg_monthly_sales from item ,store_sales ,date_dim ,store where ss_item_sk = i_item_sk and ss_sold_date_sk = d_date_sk and ss_store_sk = s_store_sk and d_month_seq in (1200,1200+1,1200+2,1200+3,1200+4,1200+5,1200+6,1200+7,1200+8,1200+9,1200+10,1200+11) and ((    i_category in ('Books','Children','Electronics') and i_class in ('personal','portable','reference','self-help') and i_brand in ('scholaramalgamalg #14','scholaramalgamalg #7', 'exportiunivamalg #9','scholaramalgamalg #9')) or(    i_category in ('Women','Music','Men') and i_class in ('accessories','classical','fragrances','pants') and i_brand in ('amalgimporto #1','edu packscholar #1','exportiimporto #1', 'importoamalg #1'))) group by i_manager_id, d_moy) tmp1 where case when avg_monthly_sales > 0 then abs (sum_sales - avg_monthly_sales) / avg_monthly_sales else null end > 0.1 order by i_manager_id ,avg_monthly_sales ,sum_sales limit 100;
  plan: |
    topn(sort="i_manager_id asc,f3w0$o0 asc,sum_sales asc", offset=0, fetch=?31)
      exchange(distribution=single, collation=[0 asc-nulls-first, 2 asc-nulls-first, 1 asc-nulls-first])
        topn(sort="i_manager_id asc,f3w0$o0 asc,sum_sales asc", fetch=?31)
          filter(condition="case(>($2, ?29), /(abs(-($1, $2)), $2), null) > ?30")
            hashwindow(i_manager_id="i_manager_id", sum_sales="sum_sales", f3w0$o0="window#0avg($1)", reference windows="window#0=window(partition {0} order by [] range between unbounded preceding and unbounded following aggs [avg($1)])")
              project(i_manager_id="i_manager_id", sum_sales="sum_sales")
                hashagg(group="i_manager_id,d_moy", sum_sales="sum(sum_sales)")
                  exchange(distribution=hash[0]192, collation=[])
                    partialhashagg(group="i_manager_id,d_moy", sum_sales="sum(ss_sales_price)")
                      hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                        hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                          project(i_item_sk="i_item_sk", i_manager_id="i_manager_id", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_store_sk="ss_store_sk", ss_sales_price="ss_sales_price")
                            hashjoin(condition="ss_item_sk = i_item_sk", type="inner")
                              osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_store_sk`, `ss_sales_price` from `cci_store_sales` as `cci_store_sales`")
                              exchange(distribution=hash[0]192, collation=[])
                                osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_manager_id` from `cci_item` as `cci_item` where (((`i_category` in(?)) and (`i_class` in(?)) and (`i_brand` in(?))) or ((`i_category` in(?)) and (`i_class` in(?)) and (`i_brand` in(?))))")
                          exchange(distribution=broadcast, collation=[])
                            osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_moy` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` in(?, 1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208, 1209, 1210, 1211))")
                        exchange(distribution=broadcast, collation=[])
                          osstablescan(tables="cci_store[p1]", sql="select `s_store_sk` from `cci_store` as `cci_store`")

- sql: |
    -- query 64
    with cs_ui as (select cs_item_sk ,sum(cs_ext_list_price) as sale,sum(cr_refunded_cash+cr_reversed_charge+cr_store_credit) as refund from catalog_sales ,catalog_returns where cs_item_sk = cr_item_sk and cs_order_number = cr_order_number group by cs_item_sk having sum(cs_ext_list_price)>2*sum(cr_refunded_cash+cr_reversed_charge+cr_store_credit)), cross_sales as (select i_product_name product_name ,i_item_sk item_sk ,s_store_name store_name ,s_zip store_zip ,ad1.ca_street_number b_street_number ,ad1.ca_street_name b_street_name ,ad1.ca_city b_city ,ad1.ca_zip b_zip ,ad2.ca_street_number c_street_number ,ad2.ca_street_name c_street_name ,ad2.ca_city c_city ,ad2.ca_zip c_zip ,d1.d_year as syear ,d2.d_year as fsyear ,d3.d_year s2year ,count(*) cnt ,sum(ss_wholesale_cost) s1 ,sum(ss_list_price) s2 ,sum(ss_coupon_amt) s3 FROM   store_sales ,store_returns ,cs_ui ,date_dim d1 ,date_dim d2 ,date_dim d3 ,store ,customer ,customer_demographics cd1 ,customer_demographics cd2 ,promotion ,household_demographics hd1 ,household_demographics hd2 ,customer_address ad1 ,customer_address ad2 ,income_band ib1 ,income_band ib2 ,item WHERE  ss_store_sk = s_store_sk AND ss_sold_date_sk = d1.d_date_sk AND ss_customer_sk = c_customer_sk AND ss_cdemo_sk= cd1.cd_demo_sk AND ss_hdemo_sk = hd1.hd_demo_sk AND ss_addr_sk = ad1.ca_address_sk and ss_item_sk = i_item_sk and ss_item_sk = sr_item_sk and ss_ticket_number = sr_ticket_number and ss_item_sk = cs_ui.cs_item_sk and c_current_cdemo_sk = cd2.cd_demo_sk AND c_current_hdemo_sk = hd2.hd_demo_sk AND c_current_addr_sk = ad2.ca_address_sk and c_first_sales_date_sk = d2.d_date_sk and c_first_shipto_date_sk = d3.d_date_sk and ss_promo_sk = p_promo_sk and hd1.hd_income_band_sk = ib1.ib_income_band_sk and hd2.hd_income_band_sk = ib2.ib_income_band_sk and cd1.cd_marital_status <> cd2.cd_marital_status and i_color in ('purple','burlywood','indian','spring','floral','medium') and i_current_price between 64 and 64 + 10 and i_current_price between 64 + 1 and 64 + 15 group by i_product_name ,i_item_sk ,s_store_name ,s_zip ,ad1.ca_street_number ,ad1.ca_street_name ,ad1.ca_city ,ad1.ca_zip ,ad2.ca_street_number ,ad2.ca_street_name ,ad2.ca_city ,ad2.ca_zip ,d1.d_year ,d2.d_year ,d3.d_year ) select cs1.product_name ,cs1.store_name ,cs1.store_zip ,cs1.b_street_number ,cs1.b_street_name ,cs1.b_city ,cs1.b_zip ,cs1.c_street_number ,cs1.c_street_name ,cs1.c_city ,cs1.c_zip ,cs1.syear ,cs1.cnt ,cs1.s1 as s11 ,cs1.s2 as s21 ,cs1.s3 as s31 ,cs2.s1 as s12 ,cs2.s2 as s22 ,cs2.s3 as s32 ,cs2.syear ,cs2.cnt from cross_sales cs1,cross_sales cs2 where cs1.item_sk=cs2.item_sk and cs1.syear = 1999 and cs2.syear = 1999 + 1 and cs2.cnt <= cs1.cnt and cs1.store_name = cs2.store_name and cs1.store_zip = cs2.store_zip order by cs1.product_name ,cs1.store_name ,cs2.cnt ,cs1.s1 ,cs2.s1;
  plan: |
    exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 20 asc-nulls-first, 13 asc-nulls-first, 16 asc-nulls-first])
      memsort(sort="product_name asc,store_name asc,cnt0 asc,s11 asc,s12 asc")
        project(product_name="product_name", store_name="s_store_name", store_zip="s_zip", b_street_number="ca_street_number0", b_street_name="ca_street_name0", b_city="ca_city0", b_zip="ca_zip0", c_street_number="ca_street_number", c_street_name="ca_street_name", c_city="ca_city", c_zip="ca_zip", syear="d_year", cnt="cnt", s11="s1", s21="s2", s31="s3", s12="s10", s22="s20", s32="s30", syear0="d_year0", cnt0="cnt0")
          hashjoin(condition="i_item_sk = i_item_sk and s_store_name = s_store_name and s_zip = s_zip and cnt <= cnt", type="inner")
            project(i_item_sk="i_item_sk", s_store_name="s_store_name", s_zip="s_zip", d_year="d_year", ca_street_number="ca_street_number", ca_street_name="ca_street_name", ca_city="ca_city", ca_zip="ca_zip", ca_street_number0="ca_street_number0", ca_street_name0="ca_street_name0", ca_city0="ca_city0", ca_zip0="ca_zip0", product_name="product_name", cnt="cnt", s1="s1", s2="s2", s3="s3")
              hashagg(group="i_item_sk,s_store_name,s_zip,d_year,d_year0,d_year1,ca_street_number,ca_street_name,ca_city,ca_zip,ca_street_number0,ca_street_name0,ca_city0,ca_zip0", product_name="__first_value(product_name)", cnt="sum(cnt)", s1="sum(s1)", s2="sum(s2)", s3="sum(s3)")
                exchange(distribution=hash[2]192, collation=[])
                  project(i_item_sk="i_item_sk", s_store_name="s_store_name", s_zip="s_zip", d_year="d_year", d_year0="d_year0", d_year1="d_year1", ca_street_number0="ca_street_number0", ca_street_name0="ca_street_name0", ca_city0="ca_city0", ca_zip0="ca_zip0", ca_street_number="ca_street_number", ca_street_name="ca_street_name", ca_city="ca_city", ca_zip="ca_zip", product_name="product_name", cnt="cnt", s1="s1", s2="s2", s3="s3")
                    partialhashagg(group="i_item_sk,d_year,s_store_name,s_zip,ca_street_number,ca_street_name,ca_city,ca_zip,d_year0,d_year1,ca_street_number0,ca_street_name0,ca_city0,ca_zip0", product_name="__first_value(i_product_name)", cnt="count()", s1="sum(ss_wholesale_cost)", s2="sum(ss_list_price)", s3="sum(ss_coupon_amt)")
                      hashjoin(condition="ca_address_sk = c_current_addr_sk", type="inner")
                        exchange(distribution=hash[38]192, collation=[])
