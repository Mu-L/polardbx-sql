                                                  project(cs_sold_date_sk="cs_sold_date_sk", cs_ship_date_sk="cs_ship_date_sk", cs_bill_hdemo_sk="cs_bill_hdemo_sk", cs_item_sk="cs_item_sk", cs_promo_sk="cs_promo_sk", cs_order_number="cs_order_number", cs_quantity="cs_quantity")
                                                    hashjoin(condition="cs_bill_cdemo_sk = cd_demo_sk", type="inner")
                                                      exchange(distribution=hash[0]192, collation=[])
