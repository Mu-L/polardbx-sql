                hashjoin(condition="cr_item_sk = cs_item_sk and cr_order_number = cs_order_number", type="left")
                  project(cs_item_sk="cs_item_sk", cs_order_number="cs_order_number", d_week_seq="d_week_seq", p_promo_sk="p_promo_sk", i_item_desc="i_item_desc", w_warehouse_name="w_warehouse_name")
                    hashjoin(condition="w_warehouse_sk = inv_warehouse_sk", type="inner")
                      project(cs_item_sk="cs_item_sk", cs_order_number="cs_order_number", d_week_seq="d_week_seq", p_promo_sk="p_promo_sk", i_item_desc="i_item_desc", inv_warehouse_sk="inv_warehouse_sk")
                        hashjoin(condition="d_date_sk0 = inv_date_sk and i_item_sk = inv_item_sk and inv_item_sk = cs_item_sk and inv_quantity_on_hand < cs_quantity", type="inner")
                          hashjoin(condition="i_item_sk = cs_item_sk", type="inner")
                            project(cs_item_sk="cs_item_sk", cs_order_number="cs_order_number", cs_quantity="cs_quantity", d_week_seq="d_week_seq", p_promo_sk="p_promo_sk", d_date_sk0="d_date_sk0")
                              hashjoin(condition="cs_ship_date_sk = d_date_sk and d_date > d_date + ?4", type="inner")
