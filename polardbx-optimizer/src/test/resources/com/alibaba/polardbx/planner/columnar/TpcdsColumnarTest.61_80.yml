                              exchange(distribution=hash[0]192, collation=[])
                                partialhashagg(group="c_customer_sk", c_current_cdemo_sk="__first_value(c_current_cdemo_sk)", c_current_addr_sk="__first_value(c_current_addr_sk)")
                                  semihashjoin(condition="c_customer_sk = ss_customer_sk", type="semi", build="outer")
                                    exchange(distribution=broadcast, collation=[])
