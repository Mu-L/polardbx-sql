                                        hashjoin(condition="cs_promo_sk = p_promo_sk", type="left")
                                          project(cs_ship_date_sk="cs_ship_date_sk", cs_item_sk="cs_item_sk", cs_promo_sk="cs_promo_sk", cs_order_number="cs_order_number", cs_quantity="cs_quantity", d_date="d_date", d_week_seq="d_week_seq")
