      l_partkey > ( select count(p_partkey) + max(p_partkey) from part where p_name = l_quantity) 
      OR l_partkey in (select p_partkey from part where p_name = l_quantity or p_name = l_suppkey)
      OR  l_partkey in (select p_partkey from part where p_name = l_quantity 
            and exists (select o_orderkey from orders where o_orderkey = l_orderkey+p_mfgr))
