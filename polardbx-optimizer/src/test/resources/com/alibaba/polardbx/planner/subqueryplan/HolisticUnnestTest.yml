  - sql: |
      # join on subquery
       /*+TDDL:cmd_extra(FORCE_HOLISTIC_SUBQUERY_UNNEST=false ENABLE_JOIN_SUBQUERY_UNNEST=true)*/select c.c_custkey, o.o_orderkey from customer c
      join orders o on c.c_custkey = o.o_custkey
      and o.o_orderkey in (select l_orderkey from lineitem where l_quantity > c.c_acctbal)
    plan: |
      project(c_custkey="c_custkey", o_orderkey="o_orderkey")
        semihashjoin(condition="c_acctbal = c_acctbal and o_orderkey = o_orderkey", type="semi", build="inner")
          project(c_custkey="c_custkey", c_acctbal="c_acctbal", o_orderkey="o_orderkey")
            hashjoin(condition="o_custkey = c_custkey", type="inner")
              exchange(distribution=hash[1]20, collation=[])
                osstablescan(tables="orders_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `o_orderkey`, `o_custkey` from `orders_col_index` as `orders_col_index`")
              exchange(distribution=hash[0]20, collation=[])
                osstablescan(tables="customer_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `c_custkey`, `c_acctbal` from `customer_col_index` as `customer_col_index`")
          exchange(distribution=broadcast, collation=[])
            project(c_acctbal="c_acctbal", o_orderkey="o_orderkey")
              hashjoin(condition="o_orderkey = l_orderkey and l_quantity > c_acctbal", type="inner")
                osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `l_orderkey`, `l_quantity` from `lineitem_col_index` as `lineitem_col_index`")
                exchange(distribution=broadcast, collation=[])
                  hashagg(group="c_acctbal,o_orderkey")
                    exchange(distribution=hash[1]20, collation=[])
                      project(c_acctbal="c_acctbal", o_orderkey="o_orderkey")
                        partialhashagg(group="o_orderkey,c_acctbal")
                          hashjoin(condition="o_custkey = c_custkey", type="inner")
                            exchange(distribution=hash[1]20, collation=[])
                              osstablescan(tables="orders_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `o_orderkey`, `o_custkey` from `orders_col_index` as `orders_col_index`")
                            exchange(distribution=hash[0]20, collation=[])
                              osstablescan(tables="customer_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `c_custkey`, `c_acctbal` from `customer_col_index` as `customer_col_index`")
  - sql: |
      select l_partkey in (
      SELECT name FROM (VALUES (1, 'John', 25),(2, 'Jane', 30),(3, 'Bob', 35)) AS t(id, name, age) where id = l_partkey) from lineitem
    plan: |
      project(l_partkey in ( select name from ( values (1, 'john', 25),  (2, 'jane', 30),  (3, 'bob', 35) ) as t (id, name, age) where id = l_partkey )="cast(case(or(is null($1), $2), false, $3, true, $4, null, false))")
        hashjoin(condition="l_partkey = l_partkey", type="left")
          osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `l_partkey` from `lineitem_col_index` as `lineitem_col_index`")
          exchange(distribution=broadcast, collation=[])
            project(c="case(is null($1), 0, $1)", =="case(is null($1), 0, $1) = 0", =2="=", =3="=3", l_partkey="l_partkey")
              hashjoin(condition="l_partkey <=> column_00", type="right")
                exchange(distribution=broadcast, collation=[])
                  project(column_00="column_00", c="c", =="strict = 1", =3="possible = 1")
                    hashagg(group="column_00", c="sum(c)", strict="max(strict)", possible="max(possible)")
                      exchange(distribution=hash[0]20, collation=[])
                        partialhashagg(group="column_00", c="count()", strict="max(s_case)", possible="max(p_case)")
                          project(s_case="case(is true(=($0, $1)), 1, 0)", p_case="case(or(=($0, $1), is null($1)), 1, 0)", column_00="column_0")
                            filter(condition="column_0 = column_0")
                              dynamicvalues(tuples=[{ ?0, ?1, ?2 }, { ?3, ?4, ?5 }, { ?6, ?7, ?8 }])
                hashagg(group="l_partkey")
                  exchange(distribution=hash[0]20, collation=[])
                    partialhashagg(group="l_partkey")
                      osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `l_partkey` from `lineitem_col_index` as `lineitem_col_index`")
  - sql: |
      select 1 from lineitem where l_partkey in (
      select p_partkey from part where p_mfgr > 10 
      union 
      select p_partkey from part join partsupp on p_retailprice=ps_supplycost where p_mfgr + ps_partkey > l_shipdate)
    plan: |
      project(1="?0")
        semihashjoin(condition="l_partkey = l_partkey and l_shipdate = l_shipdate", type="semi", build="inner")
          osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `l_partkey`, `l_shipdate` from `lineitem_col_index` as `lineitem_col_index`")
          exchange(distribution=broadcast, collation=[])
            project(l_partkey="l_partkey", l_shipdate="l_shipdate")
              hashagg(group="l_partkey,l_shipdate,p_partkey")
                exchange(distribution=hash[2]20, collation=[])
                  partialhashagg(group="l_partkey,l_shipdate,p_partkey")
                    unionall(concurrent=true)
                      project(l_partkey="l_partkey", l_shipdate="l_shipdate", p_partkey="p_partkey")
                        hashjoin(condition="l_partkey = p_partkey", type="inner")
                          osstablescan(tables="part_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `p_partkey` from `part_col_index` as `part_col_index` where (`p_mfgr` > ?)")
                          exchange(distribution=broadcast, collation=[])
                            hashagg(group="l_partkey,l_shipdate")
                              exchange(distribution=hash[1]20, collation=[])
                                partialhashagg(group="l_partkey,l_shipdate")
                                  osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `l_partkey`, `l_shipdate` from `lineitem_col_index` as `lineitem_col_index`")
                      project(l_partkey="l_partkey", l_shipdate="l_shipdate", p_partkey="p_partkey")
                        hashjoin(condition="cast(p_mfgr) + ps_partkey > l_shipdate and p_retailprice = ps_supplycost", type="inner")
                          osstablescan(tables="partsupp_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `ps_partkey`, `ps_supplycost` from `partsupp_col_index` as `partsupp_col_index`")
                          exchange(distribution=broadcast, collation=[])
                            project(l_partkey="l_partkey", l_shipdate="l_shipdate", p_partkey="p_partkey", p_mfgr="p_mfgr", p_retailprice="p_retailprice")
                              hashjoin(condition="l_partkey = p_partkey", type="inner")
                                osstablescan(tables="part_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, partition=[remote], sql="select `p_partkey`, `p_mfgr`, `p_retailprice` from `part_col_index` as `part_col_index`")
                                exchange(distribution=broadcast, collation=[])
                                  hashagg(group="l_partkey,l_shipdate")
                                    exchange(distribution=hash[1]20, collation=[])
                                      partialhashagg(group="l_partkey,l_shipdate")
                                        osstablescan(tables="lineitem_col_index[p1,p2,p3,p4,p5,p6]", shardcount=6, sql="select `l_partkey`, `l_shipdate` from `lineitem_col_index` as `lineitem_col_index`")
  - sql: |
