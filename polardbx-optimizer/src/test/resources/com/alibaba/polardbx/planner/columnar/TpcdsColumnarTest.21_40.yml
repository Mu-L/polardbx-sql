- sql: |
    -- query 21
    select  * from(select w_warehouse_name ,i_item_id ,sum(case when (cast(d_date as date) < cast ('2000-03-11' as date)) then inv_quantity_on_hand else 0 end) as inv_before ,sum(case when (cast(d_date as date) >= cast ('2000-03-11' as date)) then inv_quantity_on_hand else 0 end) as inv_after from inventory ,warehouse ,item ,date_dim where i_current_price between 0.99 and 1.49 and i_item_sk          = inv_item_sk and inv_warehouse_sk   = w_warehouse_sk and inv_date_sk    = d_date_sk and d_date between date_add(cast ('2000-03-11' as date), -30) and date_add(cast ('2000-03-11' as date), 30) group by w_warehouse_name, i_item_id) x where (case when inv_before > 0 then inv_after / inv_before else null end) between 2.0/3.0 and 3.0/2.0 order by w_warehouse_name ,i_item_id limit 100;
  plan: |

    topn(sort="w_warehouse_name asc,i_item_id asc", offset=0, fetch=?15)
      exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first])
        topn(sort="w_warehouse_name asc,i_item_id asc", fetch=?15)
          filter(condition="between asymmetric(case(>($2, ?10), /($3, $2), null), '0.666666666666666666', '1.500000000000000000')")
            hashagg(group="w_warehouse_name,i_item_id", inv_before="sum(inv_before)", inv_after="sum(inv_after)")
              exchange(distribution=hash[0]192, collation=[])
                partialhashagg(group="w_warehouse_name,i_item_id", inv_before="sum($f2)", inv_after="sum($f3)")
                  project(w_warehouse_name="w_warehouse_name", i_item_id="i_item_id", $f2="case(<(cast($3):date, cast(?0):date), $1, ?1)", $f3="case(>=(cast($3):date, cast(?2):date), $1, ?3)")
                    hashjoin(condition="inv_warehouse_sk = w_warehouse_sk", type="inner")
                      project(inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", i_item_id="i_item_id", d_date="d_date")
                        hashjoin(condition="d_date_sk = inv_date_sk", type="inner")
                          project(inv_date_sk="inv_date_sk", inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", i_item_id="i_item_id")
                            hashjoin(condition="inv_item_sk = i_item_sk", type="inner")
                              osstablescan(tables="cci_inventory[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `inv_date_sk`, `inv_item_sk`, `inv_warehouse_sk`, `inv_quantity_on_hand` from `cci_inventory` as `cci_inventory`")
                              exchange(distribution=hash[0]192, collation=[])
                                osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_item_id` from `cci_item` as `cci_item` where (`i_current_price` between ? and ?)")
                          exchange(distribution=broadcast, collation=[])
                            osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_date` between '2000-02-10' and '2000-04-10')")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_warehouse[p1]", sql="select `w_warehouse_sk`, `w_warehouse_name` from `cci_warehouse` as `cci_warehouse`")

