- sql: |
    -- query 36
    select *, rank() over ( partition by lochierarchy, case when classgroup = 0 then i_category end order by gross_margin asc) as rank_within_parent from ( select sum(ss_net_profit)/sum(ss_ext_sales_price) as gross_margin ,i_category ,i_class ,grouping(i_class) as classgroup ,grouping(i_category)+grouping(i_class) as lochierarchy from store_sales ,date_dim       d1 ,item ,store where d1.d_year = 2001 and d1.d_date_sk = ss_sold_date_sk and i_item_sk  = ss_item_sk and s_store_sk  = ss_store_sk and s_state in ('TN','TN','TN','TN', 'TN','TN','TN','TN') group by rollup(i_category,i_class) ) order by lochierarchy desc ,case when lochierarchy = 0 then i_category end ,rank_within_parent limit 100;
  plan: |

    project(gross_margin="gross_margin", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", rank_within_parent="rank_within_parent")
      topn(sort="lochierarchy desc,$6 asc,rank_within_parent asc", offset=0, fetch=?3)
        exchange(distribution=single, collation=[4 desc-nulls-last, 6 asc-nulls-first, 5 asc-nulls-first])
          topn(sort="lochierarchy desc,$6 asc,rank_within_parent asc", fetch=?3)
            project(gross_margin="gross_margin", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", rank_within_parent="f7w0$o0", $6="$6")
              sortwindow(gross_margin="gross_margin", i_category="i_category", i_class="i_class", classgroup="classgroup", lochierarchy="lochierarchy", $5="$5", $6="$6", f7w0$o0="window#0rank($0)", reference windows="window#0=window(partition {4, 5} order by [0 asc-nulls-first] rows between unbounded preceding and current row aggs [rank($0)])")
                memsort(sort="lochierarchy asc,$5 asc,gross_margin asc")
                  exchange(distribution=hash[4, 5], collation=[])
                    project(gross_margin="$f3 / $f4", i_category="i_category", i_class="i_class", classgroup="case(=($2, 0), 0, =($2, 2), 1, 1)", lochierarchy="case(=($2, 0), 0, =($2, 2), 0, 1) + case(=($2, 0), 0, =($2, 2), 1, 1)", $5="case(=(case(=($2, 0), 0, =($2, 2), 1, 1), 0), $1, null)", $6="case(=(+(case(=($2, 0), 0, =($2, 2), 0, 1), case(=($2, 0), 0, =($2, 2), 1, 1)), ?2), $1, null)")
                      hashagg(group="i_class,i_category,$e", $f3="sum($f3)", $f4="sum($f4)")
                        exchange(distribution=hash[1]192, collation=[])
                          partialhashagg(group="i_class,i_category,$e", $f3="sum(ss_net_profit)", $f4="sum(ss_ext_sales_price)")
                            expand(projects="{s_store_sk=s_store_sk, ss_sold_date_sk=ss_sold_date_sk, ss_item_sk=ss_item_sk, ss_store_sk=ss_store_sk, ss_ext_sales_price=ss_ext_sales_price, ss_net_profit=ss_net_profit, i_item_sk=i_item_sk, i_class=i_class, i_category=i_category, d_date_sk=d_date_sk, $e=0}, {s_store_sk=s_store_sk, ss_sold_date_sk=ss_sold_date_sk, ss_item_sk=ss_item_sk, ss_store_sk=ss_store_sk, ss_ext_sales_price=ss_ext_sales_price, ss_net_profit=ss_net_profit, i_item_sk=i_item_sk, i_class=null, i_category=i_category, d_date_sk=d_date_sk, $e=2}, {s_store_sk=s_store_sk, ss_sold_date_sk=ss_sold_date_sk, ss_item_sk=ss_item_sk, ss_store_sk=ss_store_sk, ss_ext_sales_price=ss_ext_sales_price, ss_net_profit=ss_net_profit, i_item_sk=i_item_sk, i_class=null, i_category=null, d_date_sk=d_date_sk, $e=3}")
                              project(s_store_sk="s_store_sk", ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_store_sk="ss_store_sk", ss_ext_sales_price="ss_ext_sales_price", ss_net_profit="ss_net_profit", i_item_sk="i_item_sk", i_class="i_class", i_category="i_category", d_date_sk="d_date_sk")
                                hashjoin(condition="ss_store_sk = s_store_sk", type="inner")
                                  project(ss_sold_date_sk="ss_sold_date_sk", ss_item_sk="ss_item_sk", ss_store_sk="ss_store_sk", ss_ext_sales_price="ss_ext_sales_price", ss_net_profit="ss_net_profit", i_item_sk="i_item_sk", i_class="i_class", i_category="i_category", d_date_sk="d_date_sk")
                                    hashjoin(condition="i_item_sk = ss_item_sk", type="inner")
                                      hashjoin(condition="d_date_sk = ss_sold_date_sk", type="inner")
                                        osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_item_sk`, `ss_store_sk`, `ss_ext_sales_price`, `ss_net_profit` from `cci_store_sales` as `cci_store_sales`")
                                        exchange(distribution=broadcast, collation=[])
                                          osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_year` = ?)")
                                      exchange(distribution=hash[0]192, collation=[])
                                        osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_class`, `i_category` from `cci_item` as `cci_item`")
                                  exchange(distribution=broadcast, collation=[])
                                    osstablescan(tables="cci_store[p1]", sql="select `s_store_sk` from `cci_store` as `cci_store` where (`s_state` in(?))")

- sql: |
    -- query 37
    select  i_item_id ,i_item_desc ,i_current_price from item, inventory, date_dim, catalog_sales where i_current_price between 68 and 68 + 30 and inv_item_sk = i_item_sk and d_date_sk=inv_date_sk and d_date between cast('2000-02-01' as date) and date_add(cast('2000-02-01' as date),  60) and i_manufact_id in (677,940,694,808) and inv_quantity_on_hand between 100 and 500 and cs_item_sk = i_item_sk group by i_item_id,i_item_desc,i_current_price order by i_item_id limit 100;
  plan: |

    limit(offset=0, fetch=?9)
      exchange(distribution=single, collation=[0 asc-nulls-first])
        memsort(sort="i_item_id asc")
          hashagg(group="i_item_id,i_item_desc,i_current_price")
            exchange(distribution=hash[0]192, collation=[])
              partialhashagg(group="i_item_id,i_item_desc,i_current_price")
                hashjoin(condition="inv_item_sk = cs_item_sk", type="inner", partition=[local])
                  osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `cs_item_sk` from `cci_catalog_sales` as `cci_catalog_sales`")
                  hashjoin(condition="d_date_sk = inv_date_sk", type="inner")
                    project(i_item_sk="i_item_sk", i_item_id="i_item_id", i_item_desc="i_item_desc", i_current_price="i_current_price", inv_date_sk="inv_date_sk", inv_item_sk="inv_item_sk")
                      hashjoin(condition="inv_item_sk = i_item_sk", type="inner")
                        osstablescan(tables="cci_inventory[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `inv_date_sk`, `inv_item_sk` from `cci_inventory` as `cci_inventory` where (`inv_quantity_on_hand` between ? and ?)")
                        exchange(distribution=hash[0]192, collation=[])
                          osstablescan(tables="cci_item[p1]", sql="select `i_item_sk`, `i_item_id`, `i_item_desc`, `i_current_price` from `cci_item` as `cci_item` where ((`i_manufact_id` in(?)) and (`i_current_price` between ? and 98))")
                    exchange(distribution=broadcast, collation=[])
                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk` from `cci_date_dim` as `cci_date_dim` where (`d_date` between '2000-02-01' and '2000-04-01')")

- sql: |
    -- query 38
    select  count(*) from ( select distinct c_last_name, c_first_name, d_date from store_sales, date_dim, customer where store_sales.ss_sold_date_sk = date_dim.d_date_sk and store_sales.ss_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200 + 11 intersect select distinct c_last_name, c_first_name, d_date from catalog_sales, date_dim, customer where catalog_sales.cs_sold_date_sk = date_dim.d_date_sk and catalog_sales.cs_bill_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200 + 11 intersect select distinct c_last_name, c_first_name, d_date from web_sales, date_dim, customer where web_sales.ws_sold_date_sk = date_dim.d_date_sk and web_sales.ws_bill_customer_sk = customer.c_customer_sk and d_month_seq between 1200 and 1200 + 11 ) hot_cust limit 100;
  plan: |

    limit(offset=0, fetch=?9)
      hashagg(count(*)="sum(count(*))")
        exchange(distribution=single, collation=[])
          partialhashagg(count(*)="count()")
            semihashjoin(condition="c_last_name <=> c_last_name and c_first_name <=> c_first_name and d_date <=> d_date", type="semi", build="outer")
              hashagg(group="d_date,c_first_name,c_last_name")
                exchange(distribution=hash[2]192, collation=[])
                  partialhashagg(group="d_date,c_first_name,c_last_name")
                    hashjoin(condition="c_customer_sk = ws_bill_customer_sk", type="inner")
                      hashagg(group="d_date,ws_bill_customer_sk")
                        exchange(distribution=hash[1]192, collation=[])
                          project(d_date="d_date", ws_bill_customer_sk="ws_bill_customer_sk")
                            partialhashagg(group="ws_bill_customer_sk,d_date")
                              hashjoin(condition="ws_sold_date_sk = d_date_sk", type="inner")
                                osstablescan(tables="cci_web_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ws_sold_date_sk`, `ws_bill_customer_sk` from `cci_web_sales` as `cci_web_sales`")
                                exchange(distribution=broadcast, collation=[])
                                  osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                      osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")
              project(c_last_name="c_last_name", c_first_name="c_first_name", d_date="d_date")
                semihashjoin(condition="c_last_name <=> c_last_name and c_first_name <=> c_first_name and d_date <=> d_date", type="semi", build="outer")
                  hashagg(group="d_date,c_first_name,c_last_name")
                    exchange(distribution=hash[2]192, collation=[])
                      partialhashagg(group="d_date,c_first_name,c_last_name")
                        hashjoin(condition="c_customer_sk = cs_bill_customer_sk", type="inner")
                          hashagg(group="d_date,cs_bill_customer_sk")
                            exchange(distribution=hash[1]192, collation=[])
                              project(d_date="d_date", cs_bill_customer_sk="cs_bill_customer_sk")
                                partialhashagg(group="cs_bill_customer_sk,d_date")
                                  hashjoin(condition="cs_sold_date_sk = d_date_sk", type="inner")
                                    osstablescan(tables="cci_catalog_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `cs_sold_date_sk`, `cs_bill_customer_sk` from `cci_catalog_sales` as `cci_catalog_sales`")
                                    exchange(distribution=broadcast, collation=[])
                                      osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                          osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")
                  project(c_last_name="c_last_name", c_first_name="c_first_name", d_date="d_date")
                    hashagg(group="d_date,c_first_name,c_last_name")
                      exchange(distribution=hash[2]192, collation=[])
                        partialhashagg(group="d_date,c_first_name,c_last_name")
                          hashjoin(condition="c_customer_sk = ss_customer_sk", type="inner")
                            hashagg(group="d_date,ss_customer_sk")
                              exchange(distribution=hash[1]192, collation=[])
                                project(d_date="d_date", ss_customer_sk="ss_customer_sk")
                                  partialhashagg(group="ss_customer_sk,d_date")
                                    hashjoin(condition="ss_sold_date_sk = d_date_sk", type="inner")
                                      osstablescan(tables="cci_store_sales[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `ss_sold_date_sk`, `ss_customer_sk` from `cci_store_sales` as `cci_store_sales`")
                                      exchange(distribution=broadcast, collation=[])
                                        osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_date` from `cci_date_dim` as `cci_date_dim` where (`d_month_seq` between ? and 1211)")
                            osstablescan(tables="cci_customer[p1,p2,p3,...p192]", shardcount=192, partition=[remote], sql="select `c_customer_sk`, `c_first_name`, `c_last_name` from `cci_customer` as `cci_customer`")

- sql: |
    -- query 39.1
    /*+TDDL:hash_join(inventory, date_dim)*/with inv as (select w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy ,stdev,mean, case mean when 0 then null else stdev/mean end cov from(select w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy ,stddev_samp(inv_quantity_on_hand) stdev,avg(inv_quantity_on_hand) mean from inventory ,item ,warehouse ,date_dim where inv_item_sk = i_item_sk and inv_warehouse_sk = w_warehouse_sk and inv_date_sk = d_date_sk and d_year =2001 group by w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy) foo where case mean when 0 then 0 else stdev/mean end > 1) select inv1.w_warehouse_sk,inv1.i_item_sk,inv1.d_moy,inv1.mean, inv1.cov ,inv2.w_warehouse_sk,inv2.i_item_sk,inv2.d_moy,inv2.mean, inv2.cov from inv inv1,inv inv2 where inv1.i_item_sk = inv2.i_item_sk and inv1.w_warehouse_sk =  inv2.w_warehouse_sk and inv1.d_moy=1 and inv2.d_moy=1+1 order by inv1.w_warehouse_sk,inv1.i_item_sk,inv1.d_moy,inv1.mean,inv1.cov ,inv2.d_moy,inv2.mean, inv2.cov ;
  plan: |
    exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first, 3 asc-nulls-first, 4 asc-nulls-first, 7 asc-nulls-first, 8 asc-nulls-first, 9 asc-nulls-first])
      memsort(sort="w_warehouse_sk asc,i_item_sk asc,d_moy asc,/ asc,case asc,d_moy0 asc,/0 asc,case0 asc")
        project(w_warehouse_sk="w_warehouse_sk", i_item_sk="i_item_sk", d_moy="d_moy", /="$f5 / $f6", case="case", w_warehouse_sk0="w_warehouse_sk0", i_item_sk0="i_item_sk0", d_moy0="d_moy0", /0="$f50 / $f60", case0="case0")
          hashjoin(condition="w_warehouse_sk = w_warehouse_sk and i_item_sk = i_item_sk", type="inner")
            project(w_warehouse_sk="w_warehouse_sk", i_item_sk="i_item_sk", d_moy="d_moy", $f5="$f5", $f6="$f6", case="case(=(/($5, $6), ?0), null, /(special_pow(/(-($4, /(*($5, $5), $6)), case(=($6, 1), null, -($6, 1))), 0.5), /($5, $6)))")
              filter(condition="case(=(/($5, $6), ?2), ?3, /(special_pow(/(-($4, /(*($5, $5), $6)), case(=($6, 1), null, -($6, 1))), 0.5), /($5, $6))) > ?4")
                hashagg(group="w_warehouse_sk,i_item_sk,d_moy", w_warehouse_name="__first_value(w_warehouse_name)", $f4="sum(__*__)", $f5="sum(inv_quantity_on_hand)", $f6="count(inv_quantity_on_hand)", partition=[local])
                  project(w_warehouse_sk="w_warehouse_sk", w_warehouse_name="w_warehouse_name", inv_date_sk="inv_date_sk", inv_item_sk="inv_item_sk", inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", __*__="inv_quantity_on_hand * inv_quantity_on_hand", i_item_sk="i_item_sk", d_date_sk="d_date_sk", d_moy="d_moy")
                    hashjoin(condition="inv_warehouse_sk = w_warehouse_sk", type="inner")
                      project(inv_date_sk="inv_date_sk", inv_item_sk="inv_item_sk", inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", i_item_sk="i_item_sk", d_date_sk="d_date_sk", d_moy="d_moy")
                        hashjoin(condition="inv_item_sk = i_item_sk", type="inner")
                          hashjoin(condition="d_date_sk = inv_date_sk", type="inner")
                            osstablescan(tables="cci_inventory[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `inv_date_sk`, `inv_item_sk`, `inv_warehouse_sk`, `inv_quantity_on_hand` from `cci_inventory` as `cci_inventory`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_moy` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = ?))")
                          exchange(distribution=hash[0]192, collation=[])
                            osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item`")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_warehouse[p1]", sql="select `w_warehouse_sk`, `w_warehouse_name` from `cci_warehouse` as `cci_warehouse`")
            project(w_warehouse_sk="w_warehouse_sk", i_item_sk="i_item_sk", d_moy="d_moy", $f5="$f5", $f6="$f6", case="case(=(/($5, $6), ?0), null, /(special_pow(/(-($4, /(*($5, $5), $6)), case(=($6, 1), null, -($6, 1))), 0.5), /($5, $6)))")
              filter(condition="case(=(/($5, $6), ?2), ?3, /(special_pow(/(-($4, /(*($5, $5), $6)), case(=($6, 1), null, -($6, 1))), 0.5), /($5, $6))) > ?4")
                hashagg(group="w_warehouse_sk,i_item_sk,d_moy", w_warehouse_name="__first_value(w_warehouse_name)", $f4="sum(__*__)", $f5="sum(inv_quantity_on_hand)", $f6="count(inv_quantity_on_hand)", partition=[local])
                  project(w_warehouse_sk="w_warehouse_sk", w_warehouse_name="w_warehouse_name", inv_date_sk="inv_date_sk", inv_item_sk="inv_item_sk", inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", __*__="inv_quantity_on_hand * inv_quantity_on_hand", i_item_sk="i_item_sk", d_date_sk="d_date_sk", d_moy="d_moy")
                    hashjoin(condition="inv_warehouse_sk = w_warehouse_sk", type="inner")
                      project(inv_date_sk="inv_date_sk", inv_item_sk="inv_item_sk", inv_warehouse_sk="inv_warehouse_sk", inv_quantity_on_hand="inv_quantity_on_hand", i_item_sk="i_item_sk", d_date_sk="d_date_sk", d_moy="d_moy")
                        hashjoin(condition="inv_item_sk = i_item_sk", type="inner")
                          hashjoin(condition="d_date_sk = inv_date_sk", type="inner")
                            osstablescan(tables="cci_inventory[p1,p2,p3,...p192]", shardcount=192, partition=[local, remote], sql="select `inv_date_sk`, `inv_item_sk`, `inv_warehouse_sk`, `inv_quantity_on_hand` from `cci_inventory` as `cci_inventory`")
                            exchange(distribution=broadcast, collation=[])
                              osstablescan(tables="cci_date_dim[p1]", sql="select `d_date_sk`, `d_moy` from `cci_date_dim` as `cci_date_dim` where ((`d_year` = ?) and (`d_moy` = 2))")
                          exchange(distribution=hash[0]192, collation=[])
                            osstablescan(tables="cci_item[p1]", sql="select `i_item_sk` from `cci_item` as `cci_item`")
                      exchange(distribution=broadcast, collation=[])
                        osstablescan(tables="cci_warehouse[p1]", sql="select `w_warehouse_sk`, `w_warehouse_name` from `cci_warehouse` as `cci_warehouse`")

- sql: |
    -- query 39.2
    /*+TDDL:hash_join(inventory, date_dim)*/with inv as (select w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy ,stdev,mean, case mean when 0 then null else stdev/mean end cov from(select w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy ,stddev_samp(inv_quantity_on_hand) stdev,avg(inv_quantity_on_hand) mean from inventory ,item ,warehouse ,date_dim where inv_item_sk = i_item_sk and inv_warehouse_sk = w_warehouse_sk and inv_date_sk = d_date_sk and d_year =2001 group by w_warehouse_name,w_warehouse_sk,i_item_sk,d_moy) foo where case mean when 0 then 0 else stdev/mean end > 1) select inv1.w_warehouse_sk,inv1.i_item_sk,inv1.d_moy,inv1.mean, inv1.cov ,inv2.w_warehouse_sk,inv2.i_item_sk,inv2.d_moy,inv2.mean, inv2.cov from inv inv1,inv inv2 where inv1.i_item_sk = inv2.i_item_sk and inv1.w_warehouse_sk =  inv2.w_warehouse_sk and inv1.d_moy=1 and inv2.d_moy=1+1 and inv1.cov > 1.5 order by inv1.w_warehouse_sk,inv1.i_item_sk,inv1.d_moy,inv1.mean,inv1.cov ,inv2.d_moy,inv2.mean, inv2.cov ;
  plan: |

    exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first, 2 asc-nulls-first, 3 asc-nulls-first, 4 asc-nulls-first, 7 asc-nulls-first, 8 asc-nulls-first, 9 asc-nulls-first])
      memsort(sort="w_warehouse_sk asc,i_item_sk asc,d_moy asc,/ asc,case asc,d_moy0 asc,/0 asc,case0 asc")
        project(w_warehouse_sk="w_warehouse_sk0", i_item_sk="i_item_sk0", d_moy="d_moy0", /="$f50 / $f60", case="case0", w_warehouse_sk0="w_warehouse_sk", i_item_sk0="i_item_sk", d_moy0="d_moy", /0="$f5 / $f6", case0="case")
          hashjoin(condition="w_warehouse_sk = w_warehouse_sk and i_item_sk = i_item_sk", type="inner")
            project(w_warehouse_sk="w_warehouse_sk", i_item_sk="i_item_sk", d_moy="d_moy", $f5="$f5", $f6="$f6", case="case(=(/($5, $6), ?0), null, /(special_pow(/(-($4, /(*($5, $5), $6)), case(=($6, 1), null, -($6, 1))), 0.5), /($5, $6)))")
