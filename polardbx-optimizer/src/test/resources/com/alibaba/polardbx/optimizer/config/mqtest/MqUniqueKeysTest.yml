DDL:
  x:
    CREATE TABLE `x` (
    `id` bigint(11) NOT NULL AUTO_INCREMENT,
    `order_id` varchar(20) DEFAULT NULL,
    `buyer_id` varchar(20) DEFAULT NULL,
    `seller_id` varchar(20) DEFAULT NULL,
    `order_snapshot` varchar(20) DEFAULT NULL,
    `order_detail` varchar(20) DEFAULT NULL ,
    PRIMARY KEY (`id`),
    KEY `auto_shard_key_order_id` USING BTREE (`order_id`),
    GLOBAL INDEX `g_i_buyer`(`buyer_id`) COVERING (`id`, `order_id`, `seller_id`, `order_snapshot`) PARTITION BY HASH(`buyer_id`) PARTITIONS 3,
    UNIQUE GLOBAL KEY `g_i_seller` (`seller_id`) COVERING (`id`, `order_id`, `buyer_id`, `order_snapshot`) PARTITION BY HASH(`seller_id`) PARTITIONS 3,
    UNIQUE KEY `u1` (`order_detail`,`order_snapshot`)
    ) ENGINE = InnoDB AUTO_INCREMENT = 2300006 CHARSET = utf8 partition by hash(`order_id`) PARTITIONS 3
  y:
    CREATE TABLE `y` (
    `id` bigint(11) NOT NULL,
    `order_id` varchar(20) DEFAULT NULL,
    `buyer_id` varchar(20) DEFAULT NULL,
    `seller_id` varchar(20) DEFAULT NULL,
    `order_snapshot` varchar(20) DEFAULT NULL,
    `order_detail` varchar(20) DEFAULT NULL ,
    PRIMARY KEY (`id`),
    KEY `auto_shard_key_order_id` USING BTREE (`order_id`),
    GLOBAL INDEX `g_i_buyer`(`buyer_id`) COVERING (`id`, `order_id`, `seller_id`, `order_snapshot`) PARTITION BY HASH(`buyer_id`) PARTITIONS 3,
    UNIQUE GLOBAL KEY `g_i_seller` (`seller_id`,`order_snapshot`) COVERING (`id`, `order_id`, `buyer_id`) PARTITION BY key(`seller_id`,`order_snapshot`) PARTITIONS 3,
    UNIQUE KEY `u1` (`order_detail`,`order_id`)
    ) ENGINE = InnoDB AUTO_INCREMENT = 2300006 CHARSET = utf8 partition by hash(`order_id`) PARTITIONS 3

