SQL:
  - sql: |
      SELECT
       'W92'  companycode ,
       a.plant  plant ,
       a.fiscalyear   fiscalyear ,
       a.postperiod   postperiod ,
       a.materiel  materiel  ,
       a.code   code ,
       a.codedes  codedes  ,
       p.busarea  busarea  ,
       ifnull(t.vbrand,r.vbrand)  vbrand ,
       ifnull(t.vbrandtext,r.vbrandtext)  vbrandtext ,
       ifnull(t.vpdtseries,ifnull(r.carstyle,p.productgroupname))  vpdtseries , 
              ifnull(t.venergytype,ifnull(r.venergytype ,if(p.bussenergy='Y','EV','OR')))   bussenergy ,
       a.costfield   costfield 
      FROM
       (
       SELECT
        z.fiscalyear,
        z.postperiod,
        z.description itemdes,
        t.description costtdes,
        t.costtype,
        z.displayorder,
        z.client,
        s.suplevel fcostobject,
        z.ctlarea,
        m.plant,
        d.code code,
        d.description codedes,
        z.materiel,
        sum( z.costfield ) costfield 
       FROM
         copcostobjsubmtl m,
         copcostobjsupsub s,
         copzzcbtemp z,
         copsubobjdesc d,
         copcosttypetmp t 
       WHERE
        m.sublevel = s.sublevel 
        AND m.mtlno = z.materiel 
        AND z.costtype = t.costtype 
        AND s.sublevel = d.costobject 
        AND m.plant = s.plant 
        AND m.plant = z.plant 
        AND z.costtype = 'AD' 
        AND NOT ( z.costfield = 0 ) 
        AND s.suplevel = 'PROD' 
                      AND Z.CTLAREA in ( 'W92L', 'F01')  
       GROUP BY
        z.description,
        t.description,
        t.costtype,
        z.client,
        z.fiscalyear,
        z.postperiod,
        s.suplevel,
        z.ctlarea,
        m.plant,
        d.code,
        d.description,
        z.materiel,
        z.displayorder 
       ) a

       left join  repv_product t on a.client = t.client and a.materiel = t.vproductcode and t.companycode = 'VB5'

       LEFT JOIN (
       SELECT DISTINCT
        l.client,
        l.mtlno,
        p.plant,
        o.busarea,
        r.productgroupname,
        r.bussenergy 
       FROM
        mdmmmrgenmtl l
        INNER JOIN  repmmrplantmtl p on l.mtlno = p.mtlno AND l.client = p.client 
        INNER JOIN  oubusareadetermination o on l.division = o.division and p.plant = o.plant and l.client = o.client
        INNER JOIN  repgldbusinessarea r on o.busarea = r.busarea and o.client = r.client and r.companycode = 'W92' 
       WHERE
         l.client = '800'
        and l.mtltype = 'PROD'
       ) p ON a.client = p.client  AND a.materiel = p.mtlno  AND a.plant = p.plant

        left join  materielSeriesRelation r on a.client = r.client  
       and a.materiel LIKE concat(r.materielmid,'%');
    plan: |
      project(companycode="?0", plant="plant1", fiscalyear="fiscalyear", postperiod="postperiod", materiel="materiel", code="code", codedes="description0", busarea="busarea", vbrand="ifnull(vbrand, vbrand0)", vbrandtext="ifnull(vbrandtext, vbrandtext0)", vpdtseries="ifnull(vpdtseries, ifnull(carstyle, productgroupname))", bussenergy="ifnull(venergytype, ifnull(venergytype0, if(=, ?2, ?3)))", costfield="$f16")
        hashjoin(condition="client = client and materiel like concat(materielmid, ?12)", type="left")
          hashjoin(condition="client = client and materiel = mtlno and plant1 = plant", type="left")
            hashjoin(condition="client = client and materiel = vproductcode", type="left")
              project(fiscalyear="fiscalyear", description="description", postperiod="postperiod", ctlarea="ctlarea", materiel="materiel", client="client", displayorder="displayorder", suplevel="suplevel", plant1="plant1", description0="description0", code="code", costtype0="costtype0", description01="description1", $f16="costfield * $f2")
                hashjoin(condition="costtype = costtype", type="inner")
                  hashagg(group="fiscalyear,description,costtype,postperiod,ctlarea,materiel,client,displayorder,suplevel,plant1,description0,code", costfield="sum(costfield)")
                    hashjoin(condition="costobject = sublevel and costobject = sublevel0", type="inner")
                      project(fiscalyear="fiscalyear", description="description", costtype="costtype", costfield="costfield", postperiod="postperiod", ctlarea="ctlarea", plant="plant0", materiel="materiel", client="client", displayorder="displayorder", suplevel="suplevel", sublevel="sublevel0", plant0="plant00", sublevel0="sublevel", mtlno="mtlno", plant1="plant")
                        hashjoin(condition="sublevel = sublevel and plant = plant and plant0 = plant and materiel = mtlno", type="inner")
                          gather(concurrent=true)
                            osstablescan(tables="copcostobjsubmtl[p1,p2,p3,...p64]", shardcount=64, sql="select `sublevel`, `mtlno`, `plant` from `copcostobjsubmtl` as `copcostobjsubmtl`")
                          project(fiscalyear="fiscalyear", description="description", costtype="costtype", costfield="costfield", postperiod="postperiod", ctlarea="ctlarea", plant="plant0", materiel="materiel", client="client", displayorder="displayorder", suplevel="suplevel", sublevel="sublevel", plant0="plant")
                            hashjoin(condition="plant = plant", type="inner")
                              gather(concurrent=true)
                                osstablescan(tables="copcostobjsupsub[p1,p2,p3,...p64]", shardcount=64, sql="select `suplevel`, `sublevel`, `plant` from `copcostobjsupsub` as `copcostobjsupsub` where (`suplevel` = ?)")
                              gather(concurrent=true)
                                osstablescan(tables="copzzcbtemp[p1,p2,p3,...p64]", shardcount=64, sql="select `fiscalyear`, `description`, `costtype`, `costfield`, `postperiod`, `ctlarea`, `plant`, `materiel`, `client`, `displayorder` from `copzzcbtemp` as `copzzcbtemp` where ((`costtype` = ?) and (`ctlarea` in(?)) and (not (`costfield` = ?)))")
                      gather(concurrent=true)
                        osstablescan(tables="copsubobjdesc[p1,p2,p3,...p64]", shardcount=64, sql="select `costobject`, `description`, `code` from `copsubobjdesc` as `copsubobjdesc`")
                  hashagg(group="costtype,description", $f2="count()")
                    osstablescan(tables="copcosttypetmp[p35]", sql="select `costtype`, `description` from `copcosttypetmp` as `copcosttypetmp` where (`costtype` = ?)")
              gather(concurrent=true)
                osstablescan(tables="repv_product[p1,p2,p3,...p64]", shardcount=64, sql="select `client`, `vproductcode`, `vbrand`, `vbrandtext`, `vpdtseries`, `venergytype` from `repv_product` as `repv_product` where ((`companycode` = ?) and (`vproductcode` is not null))")
            project(client="client", mtlno="mtlno", plant="plant0", busarea="busarea0", productgroupname="productgroupname", =="bussenergy = ?1")
              hashagg(group="client,mtlno,bussenergy,productgroupname,busarea0,plant0")
                project(client="client1", division="division0", mtlno="mtlno0", busarea="busarea0", client0="client00", bussenergy="bussenergy", productgroupname="productgroupname", client1="client0", division0="division", plant="plant0", busarea0="busarea", client2="client", mtlno0="mtlno", plant0="plant")
                  hashjoin(condition="mtlno = mtlno and client = client and client = client0 and client = client1 and plant = plant", type="inner")
                    gather(concurrent=true)
                      osstablescan(tables="repmmrplantmtl[p1,p2,p3,...p64]", shardcount=64, sql="select `client`, `mtlno`, `plant` from `repmmrplantmtl` as `repmmrplantmtl` where (`client` = ?)")
                    hashjoin(condition="division = division and client = client and client0 = client", type="inner")
                      hashjoin(condition="client = client and busarea = busarea", type="inner")
                        gather(concurrent=true)
                          osstablescan(tables="oubusareadetermination[p1,p2,p3,...p16]", shardcount=16, sql="select `client`, `division`, `plant`, `busarea` from `oubusareadetermination` as `oubusareadetermination` where (`client` = ?)")
                        gather(concurrent=true)
                          osstablescan(tables="repgldbusinessarea[p1,p2,p3,...p64]", shardcount=64, sql="select `busarea`, `client`, `bussenergy`, `productgroupname` from `repgldbusinessarea` as `repgldbusinessarea` where ((`client` = ?) and (`companycode` = ?))")
                      gather(concurrent=true)
                        osstablescan(tables="mdmmmrgenmtl[p1,p2,p3,...p64]", shardcount=64, sql="select `client`, `division`, `mtlno` from `mdmmmrgenmtl` as `mdmmmrgenmtl` where ((`mtltype` = ?) and (`client` = ?))")
          gather(concurrent=true)
            osstablescan(tables="materielseriesrelation[p1,p2,p3,...p64]", shardcount=64, sql="select `client`, `materielmid`, `vbrand`, `vbrandtext`, `carstyle`, `venergytype` from `materielseriesrelation` as `materielseriesrelation`")
