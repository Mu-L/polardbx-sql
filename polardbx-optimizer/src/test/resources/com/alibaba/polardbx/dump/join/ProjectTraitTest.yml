SQL:
  - sql: |
      /*+TDDL:workload_type=ap ENABLE_SHUFFLE_BY_PARTIAL_KEY=false enable_bka_join=false enable_cbo_push_join=false 
      enable_post_planner=false enable_push_cbo_join=false enable_push_join=false 
      hash_join(OR_UD_TICKET_EXPAND_ET, ( or_payway_two_record_et,OR_UD_TICKET_ET)) 
      hash_join(or_payway_two_record_et,OR_UD_TICKET_ET) 
      enable_master_mpp=false enable_broadcast_join=false*/
      SELECT
        expanda.`UD_TICKET_EXPAND_ID` as pk,
        expanda.COLUMN11 AS prepaidDiscountMoney,
        m.TICKET_ID,
        m.org_id,
        m.ticket_id,
        p.TICKET_ID,
        p.org_id,
        p.ticket_id,
        expanda.TICKET_ID,
        expanda.org_id,
        expanda.ticket_id
      FROM
        OR_UD_TICKET_ET m
        LEFT JOIN or_payway_two_record_et p ON p.org_id = m.org_id
        AND p.ticket_id = m.ticket_id
        AND p.shop_id = m.shop_id
        AND p.ORG_ID = 47
        left JOIN OR_UD_TICKET_EXPAND_ET expanda ON m.ORG_ID = expanda.ORG_ID
        AND m.SHOP_ID = expanda.SHOP_ID
        AND m.TICKET_ID = expanda.TICKET_ID
        AND expanda.column11 IS NOT NULL
        AND expanda.ORG_ID = 47
      WHERE
        m.ORG_ID = 47
        AND m.REPORT_DATE >= '2025-08-01 00:00:00.0'
        AND m.REPORT_DATE < date_add('2025-08-31 00:00:00.0', INTERVAL 1 DAY)
        AND m.TICKET_ID = 'X131121422331021009'
        AND m.WAREHOUSE_ID IN (1286)
      order by
        prepaidDiscountMoney desc
    plan: |
      project(pk="ud_ticket_expand_id", prepaiddiscountmoney="column11", ticket_id="ticket_id0", org_id="org_id0", ticket_id0="ticket_id0", ticket_id00="ticket_id00", org_id0="org_id00", ticket_id01="ticket_id00", ticket_id1="ticket_id", org_id1="org_id", ticket_id10="ticket_id")
        exchange(distribution=single, collation=[4 desc-nulls-last])
          memsort(sort="column11 desc")
            hashjoin(condition="org_id = org_id and shop_id = shop_id and ticket_id = ticket_id", type="right")
              exchange(distribution=hash[1, 2, 3], collation=[])
                logicalview(tables="or_ud_ticket_expand_et[p32]", sql="select `ud_ticket_expand_id`, `org_id`, `shop_id`, `ticket_id`, `column11` from `or_ud_ticket_expand_et` as `or_ud_ticket_expand_et` where ((`org_id` = ?) and (`org_id` = ?) and (`ticket_id` = ?) and (`column11` is not null))")
              project(org_id="org_id0", shop_id="shop_id0", ticket_id="ticket_id0", ticket_id0="ticket_id", org_id0="org_id", shop_id0="shop_id")
                exchange(distribution=hash[3, 4, 5], collation=[])
                  hashjoin(condition="org_id = org_id and ticket_id = ticket_id and shop_id = shop_id", type="right")
                    exchange(distribution=hash[1, 0, 2], collation=[])
                      logicalview(tables="or_payway_two_record_et[p32]", sql="select `ticket_id`, `org_id`, `shop_id` from `or_payway_two_record_et` as `or_payway_two_record_et` where ((`org_id` = ?) and (`org_id` = ?) and (`ticket_id` = ?))")
                    exchange(distribution=hash[0, 2, 1], collation=[])
                      logicalview(tables="or_ud_ticket_et[p32]", sql="select `org_id`, `shop_id`, `ticket_id` from `or_ud_ticket_et` as `or_ud_ticket_et` where ((`org_id` = ?) and (`ticket_id` = ?) and (`warehouse_id` in(?)) and (`report_date` >= ?) and (`report_date` < date_add(?, interval 1 day)))")
