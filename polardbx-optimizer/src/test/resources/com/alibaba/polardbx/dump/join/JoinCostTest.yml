SQL:
  - sql: |
      select   mg.id,   mg.archive_id,   mg.name,   mg.deal_type,   mg.presell_date,   mg.amount,   mg.sell_status,   mg.platform_id,   mg.imgs,   mg.sell_time,   mg.check_status,   case     when mg.violation_status is null then 0     else mg.violation_status   end as violation_status,   mg.goods_status,   mg.coming_from_third_party,   mg.goods_type,   mg.auction_end_time from   (     select       maor.goods_id,       max(maor.create_time) createTime     from       mall_auction_offer_record maor     where       maor.uid = 453549       and maor.del_flag = 0       and maor.pay_status = 1     group by       maor.goods_id     order by       createTime desc   ) a   left join mall_goods mg on mg.id = a.goods_id where   mg.del_flag = 0   and mg.sell_status = 1   and mg.goods_status = 1
    plan: |
      project(id="id", archive_id="archive_id", name="name", deal_type="deal_type", presell_date="presell_date", amount="amount", sell_status="sell_status", platform_id="platform_id", imgs="imgs", sell_time="sell_time", check_status="check_status", violation_status="case", goods_status="goods_status", coming_from_third_party="coming_from_third_party", goods_type="goods_type", auction_end_time="auction_end_time")
        bkajoin(condition="goods_id = id", type="inner")
          logicalview(tables="mall_auction_offer_record[p1]", sql="select `goods_id`, max(`create_time`) as `createtime` from `mall_auction_offer_record` as `mall_auction_offer_record` where ((`uid` = ?) and (`del_flag` = ?) and (`pay_status` = ?)) group by `goods_id`")
          gather(concurrent=true)
            logicalview(tables="mall_goods[p1,p2,p3,...p64]", shardcount=64, sql="select `id`, `name`, `deal_type`, `amount`, `sell_status`, `sell_time`, `imgs`, `platform_id`, `check_status`, `goods_status`, `coming_from_third_party`, `archive_id`, `goods_type`, `auction_end_time`, `presell_date`, (case when (`violation_status` is null) then ? else `violation_status` end) as `case` from `mall_goods` as `mall_goods` force index(`primary`) where ((`sell_status` = ?) and (`goods_status` = ?) and (`del_flag` = ?) and (`id` in (...)))")
  - sql: |
      select
            mg.id,
            mg.archive_id,
            mg.name,
            mg.deal_type,
            mg.presell_date,
            mg.amount,
            mg.sell_status,
            mg.platform_id,
            mg.imgs,
            mg.sell_time,
            mg.check_status,
            case
                  when mg.violation_status is null then 0
                  else mg.violation_status
            end as violation_status,
            mg.goods_status,
            mg.coming_from_third_party,
            mg.goods_type,
            mg.auction_end_time
      from
            (
                  select
                        maor.goods_id,
                        max(maor.create_time) createTime
                  from
                        mall_auction_offer_record maor
                  where
                        maor.uid = 453549
                        and maor.del_flag = 0
                        and maor.pay_status = 1
                  group by
                        maor.goods_id
                  order by
                        createTime desc limit 10
            ) a
            left join mall_goods mg on mg.id = a.goods_id
      where
            mg.del_flag = 0
            and mg.sell_status = 1
            and mg.goods_status = 1
    plan: |
      project(id="id", archive_id="archive_id", name="name", deal_type="deal_type", presell_date="presell_date", amount="amount", sell_status="sell_status", platform_id="platform_id", imgs="imgs", sell_time="sell_time", check_status="check_status", violation_status="case", goods_status="goods_status", coming_from_third_party="coming_from_third_party", goods_type="goods_type", auction_end_time="auction_end_time")
        bkajoin(condition="goods_id = id", type="inner")
          logicalview(tables="mall_auction_offer_record[p1]", sql="select `goods_id`, max(`create_time`) as `createtime` from `mall_auction_offer_record` as `mall_auction_offer_record` where ((`uid` = ?) and (`del_flag` = ?) and (`pay_status` = ?)) group by `goods_id` order by max(`create_time`) desc limit ?")
          gather(concurrent=true)
            logicalview(tables="mall_goods[p1,p2,p3,...p64]", shardcount=64, sql="select `id`, `name`, `deal_type`, `amount`, `sell_status`, `sell_time`, `imgs`, `platform_id`, `check_status`, `goods_status`, `coming_from_third_party`, `archive_id`, `goods_type`, `auction_end_time`, `presell_date`, (case when (`violation_status` is null) then ? else `violation_status` end) as `case` from `mall_goods` as `mall_goods` force index(`primary`) where ((`sell_status` = ?) and (`goods_status` = ?) and (`del_flag` = ?) and (`id` in (...)))")
DDL:
  mall_auction_offer_record:
    CREATE TABLE `mall_auction_offer_record` ( 	`id` bigint(20) NOT NULL AUTO_INCREMENT, 	`uid` bigint(20) NOT NULL, 	`goods_id` bigint(20) NOT NULL, 	`auction_order_id` bigint(20) DEFAULT NULL, 	`auction_order_no` varchar(255) DEFAULT NULL, 	`amount` decimal(32, 2) DEFAULT NULL, 	`status` bit(1) DEFAULT 0x00, 	`is_show` bit(1) DEFAULT 0x01, 	`version` int(11) NOT NULL DEFAULT '0', 	`create_by` bigint(20) NOT NULL, 	`create_time` datetime DEFAULT NULL, 	`update_by` bigint(20) DEFAULT NULL, 	`update_time` datetime DEFAULT NULL ON UPDATE CURRENT_TIMESTAMP, 	`del_flag` bit(1) NOT NULL, 	`offer_status` bit(1) NOT NULL DEFAULT 0x01, 	`is_automatic_offer` bit(1) DEFAULT 0x00, 	`pay_status` bit(1) DEFAULT 0x01, 	`pay_time` datetime DEFAULT NULL, 	PRIMARY KEY (`id`), 	KEY `idx_result_uid` (`uid`, `goods_id`), 	KEY `idx_goods_id` (`goods_id`) ) SINGLE ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 ROW_FORMAT = DYNAMIC;
  mall_goods:
    CREATE TABLE `mall_goods` ( 	`id` bigint(20) NOT NULL AUTO_INCREMENT, 	`uid` bigint(20) NOT NULL, 	`is_top` bit(1) NOT NULL, 	`name` varchar(200) NOT NULL, 	`deal_type` int(11) NOT NULL, 	`presell_date_1` date DEFAULT NULL, 	`amount` decimal(32, 2) NOT NULL, 	`count` int(11) DEFAULT NULL, 	`sell_status` int(11) NOT NULL, 	`sell_time` datetime DEFAULT NULL, 	`publish_time` datetime DEFAULT NULL, 	`imgs` json NOT NULL, 	`introduce` varchar(3000) NOT NULL, 	`remark` varchar(512) DEFAULT NULL, 	`platform_id` bigint(20) NOT NULL, 	`publisher` varchar(200) DEFAULT NULL, 	`technical_support` varchar(200) DEFAULT NULL, 	`collection_number` varchar(200) DEFAULT NULL, 	`issue_date_1` date DEFAULT NULL, 	`check_status` int(11) NOT NULL, 	`check_time` datetime DEFAULT NULL, 	`goods_status` int(11) NOT NULL, 	`coming_from_third_party` tinyint(4) DEFAULT '0', 	`create_by` bigint(20) NOT NULL, 	`create_time` datetime NOT NULL, 	`update_by` bigint(20) DEFAULT NULL, 	`update_time` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, 	`del_flag` tinyint(1) DEFAULT '0', 	`version` int(11) NOT NULL DEFAULT '0', 	`description` text, 	`archive_id` bigint(20) DEFAULT NULL, 	`goods_type` int(11) DEFAULT '0', 	`violation_status` int(11) DEFAULT '0', 	`record_id` bigint(20) DEFAULT NULL, 	`preferential_id` bigint(20) DEFAULT NULL, 	`preferential_amount` decimal(32, 2) DEFAULT NULL, 	`preferential_name` varchar(255) DEFAULT NULL, 	`auction_start_time` datetime DEFAULT NULL, 	`auction_end_time` datetime DEFAULT NULL, 	`auction_hour_time` int(11) DEFAULT NULL, 	`is_pass_in` bit(1) DEFAULT 0x00, 	`goods_no` varchar(100) DEFAULT NULL, 	`max_offer_amount` decimal(32, 2) DEFAULT '0.00', 	`offer_user_num` int(11) DEFAULT '0', 	`special_type` json DEFAULT NULL, 	`auction_expect_amount` decimal(32, 2) DEFAULT '0.00', 	`is_auto_extension` bit(1) DEFAULT 0x00, 	`name_length` int(11) DEFAULT NULL, 	`temp_archive_type` tinyint(4) DEFAULT '0', 	`generate_type` tinyint(4) DEFAULT '1', 	`presell_date` datetime DEFAULT NULL, 	`issue_date` datetime DEFAULT NULL, 	`delivery_time` int(11) DEFAULT '0', 	`want_buy_end_time` datetime DEFAULT NULL, 	`delivery_time_remake` varchar(255) DEFAULT NULL, 	`auto_down_type` tinyint(4) DEFAULT '0', 	`auto_down_time` datetime DEFAULT NULL, 	`unit_amount` decimal(32, 2) DEFAULT NULL, 	`want_buy_count` int(11) DEFAULT NULL, 	`total_delivery_time` int(11) DEFAULT NULL, 	`active_pay_earnest` tinyint(4) DEFAULT '0', 	`rent_request_end_time` datetime DEFAULT NULL, 	`restitution_end_time` datetime DEFAULT NULL, 	`package_count` int(11) DEFAULT NULL, 	`fancy_number_type` json DEFAULT NULL, 	`transfer_sell_type` int(11) DEFAULT '1', 	`is_self_sell` int(11) DEFAULT '0', 	`is_real` int(11) DEFAULT '0', 	`nft_id` bigint(20) DEFAULT NULL, 	PRIMARY KEY (`id`), 	KEY `idx_sell_status_check_status_good_status_is_top` (`sell_status`, `check_status`, `goods_status`, `is_top`), 	KEY `idx_uid_create_time` (`uid`, `create_time`), 	KEY `idx_create_time` (`create_time`), 	KEY `idx_platformid_archiveid_delflag` (`platform_id`, `archive_id`, `del_flag`), 	KEY `idx_uid` (`uid`), 	KEY `idx_publish_time` (`publish_time`), 	KEY `archive_id` (`archive_id`), 	KEY `idx_platform_id` (`platform_id`), 	KEY `idx_uid_publish_time` (`uid`, `publish_time`), 	KEY `idx_amount_checktime` (`amount`, `check_time`), 	KEY `idx_status_auction_end_time` (`sell_status`, `check_status`, `goods_status`, `goods_type`, `del_flag`, `auction_end_time`), 	KEY `idx_status_want_buy_end_time` (`sell_status`, `check_status`, `goods_status`, `goods_type`, `del_flag`, `want_buy_end_time`), 	KEY `idx_status_rent_request_end_time` (`sell_status`, `check_status`, `goods_status`, `goods_type`, `del_flag`, `rent_request_end_time`), 	KEY `idx_status_auto_down_time` (`sell_status`, `check_status`, `goods_status`, `goods_type`, `del_flag`, `auto_down_time`), 	KEY `idx_nft_id` USING BTREE (`nft_id`) ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 ROW_FORMAT = DYNAMIC PARTITION BY KEY (`id`) PARTITIONS 64;
