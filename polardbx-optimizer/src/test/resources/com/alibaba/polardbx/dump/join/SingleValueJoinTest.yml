LT NULL, 	`CHECK_TIME` datetime DEFAULT NULL, 	`TIMESTAMP` bigint(20) NOT NULL, 	`REMARKS` varchar(1024) DEFAULT NULL, 	`TOTAL_AMOUNT` decimal(18, 6) DEFAULT NULL, 	`TOTAL_NUM` decimal(18, 2) DEFAULT NULL, 	`TOTAL_BOX_NUM` decimal(18, 2) DEFAULT NULL, 	`LABEL_AMOUNT` decimal(18, 2) DEFAULT NULL, 	`TOTAL_FINISHED_NUM` decimal(18, 2) DEFAULT NULL, 	`TOTAL_FINISHED_AMOUNT` decimal(18, 2) DEFAULT NULL, 	`OUT_LABEL_AMOUNT` decimal(18, 6) DEFAULT NULL, 	`COMPANY_CODE` varchar(32) DEFAULT NULL, 	`tran_mode` varchar(200) DEFAULT NULL, 	`SAP_LFART` varchar(16) DEFAULT NULL, 	`SAP_VBELN` varchar(16) DEFAULT NULL, 	`POSTAL_CODE` varchar(16) DEFAULT NULL, 	`COUNTRY` varchar(16) DEFAULT NULL, 	`PROVINCE` varchar(16) DEFAULT NULL, 	`CITY` varchar(100) DEFAULT NULL, 	`ORDER_SAM` varchar(32) DEFAULT NULL, 	`STORE_SAM` varchar(32) DEFAULT NULL, 	`FINAL_DC_CLUB` varchar(32) DEFAULT NULL, 	`CANCEL_DATE` datetime DEFAULT NULL, 	`COST_CENTER` varchar(64) DEFAULT NULL, 	`BELONG_PROVINCE_CODE` varchar(32) DEFAULT NULL, 	`BELONG_PROVINCE_NAME` varchar(64) DEFAULT NULL, 	`BELONG_CITY_CODE` varchar(32) DEFAULT NULL, 	`BELONG_CITY_NAME` varchar(64) DEFAULT NULL, 	`BELONG_AREA_CODE` varchar(32) DEFAULT NULL, 	`BELONG_AREA_NAME` varchar(364) DEFAULT NULL, 	`is_express_delivery` varchar(32) DEFAULT NULL, 	`ADDRESS` varchar(1024) DEFAULT NULL, 	`is_to_warehouse` varchar(32) DEFAULT NULL, 	`sap_customer_code` varchar(64) DEFAULT NULL, 	`sap_inner_order_no` varchar(64) DEFAULT NULL, 	PRIMARY KEY (`SD_SALEBILL_ID`), 	CLUSTERED COLUMNAR INDEX `cci_or_sd_salebill_et`(`org_id`) PARTITION BY HASH (`ORG_ID`) PARTITIONS 32, 	KEY `auto_shard_key_org_id_sd_salebill_id` USING BTREE (`ORG_ID`, `SD_SALEBILL_ID`) ) ENGINE = InnoDB DEFAULT CHARSET = utf8 PARTITION BY KEY (`ORG_ID`, `SD_SALEBILL_ID`) PARTITIONS 32;
