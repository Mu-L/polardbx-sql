      /*+TDDL:cmd_extra(ENABLE_PUSH_CORRELATE=true)*/
      WITH calendar_workdays AS (   SELECT      ID,     ROW_NUMBER() OVER (ORDER BY ID) AS workday_rank   FROM AU_CALENDAR   WHERE WORK = 'Y' ), filtered_audit AS (   SELECT      aa.*,     (       SELECT workday_rank        FROM calendar_workdays        WHERE ID > aa.TIME_LIMITED_END_DATE        ORDER BY ID        LIMIT 1     ) AS next_workday_rank   FROM AU_AUDIT aa   WHERE      aa.TYPE = 'appropriate'     AND aa.AUDITED_AT IS NULL     AND aa.USER_ID IS NOT NULL ), final_data AS (   SELECT      tt.ID AS theme_id,     tt.NAME AS theme_name,     fa.USER_ID AS audit_user_id,     rr.ID AS request_id,     fa.TIME_LIMITED_END_DATE   FROM filtered_audit fa   JOIN REQ_REQUEST rr ON rr.ID = fa.REQUEST_ID   JOIN TH_THEME tt ON tt.ID = rr.THEME_ID      AND tt.ENABLED = 'Y'      AND tt.SPECIES = 0   JOIN TH_THEME_TYPE ttt ON ttt.ID = tt.THEME_TYPE_ID      AND ttt.ENABLED = 'Y'   LEFT JOIN AU_APPROPRIATE_RESULT aar      ON aar.REQUEST_ID = rr.ID AND aar.RESULT = 0   LEFT JOIN calendar_workdays cw      ON cw.workday_rank = fa.next_workday_rank + 2   WHERE      aar.ID IS NULL     AND UNIX_TIMESTAMP(NOW()) * 1000 > UNIX_TIMESTAMP(cw.ID) * 1000 ) SELECT * FROM final_data
    plan: |
      project(theme_id="id1", theme_name="name0", audit_user_id="user_id", request_id="id0", time_limited_end_date="time_limited_end_date")
        filter(condition="unix_timestamp(cast(?8)) * ?9 > unix_timestamp(id) * ?10")
          hashjoin(condition="f3w0$o0 = +", type="left", build="left")
            project(user_id="user_id", time_limited_end_date="time_limited_end_date", id0="id", id1="id0", name0="name0", +="$f0 + ?7")
              filter(condition="is null(id1)")
                project(request_id="request_id0", user_id="user_id", time_limited_end_date="time_limited_end_date", $f0="$f0", id="id", id0="id0", name0="name0", id1="id1", request_id0="request_id")
                  hashjoin(condition="id = request_id", type="inner")
                    logicalview(tables="req_request[p1],th_theme[p1],th_theme_type[p1],au_appropriate_result[p1]", sql="select `req_request`.`id`, `th_theme`.`id` as `id0`, `th_theme`.`name` as `name0`, `t0`.`id` as `id1`, `t0`.`request_id` from `req_request` as `req_request` inner join `th_theme` as `th_theme` on ((`th_theme`.`enabled` = ?) and (`th_theme`.`species` = ?) and (`req_request`.`theme_id` = `th_theme`.`id`)) inner join `th_theme_type` as `th_theme_type` on ((`th_theme`.`theme_type_id` = `th_theme_type`.`id`) and (`th_theme_type`.`enabled` = ?)) left join (select `id`, `request_id` from `au_appropriate_result` as `au_appropriate_result` where (`result` = ?)) as `t0` on (`req_request`.`id` = `t0`.`request_id`)")
                    correlateapply(cor=$cor0, leftconditions=[], opkind=null, type=left)
                      logicalview(tables="au_audit[p1]", sql="select `request_id`, `user_id`, `time_limited_end_date` from `au_audit` as `au_audit` where ((`audited_at` is null) and (`type` = ?) and (`user_id` is not null))")
                      project($f0="f3w0$o0")
                        limit(offset=0, fetch=?1)
                          filter(condition="id > $cor0.time_limited_end_date")
                            sortwindow(id="id", f3w0$o0="window#0row_number()", reference windows="window#0=window(partition {} order by [0 asc-nulls-first] rows between unbounded preceding and current row aggs [row_number()])")
                              logicalview(tables="au_calendar[p1]", sql="select `id` from `au_calendar` as `au_calendar` where (`work` = ?) order by `id`")
            sortwindow(id="id", f3w0$o0="window#0row_number()", reference windows="window#0=window(partition {} order by [0 asc-nulls-first] rows between unbounded preceding and current row aggs [row_number()])")
              logicalview(tables="au_calendar[p1]", sql="select `id` from `au_calendar` as `au_calendar` where (`work` = ?) order by `id`")
