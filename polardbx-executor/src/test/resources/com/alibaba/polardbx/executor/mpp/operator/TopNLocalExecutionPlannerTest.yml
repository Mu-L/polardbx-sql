- sql: |
    select l_orderkey, l_shipdate from lineitem where l_shipdate > '1990-10-01' order by l_orderkey, l_shipdate limit 10000, 10;
  plan: |
    topn(sort="l_orderkey asc,l_shipdate asc", offset=?1, fetch=?2)
      exchange(distribution=single, collation=[0 asc-nulls-first, 1 asc-nulls-first])
        topn(sort="l_orderkey asc,l_shipdate asc", fetch=+(?2, ?1))
          osstablescan(tables="lineitem[p1,p2,p3,p4]", shardcount=4, sql="select `l_orderkey`, `l_shipdate` from `lineitem` as `lineitem` where (`l_shipdate` > ?)")

