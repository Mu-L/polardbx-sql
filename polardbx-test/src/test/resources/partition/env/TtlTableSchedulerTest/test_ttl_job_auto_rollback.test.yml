## DISABLE_FAST_SQL_PARSER

set TTL_DEBUG_CCI_SKIP_DDL_TASKS = "WaitColumnarTableAlterPartitionTask,WaitColumnarTableCreationTask";
set SKIP_DDL_TASKS="WaitColumnarTableAlterPartitionTask,WaitColumnarTableCreationTask";
set TTL_DEBUG_CURRENT_DATETIME='2024-06-27 00:00:00';

set TTL_DEBUG_USE_GSI_FOR_COLUMNAR_ARC_TBL = false;
set TTL_FORBID_DROP_TTL_TBL_WITH_ARC_CCI = false;

use polardbx;
drop database if exists test_tj_rb_db1;
create database if not exists test_tj_rb_db1 mode='auto';
use test_tj_rb_db1;


## create table
drop table if exists ttl_t1_k8;
create table ttl_t1_k8(
a int not null auto_increment,
b datetime,
primary key(a)
)
partition by key(a)
partitions 8;

delete from ttl_t1_k8 where 1=1;
insert into ttl_t1_k8 values (1, '2024-05-01 00:00:00');
insert into ttl_t1_k8 values (2, '2024-06-26 00:00:00');
insert into ttl_t1_k8 values (3, '2024-06-27 00:00:00');
insert into ttl_t1_k8 values (4, '2024-06-28 00:00:00');
insert into ttl_t1_k8 values (5, '2024-06-29 00:00:00');
alter table ttl_t1_k8
modify ttl
ttl_enable = 'on',
ttl_cleanup = 'on',
ttl_expr = `b` expire after 1 day timezone '+08:00',
ttl_job = cron '0 0 0 1 1 ? */1' timezone '+08:00',
archive_table_pre_allocate=2,
archive_table_post_allocate=4
;
select * from ttl_t1_k8 order by a;


## ttl-job deleting will be auto-rollback because of out of maintain window
/*+TDDL:cmd_extra(TTL_JOB_MAINTENANCE_ENABLE=true,TTL_DEBUG_CURRENT_DATETIME='2024-06-27 02:00:00',TTL_JOB_MAINTENANCE_TIME_START='00:00:01',TTL_JOB_MAINTENANCE_TIME_END='23:59:59',FP_TTL_SCHEDULE_JOB_SUSPEND_TIME_ON_WAIT_FINISH_RUNNING=500,TTL_JOB_INTERRUPT_IGNORE_MAINTAIN_WINDOWS=true,FP_TTL_JOB_SUSPEND_TIME_ON_DELETE_ROW=15000)*/fire schedule by table ttl_t1_k8;
select sleep(10);
select * from ttl_t1_k8 order by a;

