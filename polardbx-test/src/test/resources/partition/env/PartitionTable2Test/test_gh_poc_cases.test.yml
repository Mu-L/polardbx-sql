-- 03 - RANGE COLUMNS分区
drop table if exists T_PAR_03_RANGE_COLS;
CREATE TABLE T_PAR_03_RANGE_COLS (
id INT NOT NULL,
fname VARCHAR(30),
Iname VARCHAR(30),
hired DATE NOT NULL DEFAULT '1970-01-01',
separated DATE NOT NULL DEFAULT '9999-12-31',
job_code INT NOT NULL,
store_id INT NOT NULL,
primary key(Iname,job_code,store_id)
)
PARTITION BY RANGE COLUMNS (Iname,job_code,store_id) (
PARTITION p0 VALUES LESS THAN ('g',5,10),
PARTITION p1 VALUES LESS THAN ('m',10,20),
PARTITION p2 VALUES LESS THAN ('t',15,30),
PARTITION p3 VALUES LESS THAN (MAXVALUE,MAXVALUE,MAXVALUE)
);


