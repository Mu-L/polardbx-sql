PARTITION BY LIST( YEAR(purchased) )
SUBPARTITION BY HASH( TO_DAYS(purchased) ) (
PARTITION p0 VALUES IN (1990) (
SUBPARTITION s0,
SUBPARTITION s1
),
PARTITION p1 VALUES IN (2000) (
SUBPARTITION s2,
SUBPARTITION s3
)
);


-- 12-二维分区-LIST+KEY
