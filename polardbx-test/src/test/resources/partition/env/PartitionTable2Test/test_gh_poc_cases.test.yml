-- 09-二维分区-RANGE+HASH
drop table if exists T_PAR_09_SUBPAR_RANGE_HASH;
CREATE TABLE T_PAR_09_SUBPAR_RANGE_HASH (id INT, purchased DATE, primary key(purchased))
PARTITION BY RANGE( YEAR(purchased) )
SUBPARTITION BY HASH( TO_DAYS(purchased) ) (
PARTITION p0 VALUES LESS THAN (1990) (
SUBPARTITION s0,
SUBPARTITION s1
),
PARTITION p1 VALUES LESS THAN (2000) (
SUBPARTITION s2,
SUBPARTITION s3
),
PARTITION p2 VALUES LESS THAN MAXVALUE (
SUBPARTITION s4,
SUBPARTITION s5
)
);



-- 10-二维分区-RANGE+KEY
