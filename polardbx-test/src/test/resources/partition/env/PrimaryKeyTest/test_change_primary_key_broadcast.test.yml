drop table if exists b1;
drop table if exists b2;
drop table if exists b3;
drop table if exists b4;
drop table if exists b5;

create table b1(a int primary key, b int) broadcast;
create table b2(a bit(10), b int, primary key(a,b)) broadcast;

create table b3(a int primary key, b int) broadcast;
create table b4(a bit(10), b int, primary key(a,b)) broadcast;

create table b5(a int, b int) broadcast;

insert into b1 values(1,1);
insert into b2 values(2,2);
insert into b3 values(3,3);
insert into b4 values(4,4);
insert into b5 values(5,5);

alter table b1 change column a a1 bit(10);
alter table b2 change column a a1 int;

show full create table b1;
show full create table b2;

alter table b1 change column a1 a2 bit(10);
alter table b2 change column a1 a2 int;

show full create table b1;
show full create table b2;

alter table b1 change column b b1 bigint;
alter table b2 change column b b1 bigint;

show full create table b1;
show full create table b2;

alter table b3 change column a b bit(10), change column b a bigint;
alter table b4 change column a c int, change column b d bigint;

show full create table b3;
show full create table b4;

alter table b5 change column `_drds_implicit_id_` `c` bigint(20) NOT NULL AUTO_INCREMENT;

show full create table b5;

insert into b1 values(6,6);
insert into b2 values(7,7);
insert into b3 values(8,8);
insert into b4 values(9,9);
insert into b5(a,b) values(10,10);

select * from b1;
select * from b2;
select * from b3;
select * from b4;
select * from b5;