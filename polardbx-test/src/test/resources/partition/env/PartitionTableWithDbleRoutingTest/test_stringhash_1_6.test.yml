create table string_hash_table(id int)
  partition by udf_hash(
  `id` with udf_params(
  'dble/stringhash',
  '{
"partitionCount" : "4",
"partitionLength" : "721"
}'
  )
)
partitions 4;


create table string_hash_table(id varchar(10))
partition by udf_hash(
  `id` with udf_params(
    'dble/stringhash',
  '{
"partitionCount" : "4",
"partitionLength" : "256",
"hashSlice":"0:2"
}'
  )
)
partitions 4;

