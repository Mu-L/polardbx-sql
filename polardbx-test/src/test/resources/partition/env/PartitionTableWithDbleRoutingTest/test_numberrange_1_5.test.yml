create table numberrange_table (
  id int
  )
  partition by UDF_HASH(
  `id` with udf_params(
  'dble/numberrange',
  '{
"mapFile":
  "
  0-255=0
  256-500=1
  501-755=2
  756-1000=3
  "
}'
   )
 ) 
 partitions 4;

select part_route('','numberrange_table',0);
