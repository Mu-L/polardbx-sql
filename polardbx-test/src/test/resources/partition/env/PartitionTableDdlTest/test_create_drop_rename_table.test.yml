## DISABLE_FAST_SQL_PARSER

drop database if exists test_create_drop_rename_table;
create database test_create_drop_rename_table mode = 'auto';

use test_create_drop_rename_table;
  
create table t1 (
  a int,
  b varchar(10),
  c bigint,
  index local_idx_b(b),
  global index global_idx_b(b) partition by key(b) partitions 5,
  clustered index clustered_idx_c(c) partition by key(c) partitions 2
) partition by key(a) partitions 3;

create table t2 (
  d int,
  e varchar(10),
  f bigint,
  index local_idx_d(d),
  global index global_idx_d(d) partition by key(d) partitions 2,
  clustered index clustered_idx_f(f) partition by key(f) partitions 3
) partition by key(d) partitions 4;

show create table t1;
show create table t2;

alter table t1 drop index global_idx_b;

show table replicate status order by gsi_name;

alter table t1 drop index clustered_idx_c;

show table replicate status order by gsi_name;

rename table t1 to t1_rename;

show create table t1_rename;

alter table t1_rename add global index global_idx_b(b) partition by key(b) partitions 5;
alter table t1_rename add clustered index clustered_idx_c(c) partition by key(c) partitions 2;

show table replicate status order by gsi_name;

rename table t1_rename to t1;

show table replicate status order by gsi_name;
show create table t1;

alter table t1 rename index global_idx_b to gsi_b;
alter table t1 rename index clustered_idx_c to csi_c;

show table replicate status order by gsi_name;

rename table t1 to tmp;
rename table t2 to t1;

show table replicate status order by gsi_name;

rename table t1 to t2, tmp to t1;

show table replicate status order by gsi_name;

drop table t1;

show table replicate status order by gsi_name;

