## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG

## test_ttl_rebuild_blocked_by_gsi
## Verify TTL table with GSI cannot use rebuild policy, falls back to row-level delete

set TTL_DEBUG_USE_GSI_FOR_COLUMNAR_ARC_TBL = false;
set TTL_DEBUG_CCI_SKIP_DDL_TASKS = "WaitColumnarTableAlterPartitionTask,WaitColumnarTableCreationTask";
set SKIP_DDL_TASKS="WaitColumnarTableAlterPartitionTask,WaitColumnarTableCreationTask";
set sql_mode='';
set TTL_ADD_MAXVAL_PART_ON_CCI_CREATING=true;
set TTL_FORBID_DROP_TTL_TBL_WITH_ARC_CCI = false;

CREATE TABLE `ttl_rb4` (
  `a` bigint(20) NOT NULL AUTO_INCREMENT,
  `b` datetime DEFAULT NULL,
  `c` int DEFAULT NULL,
  PRIMARY KEY(a),
  GLOBAL INDEX `gsi_c`(`c`) PARTITION BY KEY(`c`) PARTITIONS 4
) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4
TTL = TTL_DEFINITION (
  TTL_ENABLE = 'OFF',
  TTL_EXPR = `b` EXPIRE AFTER 1 month TIMEZONE '+08:00',
  TTL_JOB = CRON '0 0 2 * * ? *',
  TTL_CLEANUP = 'ON',
  ARCHIVE_TYPE = 'ROW',
  ARCHIVE_TABLE_NAME = '',
  ARCHIVE_TABLE_PRE_ALLOCATE = 12,
  ARCHIVE_TABLE_POST_ALLOCATE = 12
)
PARTITION BY KEY(`a`)
PARTITIONS 4;

insert into ttl_rb4 values (1, '2025-01-10 00:00:00', 10);
insert into ttl_rb4 values (2, '2025-02-10 00:00:00', 20);
insert into ttl_rb4 values (3, '2025-03-10 00:00:00', 30);
insert into ttl_rb4 values (4, '2025-04-15 00:00:00', 40);
insert into ttl_rb4 values (5, '2025-04-20 00:00:00', 50);

set TTL_DEBUG_CURRENT_DATETIME='2025-04-27 00:00:00';

select a, date_format(b, '%Y-%m-%d %H:%i:%s') as b_val, c from ttl_rb4 order by a;

/*+TDDL:CMD_EXTRA(TTL_ENABLE_CLEANUP_EXPIRED_DATA_BY_REBUILD_POLICY=true,TTL_FORCE_USE_REBUILD_POLICY_FOR_CLEANUP_EXPIRED_DATA=true)*/ alter table ttl_rb4 cleanup expired data;

select a, date_format(b, '%Y-%m-%d %H:%i:%s') as b_val, c from ttl_rb4 order by a;

drop table ttl_rb4;
