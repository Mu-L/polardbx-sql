DROP TABLE IF EXISTS `product_success_order`;
CREATE TABLE  `product_success_order` (
`id` bigint NOT NULL AUTO_INCREMENT COMMENT '订单id',
`product_type` int NOT NULL COMMENT 'Product type',
`data_date` varchar(10) CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci NOT NULL DEFAULT '' COMMENT '数据日期yyyyMMddHH',
`user_id` bigint NOT NULL DEFAULT '0' COMMENT '用户id',
`broker_id` int NOT NULL DEFAULT '0' COMMENT '券商ID',
`source_id` varchar(100) NOT NULL DEFAULT '',
`currency_id` int NOT NULL DEFAULT '0' COMMENT '币种',
`amount` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '出借金额',
`min_amount` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '小时内最低申购金额',
`user_rate` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '用户设置最低利率',
`rate` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '成交利率',
`status` tinyint NOT NULL DEFAULT '0' COMMENT '状态 0未赎回发息 1 已通知资金利息 2: 资金发息成功 3: 资金发息失败',
`interest` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '利息',
`user_interest` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '用户最终可收利息',
`sys_interest` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '系统最终可收利息',
`create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
`modify_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '修改时间',
PRIMARY KEY (`id`),
UNIQUE KEY `idx_u_c_b_date_s` (`product_type`, `user_id`, `currency_id`, `broker_id`, `data_date`, `source_id`, `create_time`),
KEY `idx_data_date_status` (`data_date`, `status`),
KEY `idx_product_currency_date_status` (`product_type`, `currency_id`, `data_date`, `status`),
KEY `idx_product_date_status` (`product_type`, `data_date`, `status`),
KEY `idx_product_date_currency_status_optimized` (`product_type`, `data_date`, `currency_id`, `status`, `user_id`, `broker_id`, `source_id`),
KEY `auto_shard_key_user_id` USING BTREE (`user_id`),
KEY `auto_shard_key_create_time` USING BTREE (`create_time`)
) ENGINE = InnoDB DEFAULT COLLATE = utf8mb4_bin
PARTITION BY KEY(`user_id`)
PARTITIONS 2
SUBPARTITION BY RANGE COLUMNS(`create_time`)
