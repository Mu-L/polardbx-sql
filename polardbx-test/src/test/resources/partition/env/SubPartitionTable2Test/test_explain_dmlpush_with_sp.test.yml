DROP TABLE IF EXISTS `product_currency_mapped_fund_snapshot`;
CREATE TABLE `product_currency_mapped_fund_snapshot` (
`product_type` int NOT NULL COMMENT 'Product type',
`batch_id` varchar(200) NOT NULL COMMENT 'batch id for snapshot request',
`data_date` varchar(12) CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci NOT NULL DEFAULT '' COMMENT '数据日期yyyyMMddHHmm',
`user_id` bigint NOT NULL COMMENT '用户id',
`broker_id` int NOT NULL DEFAULT '0',
`source_id` bigint NOT NULL DEFAULT '0',
`currency_id` int NOT NULL DEFAULT '0' COMMENT '币种id',
`available` decimal(32, 16) NOT NULL DEFAULT '0.0000000000000000' COMMENT '余额（总申购数量）',
`rate` decimal(32, 16) NOT NULL DEFAULT '0.0100000000000000' COMMENT '（申购设置的利率）',
`queue_time` datetime DEFAULT CURRENT_TIMESTAMP COMMENT '队列更新时间（仅新增申购或修改利率时修改）',
`sync_balance_time` datetime DEFAULT CURRENT_TIMESTAMP COMMENT 'sync balance time',
`create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
`modify_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '修改时间',
PRIMARY KEY (`product_type`, `batch_id`, `data_date`, `source_id`, `user_id`, `broker_id`, `currency_id`),
KEY `idx_b` (`batch_id`),
KEY `idx_product_broker_currency_batch` (`product_type`, `broker_id`, `currency_id`, `batch_id`),
KEY `idx_batch_product_currency_date` (`batch_id`, `product_type`, `currency_id`, `data_date`),
KEY `auto_shard_key_user_id` USING BTREE (`user_id`),
KEY `auto_shard_key_create_time` USING BTREE (`create_time`)
) ENGINE = InnoDB DEFAULT COLLATE = utf8mb4_bin
PARTITION BY KEY(`user_id`)
