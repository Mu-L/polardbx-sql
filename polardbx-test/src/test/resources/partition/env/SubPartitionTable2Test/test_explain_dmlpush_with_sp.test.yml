explain
UPDATE product_success_order so
LEFT
JOIN (
SELECT fs.product_type, fs.user_id, fs.broker_id, fs.source_id, fs.currency_id, fs.available, fs.create_time
FROM product_currency_mapped_fund_snapshot fs
WHERE fs.batch_id     = "TRADING_AUTO_LEND:202511110000:283:779"
AND fs.product_type = 3
AND fs.currency_id  = 283
) fs_filtered
ON so.product_type = fs_filtered.product_type
AND so.user_id      = fs_filtered.user_id
AND so.broker_id    = fs_filtered.broker_id
AND so.source_id    = fs_filtered.source_id
AND so.currency_id  = fs_filtered.currency_id
AND so.create_time = fs_filtered.create_time
SET so.min_amount   = LEAST(so.min_amount, COALESCE(fs_filtered.available, 0)),
so.user_interest = TRUNCATE(LEAST(so.min_amount, COALESCE(fs_filtered.available, 0)) / so.amount * so.interest, 16),
so.sys_interest = so.interest - TRUNCATE((LEAST(so.min_amount, COALESCE(fs_filtered.available, 0)) / so.amount * so.interest), 16)
WHERE so.data_date    = "2025110700"
AND so.currency_id  = 283
AND so.product_type = 3
AND so.status       = 0
;



