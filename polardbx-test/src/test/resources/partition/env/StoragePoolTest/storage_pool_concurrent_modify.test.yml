storageList: [$dn1, $dn2, $dn3, $dn4, $dn5, $dn6, $dn7, $dn8]
testCases:
  ## first pass, create database in old instance.
  - prepareDDls:
      - "alter storage pool sp2 drain node '$dn6'"
    dbNames: ["old_auto_database", "test_db1", "test_db2", "test_db3"]
    rejectDDls:
    expectedSQLs:
      - sql: "select * from information_schema.locality_info"
        result: ""
    cleanupDDls:
      - "use polardbx;"
    checkTriggers:
      - "select count(1) from metadb.ddl_engine where state != 'success';###0"
      - "select count(1) from information_schema.ddl_plan where state != 'success' and state != 'terminated';###0"
    checkActions:
      storagePoolValueCheck:
        - sp1 "$dn3,$dn4" "$dn3"
        - sp2 "$dn5" "$dn5"
        - sp3 "$dn7,$dn8" "$dn7"
        - _recycle "$dn6" ""
        - _default "$dn1,$dn2" $dn1
      datasourceCheck:
        - test_db1 $dn3,$dn4
        - test_db2 $dn5
        - test_db3 $dn3,$dn4,$dn5
        - old_auto_database $dn1,$dn2
        - old_auto_database2 $dn1,$dn2
      localityValueCheck:
        - test_db1 database "storage_pools='sp1',primary_storage_pool='sp1'"
        - test_db2 database "storage_pools='sp2',primary_storage_pool='sp2'"
        - test_db3 database "storage_pools='sp1,sp2',primary_storage_pool='sp1'"
      tableGroupMatchCheck:
        - old_auto_database.t1 $tg1 ""
        - test_db1.t2 $tg2 ""
      # auto generate create table, tablegroup.
      partitionLocalityCheck:
      topologyCheck:
        - old_auto_database.t1 table "$dn1,$dn2"
        - test_db1.t2 table "$dn3,$dn4"
        #  auto generate by locality value check.
        #  auto generate by partition locality check. with each table.
  ## second pass, create storage pool from old instance.
  - prepareDDls:
      - "alter storage pool sp3 drain node '$dn8'"
    dbNames: ["old_auto_database", "test_db1", "test_db2", "test_db3"]
    rejectDDls:
      - ddl: "create storage pool sp1 dn_list='$dn7,$dn8'"
        message: "duplicate storage pool name 'sp1' found!"
    expectedSQLs:
    cleanupDDls:
      - "use polardbx;"
    checkTriggers:
      - "select count(1) from metadb.ddl_engine where state != 'success';###0"
      - "select count(1) from information_schema.ddl_plan where state != 'success' and state != 'terminated';###0"
    checkActions:
      storagePoolValueCheck:
        - sp1 "$dn3,$dn4" "$dn3"
        - sp2 "$dn5" "$dn5"
        - sp3 "$dn7" "$dn7"
        - _recycle "$dn6,$dn8" ""
        - _default "$dn1,$dn2" $dn1
      datasourceCheck:
        - test_db1 $dn3,$dn4
        - test_db2 $dn5
        - test_db3 $dn3,$dn4,$dn5
        - old_auto_database $dn1,$dn2
        - old_auto_database2 $dn1,$dn2
      localityValueCheck:
        - test_db1 database "storage_pools='sp1',primary_storage_pool='sp1'"
        - test_db2 database "storage_pools='sp2',primary_storage_pool='sp2'"
        - test_db3 database "storage_pools='sp1,sp2',primary_storage_pool='sp1'"
      tableGroupMatchCheck:
        - old_auto_database.t1 $tg1 ""
        - test_db1.t2 $tg2 ""
      # auto generate create table, tablegroup.
      partitionLocalityCheck:
      topologyCheck:
        - old_auto_database.t1 table "$dn1,$dn2"
        - test_db1.t2 table "$dn3,$dn4"
        #  auto generate by locality value check.
        #  auto generate by partition locality check. with each table.
  ## third pass, create storage pool from old instance.
  - prepareDDls:
      - "alter storage pool sp1 append node '$dn6,$dn8'"
    dbNames: ["old_auto_database", "test_db1", "test_db2", "test_db3"]
    rejectDDls:
      - ddl: "create storage pool sp1 dn_list='$dn7,$dn8'"
        message: "duplicate storage pool name 'sp1' found!"
    expectedSQLs:
    cleanupDDls:
      - "use polardbx;"
    checkTriggers:
      - "select count(1) from metadb.ddl_engine where state != 'success';###0"
      - "select count(1) from information_schema.ddl_plan where state != 'success' and state != 'terminated';###0"
    checkActions:
      storagePoolValueCheck:
        - sp1 "$dn3,$dn4,$dn6,$dn8" "$dn3"
        - sp2 "$dn5" "$dn5"
        - sp3 "$dn7" "$dn7"
        - _recycle "" ""
        - _default "$dn1,$dn2" $dn1
      datasourceCheck:
        - test_db1 $dn3,$dn4,$dn6,$dn8
        - test_db2 $dn5
        - test_db3 $dn3,$dn4,$dn6,$dn8,$dn5
        - old_auto_database $dn1,$dn2
        - old_auto_database2 $dn1,$dn2
      localityValueCheck:
        - test_db1 database "storage_pools='sp1',primary_storage_pool='sp1'"
        - test_db2 database "storage_pools='sp2',primary_storage_pool='sp2'"
        - test_db3 database "storage_pools='sp1,sp2',primary_storage_pool='sp1'"
      tableGroupMatchCheck:
        - old_auto_database.t1 $tg1 ""
        - test_db1.t2 $tg2 ""
      # auto generate create table, tablegroup.
      partitionLocalityCheck:
      topologyCheck:
        - old_auto_database.t1 table "$dn1,$dn2"
        - test_db1.t2 table "$dn3,$dn4,$dn6,$dn8"
        #  auto generate by locality value check.
        #  auto generate by partition locality check. with each table.
