storageList: [$dn1, $dn2]
dbName: "test_locality_db_physical_config_new"
testCases:
  - prepareDDls:
      - "use polardbx"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ drop database if exists test_locality_db_physical_config_new "
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create database test_locality_db_physical_config_new mode = auto LOCALITY='db_config={\"qkn[1,2]\":[\"set[1,1]\",\"qkn_0[1,2]\"], \"qkn[3,4]\":[\"set[2,2]\",\"qkn_0[3,4]\"]}';"
      - "use test_locality_db_physical_config_new;"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t1(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn1,qkn4';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t2(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn1,qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t3(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn2,qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t4(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn1,qkn4';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t5(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn1,qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t6(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn2,qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table c1(x int  AUTO_INCREMENT primary key, y int) single locality='db_pools=qkn1';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table c2(x int  AUTO_INCREMENT primary key, y int) single locality='db_pools=qkn2';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table c3(x int  AUTO_INCREMENT primary key, y int) single locality='db_pools=qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table c4(x int  AUTO_INCREMENT primary key, y int) single locality='db_pools=qkn4';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table b1(x int  AUTO_INCREMENT primary key, y int) broadcast locality='db_pools=qkn1,qkn2,qkn3';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table b2(x int  AUTO_INCREMENT primary key, y int) broadcast locality='db_pools=qkn[1,2,3]';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table b3(x int  AUTO_INCREMENT primary key, y int) broadcast locality='db_pools=qkn[1-3]';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t14(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn3,qkn4';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t15(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 2 locality='db_pools=qkn[3,4]';"
      - "/*+TDDL:cmd_extra(BLOCK_LOGICAL_DDL=true)*/ create table t16 like t15;"
    rejectDDls:
      - ddl: "create table e1(x int  AUTO_INCREMENT primary key, y int) partition by hash(x) partitions 4 locality = 'db_pools=qkn1,qkn4'"
        message: "partition number is more than valid group name"
      - ddl: "create table e2(x int  AUTO_INCREMENT primary key, y int) broadcast locality='db_pools=qkn1'"
        message: "the locality of broadcast table is not compatible with exist tablegroup"
      - ddl: "create table t201(a int, b int) partition by hash(a) partitions 2 locality = 'db_pools=qknx,qkny'"
        message: "invalid locality specification for db_pools"
      - ddl: "create table t202(a int, b int) replicas locality = 'db_pools=qkx,qky'"
        message: "invalid locality specification for db_pools"
      - ddl: "create database test_locality_db_xxyy2 mode = auto locality = 'db_config={\"qkn1\":[\"set[1,2]\",\"qkn_xxx\"]}'"
        message: "invalid locality specification"
      - ddl: "create database test_locality_db_xxyy3 mode = auto locality = 'db_config={\"qknx[1,2]\":[\"set1\",\"qkn_01\"]}'"
        message: "invalid locality specification"
      - ddl: "create database test_locality_db_xxyy4 mode = auto locality = 'db_config={\"qknx1\":[\"setx\",\"qkn_01\"]}'"
        message: "storageInstLabel not found"
      - ddl: "create database test_locality_db_xxyy5 mode = auto locality = 'db_config={\"qknx1\":[\"set1\",\"qkn_01\"], \"qknx2\":[\"set1\",\"qkn_01\"]}'"
        message: "invalid locality specification"
      - ddl: "create table t203(a int, b int)"
        message: "requires partition definitions"
      - ddl: "create table t204(a int, b int) locality='db_pools=tkn1'"
        message: "requires partition definitions"
    cleanupDDls:
      - "use polardbx;"
      - "use polardbx;"
    checkActions:
      localityValueCheck:
        - t1 table ""
        - t2 table ""
        - t3 table ""
        - t4 table ""
        - t5 table ""
        - t6 table ""
        - t14 table ""
        - t15 table ""
        - c1 table ""
        - c2 table ""
        - c3 table ""
        - c4 table ""
        - b1 table ""
        - b2 table ""
        - b3 table ""
      tableGroupMatchCheck:
        - t1,t4 $tg1 ""
        - t2,t5 $tg2 ""
        - t3,t6 $tg3 ""
        - t14,t15 $tg9 ""
        - c1 $tg4 ""
        - c2 $tg5 ""
        - c3 $tg6 ""
        - c4 $tg7 ""
        - b1,b2,b3 $tg8 "";
      # second pass;
      # auto generate create table, tablegroup.
      topologyCheck:
        - c1.p1 partition $dn1
        - c2.p1 partition $dn1
        - c3.p1 partition $dn2
        - c4.p1 partition $dn2
        - t1.p1 partition $dn1
        - t1.p2 partition $dn2
        - t2.p1 partition $dn1
        - t2.p2 partition $dn2
        - t3.p1 partition $dn1
        - t3.p2 partition $dn2
        - t4.p1 partition $dn1
        - t4.p2 partition $dn2
        - t5.p1 partition $dn1
        - t5.p2 partition $dn2
        - t6.p1 partition $dn1
        - t6.p2 partition $dn2
        - b1.p1 partition $dn1
        - b1.p2 partition $dn1
        - b1.p3 partition $dn2
        - b2.p1 partition $dn1
        - b2.p2 partition $dn1
        - b2.p3 partition $dn2
        - b3.p1 partition $dn1
        - b3.p2 partition $dn1
        - b3.p3 partition $dn2
        - t14.p1 partition $dn2
        - t14.p2 partition $dn2
        - t15.p1 partition $dn2
        - t15.p2 partition $dn2
        #  auto generate by locality value check.
        #  auto generate by partition locality check. with each table.
cleanupDDls:
  - "use polardbx;"
  - "use polardbx;"
#  - "drop database if exists test_locality_db_physical_config_new;"
