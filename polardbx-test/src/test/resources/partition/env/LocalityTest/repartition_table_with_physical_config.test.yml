storageList: [$dn1, $dn2]
dbName: "test_repartition_tb_with_physical_config"
testCases:
  - prepareDDls:
      - "use polardbx"
      - "drop database if exists test_repartition_tb_with_physical_config "
      - "create database test_repartition_tb_with_physical_config mode = auto LOCALITY='dble_config={\"group_config\":{\"qkq1\":[\"$dn1\",\"qkq_01\"],\"qkq2\":[\"$dn1\",\"qkq_02\"],\"qkq3\":[\"$dn2\",\"qkq_03\"],\"qkq4\":[\"$dn2\",\"qkq_04\"]}}';"
      - "use test_repartition_tb_with_physical_config;"
      - "create table t1(x int  AUTO_INCREMENT primary key, y int) partition by key(x,y) partitions 3;"
      - "create table t2(x int  AUTO_INCREMENT primary key, y int) partition by key(x,y) partitions 3;"
      - "create table t3(x int  AUTO_INCREMENT primary key, y int) partition by range(x) (partition p1 values less than(0), partition p2 values less than(1000));"
      - "create table t4(x int  AUTO_INCREMENT primary key, y int) partition by range(x) (partition p1 values less than(0), partition p2 values less than(1000));"
      - "create table t5(x int  AUTO_INCREMENT primary key, y int) partition by list(x) (partition p1 values in(1,2,3), partition p2 values in(4,5,6));"
      - "create table t6(x int  AUTO_INCREMENT primary key, y int) partition by list(x) (partition p1 values in(1,2,3), partition p2 values in(4,5,6));"
    rejectDDls:
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 split partition p1"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t1 split partition p1"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 split into partitions 5 by hot value(10) "
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t1 split into partitions 5 by hot value(10) "
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 merge partitions p1,p2 to p12"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t1 merge partitions p1,p2 to p12"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t3 add partition (partition p3 values less than(2000))"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t3 add partition (partition p3 values less than(2000))"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t3 drop partition p2"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t3 drop partition p2"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t5 modify partition p2 add values(10,20)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t5 modify partition p2 add values(10,20)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t5 modify partition p2 drop values(4,5)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t5 modify partition p2 drop values(4,5)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t5 move partitions p1,p2 to '$dn1'"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t5 move partitions p1,p2 to '$dn1'"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t3 reorganize partition p1,p2 into (partition p3 values less than(1000))"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter tablegroup by table t3 reorganize partition p1,p2 into (partition p3 values less than(1000))"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 modify column x bigint"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 partition by key(y)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 drop primary key, add primary key(y)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
      - ddl: "/*+TDDL:cmd_extra(ENABLE_DBLE_TABLE_REPARTITION=false)*/alter table t1 add global index gsi(x) partition by key(x)"
        message: "The table is in schema use physical db configs, it's not allowed to repartition"
    cleanupDDls:
      - "use polardbx;"
      - "use polardbx;"
cleanupDDls:
  - "use polardbx;"
  - "use polardbx;"
  - "drop database if exists test_repartition_tb_with_physical_config;"
