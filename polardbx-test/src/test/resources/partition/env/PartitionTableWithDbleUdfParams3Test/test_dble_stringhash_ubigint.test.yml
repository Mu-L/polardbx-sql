drop table if exists dblestrhash_tb_ubi;
create table if not exists dblestrhash_tb_ubi(a bigint unsigned)
charset utf8mb4 collate utf8mb4_bin
partition by udf_hash(
`a` with udf_params(
'dble/stringhash',
'{
  "partitionCount":"4", 
  "partitionLength":"1",
  "hashSlice":"0:8"
}'
)
)
partitions 4;
