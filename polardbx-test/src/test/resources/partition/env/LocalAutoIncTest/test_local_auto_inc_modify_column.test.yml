CREATE TABLE `test_local_inc_as_pk` (
`a` int(11) NOT NULL,
`b` int(11) DEFAULT NULL,
`c` int(11) DEFAULT NULL,
PRIMARY KEY (`a`)
) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4
PARTITION BY KEY(`b`)
PARTITIONS 3;

alter table test_local_inc_as_pk modify column a int auto_increment; 
show create table test_local_inc_as_pk;

insert into test_local_inc_as_pk(b,c) values(1,1);
