## ========= unitmurmurhash ========
drop table if exists dble_murhash_0_p4;
create table dble_murhash_0_p4
(a bigint，b bigint)
partition by udf_hash(
    `a` with 
    udf_params (
      'dble/unitmurmurhash',
      '{
          "partitionCount": "4",
          "isDigitCheck" : "1",
          "leftPaddingChar" : "NO",
          "shardingValueMaxLength" : "15"
      }'
  )
  )
  partitions 4 ;

  insert into dble_murhash_0_p4 values (100,100),(200,200);
  select * from dble_murhash_0_p4 where a=100;
  drop table if exists dble_murhash_0_p4;





