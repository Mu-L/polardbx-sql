## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG
## LOCALITY_DN_LIST: $dn1, $dn2 ;

## ======== hash =========
  create table dblehash_bi_t1
  (a bigint，b bigint)
  partition by udf_hash (
  `a` with udf_params (
  'dble/hash',
    '{
    "partitionCount" : "4,4",
    "partitionLength" : "128,256"
    }'
    )
  )
  partitions 8;
  

  
## ======== stringhash =========
  create table dblestrhash_bi_t1
  (a bigint，b bigint)
  partition by udf_hash (
    `b` with udf_params (
    'dble/stringhash',
    '{
          "partitionCount" : "4,4",
          "partitionLength" : "128,256",
          "hashSlice" : "0:8"
     }'
  )
  )
  partitions 8;
  
  create table dblestrhash_i_t1
  (a bigint，b int)
  partition by udf_hash (
  `b` with udf_params (
  'dble/stringhash',
  '{
          "partitionCount" : "4,4",
          "partitionLength" : "128,256",
          "hashSlice" : "0:8"
   }'
  )
  )
  partitions 8;  
  
  insert into dblestrhash_i_t1(a,b) values (1,1);
  
