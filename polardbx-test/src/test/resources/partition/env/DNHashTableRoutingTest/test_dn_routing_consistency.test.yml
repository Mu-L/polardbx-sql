## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS

# Set SQL mode to allow invalid data insertion
set sql_mode='';

# Create a 3-partition table for testing
create table t2
(
  id bigint,
  name varchar(64),
  age int,
  salary decimal(10,2),
  create_time datetime,
  is_active boolean
)
partition by key(id)
partitions 3;

# Insert test data covering various data types and edge cases
insert into t2 values (0, 'zero', 25, 50000.00, '2023-01-01 00:00:00', true);
insert into t2 values (1, 'one', 30, 60000.50, '2023-01-01 00:00:01', false);
insert into t2 values (-1, 'negative one', 35, 70000.75, '2023-01-01 00:00:02', true);
insert into t2 values (9223372036854775807, 'max bigint', 40, 80000.00, '2023-01-01 00:00:03', false);
insert into t2 values (-9223372036854775808, 'min bigint', 45, 90000.25, '2023-01-01 00:00:04', true);
insert into t2 values (null, 'null id', 50, 100000.50, '2023-01-01 00:00:05', false);
insert into t2 values (123456789, 'positive number', 55, 110000.75, '2023-01-01 00:00:06', true);
insert into t2 values (-123456789, 'negative number', 60, 120000.00, '2023-01-01 00:00:07', false);
insert into t2 values (2147483647, 'max int', 65, 130000.25, '2023-01-01 00:00:08', true);
insert into t2 values (-2147483648, 'min int', 70, 140000.50, '2023-01-01 00:00:09', false);
insert into t2 values (0, 'zero duplicate', 75, 150000.75, '2023-01-01 00:00:10', true);
insert into t2 values (1, 'one duplicate', 80, 160000.00, '2023-01-01 00:00:11', false);

# Insert invalid data that would normally be rejected
# Truncated string values
insert into t2 values (2, 'This is a very long string that should be truncated to fit in the varchar(64) field', 100, 200000.00, '2023-01-01 00:00:12', true);

# Test part_hash function on CN
select id, part_hash('', 't2', id) as hash_value from t2 order by id;

# Test polardbx_hasher function on CN with logical table name
/*+TDDL:scan()*/select id, polardbx_hasher(id) from t2 order by id;

# Create a string partition table for testing charset/collation
create table t2_string
(
  id varchar(64),
  name varchar(64),
  age int,
  salary decimal(10,2),
  create_time datetime,
  is_active boolean
)
partition by key(id)
partitions 3;

# Insert test data for string partition key
insert into t2_string values ('', 'empty string', 25, 50000.00, '2023-01-01 00:00:00', true);
insert into t2_string values ('ABC', 'uppercase', 30, 60000.50, '2023-01-01 00:00:01', false);
insert into t2_string values ('abc', 'lowercase', 35, 70000.75, '2023-01-01 00:00:02', true);
insert into t2_string values ('123', 'numbers', 40, 80000.00, '2023-01-01 00:00:03', false);
insert into t2_string values ('中文测试', 'chinese string', 45, 90000.25, '2023-01-01 00:00:04', true);

# Insert invalid string data
insert into t2_string values ('This is a very long string that should be truncated to fit in the varchar(64) field', 'truncated string', 50, 100000.00, '2023-01-01 00:00:05', false);

# Test part_hash function on CN for string table
select id, part_hash('', 't2_string', id) as hash_value from t2_string order by id;

# Test polardbx_hasher function on CN with logical table name for string table
/*+TDDL:scan()*/select id, polardbx_hasher(id) from t2_string order by id;

# Create tables with different charset/collation settings
# UTF8MB4 charset with utf8mb4_general_ci collation
create table t2_string_utf8mb4_general
(
  id varchar(64) charset utf8mb4 collate utf8mb4_general_ci,
  name varchar(64),
  age int,
  salary decimal(10,2),
  create_time datetime,
  is_active boolean
)
partition by key(id)
partitions 3;

# Insert test data for UTF8MB4 general collation
insert into t2_string_utf8mb4_general values ('', 'empty string', 25, 50000.00, '2023-01-01 00:00:00', true);
