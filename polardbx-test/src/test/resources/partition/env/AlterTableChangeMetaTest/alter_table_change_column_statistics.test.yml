drop database if exists test_statistics2;

create database test_statistics2 mode = auto;
use test_statistics2;

drop table if exists t_statistics2;

create table t_statistics2(
id int,
name varchar(60),
NAME2 varchar(60),
Name3 varchar(60),
primary key(id)
) partition by key(id) partitions 4;

alter table t_statistics2 add index idx_name(name);
alter table t_statistics2 add index idx_name2(name, name3);
alter table t_statistics2 add index idx_name3(nAme, name2(2), name3);
alter table t_statistics2 add index idx_name4(name(5));
alter table t_statistics2 add index idx_name5(naMe(4), name2(10));
alter table t_statistics2 add index idx_name6(name(10), namE2(10), name3(10));

show create table t_statistics2;

SELECT * FROM INFORMATION_SCHEMA.STATISTICS  WHERE TABLE_SCHEMA = 'test_statistics2' and table_name = "t_statistics2"
order by index_name, seq_in_index;

alter table t_statistics2 change column name NEW_name varchar(5), change column name2 new_NAME2 text, change column name3 new_name3 bigint;

show create table t_statistics2;

SELECT * FROM INFORMATION_SCHEMA.STATISTICS  WHERE TABLE_SCHEMA = 'test_statistics2' and table_name = "t_statistics2"
order by index_name, seq_in_index;