drop database if exists test_statistics;

create database test_statistics mode = auto;
use test_statistics;

drop table if exists t_statistics5;

create table t_statistics5 (
    id int not null auto_increment,
    resources_id1 varchar(30) not null default '0',
    resources_id varchar(30) not null default '',
    primary key (id),
    key idx_rid1 (resources_id1(20)),
    key idx_rid (resources_id(20))
) broadcast;

show create table t_statistics5;

SELECT * FROM INFORMATION_SCHEMA.STATISTICS  WHERE TABLE_SCHEMA = 'test_statistics' and table_name = "t_statistics5"
order by index_name, seq_in_index;
  
alter table t_statistics5
    change column resources_id extends1 varchar(30) not null default '' ,
    change column resources_id1 resources_id varchar(10) not null default 0,
    rename index idx_rid to idx_ext,
    rename index idx_rid1 to idx_rid,
    add index idx_extend(extends1(5), resources_id(5));

show create table t_statistics5;

SELECT * FROM INFORMATION_SCHEMA.STATISTICS  WHERE TABLE_SCHEMA = 'test_statistics' and table_name = "t_statistics5"
order by index_name, seq_in_index;