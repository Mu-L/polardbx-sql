## DISABLE_FAST_SQL_PARSER

drop database if exists mypocbrodb;
create database if not exists mypocbrodb mode = auto locality = "db_config=mypocbrodb_db00:polardbx-storage-0-master,mypocbrodb_db01:polardbx-storage-1-master";
use mypocbrodb;

create table mybro_t1(
c1 bigint not null,
c2 bigint not null
)
broadcast
locality="db_pools=mypocbrodb_db00";
show create table mybro_t1;
  
