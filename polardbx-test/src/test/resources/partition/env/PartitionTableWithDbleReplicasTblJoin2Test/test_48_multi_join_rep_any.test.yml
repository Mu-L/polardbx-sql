  ##===== mixJoinAndSubQuery1-0: all rep tbl with common group keys =====  
explain select 
t1.id,
(select t2.id from rep_t2_g0g1g2 t2 where t2.id=t1.id) as t2_id,
(select t3.id from bro_t1 t3 where t3.id=t1.id) as t3_id,
(select t4.id from sig_t4_g2 t4 where t4.id=t1.id) as t4_id
from
rep_t1_g0g1g2 t1
join sig_t4_g2 t2 on t1.id = t2.id
join sig_t4_g2 t3 on t1.id = t3.id
where
t1.id in (select t3_2.id from sig_t4_g2 t3_2)
and
t1.id in (select t4_2.id from rep_t4_g2g3 t4_2)
order by t1.id
;
  
select
t1.id,
(select t2.id from rep_t2_g0g1g2 t2 where t2.id=t1.id) as t2_id,
(select t3.id from bro_t1 t3 where t3.id=t1.id) as t3_id,
(select t4.id from sig_t4_g2 t4 where t4.id=t1.id) as t4_id
from
rep_t1_g0g1g2 t1
join sig_t4_g2 t2 on t1.id = t2.id
join sig_t4_g2 t3 on t1.id = t3.id
where
t1.id in (select t3_2.id from sig_t4_g2 t3_2)
and
t1.id in (select t4_2.id from rep_t4_g2g3 t4_2)
order by t1.id
;

  ## union non-pushdown
explain select pt1.id as pid from 
part_t1_g0g1g2 pt1 
join rep_t1_g0g1g2 rt1 on pt1.id=rt1.id
join part_t2_g0g1g2 pt2 on pt2.id=rt1.id
join rep_t2_g0g1g2 rt2 on rt2.id=rt1.id 
where pt1.id=3 
union all (
select bt1.id as pid from
rep_t1_g0g1g2 rt1
join sig_t1_g1 st1 on st1.id=rt1.id
join rep_t8_g1g3g4 rt8 on rt8.id=st1.id
join bro_t1 bt1 on bt1.id=rt1.id
)
union all (
select pt1.id as pid from
sig_t4_g2 pt1
where
pt1.id in (
select rt3.id from
rep_t3_g1g2 rt3
join bro_t2 bt2 on bt2.id=rt3.id
)
)
order by pid
;
  
select pt1.id as pid from
part_t1_g0g1g2 pt1
join rep_t1_g0g1g2 rt1 on pt1.id=rt1.id
join part_t2_g0g1g2 pt2 on pt2.id=rt1.id
join rep_t2_g0g1g2 rt2 on rt2.id=rt1.id
where pt1.id=3
union all (
select bt1.id as pid from
rep_t1_g0g1g2 rt1
join sig_t1_g1 st1 on st1.id=rt1.id
join rep_t8_g1g3g4 rt8 on rt8.id=st1.id
join bro_t1 bt1 on bt1.id=rt1.id
)
union all (
select pt1.id as pid from
sig_t4_g2 pt1
where
pt1.id in (
select rt3.id from
rep_t3_g1g2 rt3
join bro_t2 bt2 on bt2.id=rt3.id
)
)
order by pid
;
  
