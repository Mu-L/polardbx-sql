  ## outer-join/cross-join non-pushdown
explain select t1.id from rep_t8_g1g3g4 t1 
left join part_t3_g3g4 t2 on t1.id = t2.id order by t1.id;

  ## outer-join/cross-join pushdown with single_group sharding
explain select rt1.id as rt1_id,rt2.id as rt2_id
from rep_t1_g0g1g2 rt1
left join rep_t1_g0g1g2 rt2  on rt2.id=rt1.id
left join part_t1_g0g1g2 pt1 on pt1.id = rt2.id and pt1.id=1 
order by rt1_id;
explain select rt1.id as rt1_id,rt2.id as rt2_id
from rep_t1_g0g1g2 rt1
left join part_t1_g0g1g2 pt1 on pt1.id = rt1.id and pt1.id=1
left join rep_t1_g0g1g2 rt2 on rt2.id=rt1.id
order by rt1_id;
explain select rt1.id as rt1_id,rt2.id as rt2_id
from rep_t1_g0g1g2 rt1
left join part_t1_g0g1g2 pt1 on pt1.id = rt1.id and pt1.id=1
right join rep_t1_g0g1g2 rt2 on rt2.id=rt1.id
order by rt1_id;
explain select rt1.id as rt1_id,rt2.id as rt2_id
from rep_t1_g0g1g2 rt1
left join part_t1_g0g1g2 pt1 on pt1.id = rt1.id and pt1.id in (1,3)
right join rep_t1_g0g1g2 rt2 on rt2.id=rt1.id
order by rt1_id;
  
  ## outer-join/cross-join non-pushdown with multi-group sharding
explain select rt1.id as rt1_id
from rep_t1_g0g1g2 rt1
left join part_t1_g0g1g2 pt1 on pt1.id = rt1.id and pt1.id in (1,3)
order by rt1_id;
  ## join non-pushdown because of un-full-cover group key
explain select rt1.id from 
rep_t3_g1g2 rt1 
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id
join part_t2_g0g1g2 pt2 on pt2.id = pt1.id order by rt1.id;
  ## join non-pushdown because of un-full-cover group key
explain select rt1.id from
rep_t3_g1g2 rt1
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id and pt1.id in (1,3)
join part_t2_g0g1g2 pt2 on pt2.id = pt1.id order by rt1.id;
  
  ## filterSubquery pushdown 
explain select pt1.id from part_t1_g0g1g2 pt1 
where pt1.id in (select rt1.id from rep_t1_g0g1g2 rt1) 
and pt1.id in (select rt2.id from rep_t2_g0g1g2 rt2)
order by pt1.id;
  ## filterSubquery pushdown 
explain select pt1.id from part_t1_g0g1g2 pt1
where exists (select rt1.id from rep_t1_g0g1g2 rt1 where pt1.id=rt1.id)
and exists (select rt2.id from rep_t2_g0g1g2 rt2 where pt1.id=rt2.id)
order by pt1.id;
  ## filterSubquery pushdown 
explain select pt1.id from part_t1_g0g1g2 pt1
where exists (select rt1.id from rep_t1_g0g1g2 rt1 where pt1.id=rt1.id)
and exists (select rt2.id from rep_t2_g0g1g2 rt2 where pt1.id=rt2.id)
order by pt1.id;
  ## filterSubquery non-pushdown because of no correlated join column
explain select pt1.id from part_t1_g0g1g2 pt1
where exists (select rt1.id from bro_tbl1 rt1)
and exists (select rt2.id from bro_tbl2 rt2)
order by pt1.id;;
  ## filterSubquery non-pushdown because of un-full-cover group key
explain select pt1.id from part_t1_g0g1g2 pt1
where exists (select rt1.id from rep_t3_g1g2 rt1 where pt1.id=rt1.id)
and exists (select rt2.id from rep_t2_g0g1g2 rt2 where pt1.id=rt2.id)
order by pt1.id;

  ## columnSubquery pushdown 
explain select pt1.id,
(select rt1.id from rep_t1_g0g1g2 rt1 where rt1.id=pt1.id) as rt1_id,
(select rt2.id from rep_t2_g0g1g2 rt2 where rt2.id=pt1.id) as rt2_id
from part_t1_g0g1g2 pt1 
order by pt1.id;
  ## columnSubquery pushdown 
explain select pt3.id,
(select rt7.id from rep_t7_g0g3g4 rt7 where rt7.id=pt3.id) as rt7_id,
(select rt5.id from rep_t5_g3g4 rt5 where rt5.id=pt3.id) as rt5_id
from part_t3_g3g4 pt3
order by pt3.id;
  ## columnSubquery non-pushdown because of no correlated join column
explain select pt3.id,
(select rt7.id from rep_t7_g0g3g4 rt7) as rt7_id,
(select rt5.id from rep_t5_g3g4 rt5) as rt5_id
from part_t3_g3g4 pt3
order by pt3.id;
  ## columnSubquery non-pushdown because of un-full-cover group key
explain select pt3.id,
(select rt7.id from rep_t7_g0g3g4 rt7 where rt7.id=pt3.id) as rt7_id,
(select rt4.id from rep_t4_g2g3 rt4 where rt4.id=pt3.id) as rt4_id
from part_t3_g3g4 pt3
order by pt3.id;

  ## union non-pushdown
explain select id from part_t1_g0g1g2 where id=3
union all (select rt1.id from rep_t1_g0g1g2 rt1)
union all (select rt2.id from rep_t2_g0g1g2 rt2)
order by id;
  
