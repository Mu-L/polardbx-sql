  ## join pushdown1-0: all rep tbl cover all groupKey of all part tbl
explain select rt1.id 
from 
rep_t1_g0g1g2 rt1 
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id 
join part_t2_g0g1g2 pt2 on pt2.id = rt1.id
order by rt1.id;
explain select rt1.id
from
rep_t1_g0g1g2 rt1
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id
join part_t2_g0g1g2 pt2 on pt2.id = rt1.id
join rep_t2_g0g1g2 rt2 on rt2.id = rt1.id
order by rt1.id;

explain select rt1.id
from
rep_t1_g0g1g2 rt1
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id 
join part_t2_g0g1g2 pt2 on pt2.id = rt1.id
join rep_t2_g0g1g2 rt2 on rt2.id = rt1.id
order by rt1.id;
select rt1.id
from
rep_t1_g0g1g2 rt1
join part_t1_g0g1g2 pt1 on pt1.id = rt1.id
join part_t2_g0g1g2 pt2 on pt2.id = rt1.id
join rep_t2_g0g1g2 rt2 on rt2.id = rt1.id
order by rt1.id;

explain select rt7.id
from
rep_t7_g0g3g4 rt7
join part_t3_g3g4 pt3 on pt3.id = rt7.id
join part_t4_g3g4 pt4 on pt4.id = rt7.id
join rep_t8_g1g3g4 rt8 on rt8.id = rt7.id
order by rt7.id;
select rt7.id
from
rep_t7_g0g3g4 rt7
join part_t3_g3g4 pt3 on pt3.id = rt7.id
join part_t4_g3g4 pt4 on pt4.id = rt7.id
join rep_t8_g1g3g4 rt8 on rt8.id = rt7.id
order by rt7.id;
  
explain select rt7.id
from
rep_t7_g0g3g4 rt7
join part_t3_g3g4 pt3 on pt3.id = rt7.id and rt7.id=1
join part_t4_g3g4 pt4 on pt4.id = rt7.id
join rep_t8_g1g3g4 rt8 on rt8.id = rt7.id
order by rt7.id;
select rt7.id
from
rep_t7_g0g3g4 rt7
join part_t3_g3g4 pt3 on pt3.id = rt7.id and rt7.id=1
join part_t4_g3g4 pt4 on pt4.id = rt7.id
join rep_t8_g1g3g4 rt8 on rt8.id = rt7.id
order by rt7.id;

