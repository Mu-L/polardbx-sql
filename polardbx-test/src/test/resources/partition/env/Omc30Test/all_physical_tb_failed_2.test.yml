dbName: "test_omc30_all_failed2"
tableName: "t1"
prepareSqlList:
  - "use polardbx"
  - "drop database if exists test_omc30_all_failed2"
  - "create database test_omc30_all_failed2 mode = auto"
  - "use test_omc30_all_failed2;"
  - "set sql_mode = 'STRICT_TRANS_TABLES'"
  - "create table t1(a int AUTO_INCREMENT primary key, b bigint, c varchar(100), d datetime) partition by key(a) partitions 3;"
  - "insert into t1(b, c, d) values(1, 'aaaaabbbbcccccdddeee', now())"
  - "insert into t1(b, c, d) values(2, null, now())"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
rejectDDLs:
  - ddl: "alter table t1 modify column c int, algorithm=omc"
    message: "Incorrect integer value"
  - ddl: "alter table t1 modify column c varchar(5), algorithm=omc"
    message: "Data too long for column"
  - ddl: "alter table t1 add unique key idx(b), algorithm=omc"
    message: "Duplicate entry"
  - ddl: "alter table t1 modify column b int auto_increment, algorithm=omc"
    message: "Incorrect table definition"
  - ddl: "alter table t1 modify column c int, add index idx_b(b), algorithm=omc"
    message: "Incorrect integer value"
  - ddl: "alter table t1 modify column c json, algorithm=omc"
    message: "Invalid JSON text"
  - ddl: "alter table t1 modify column d varchar(10), algorithm=omc"
    message: "Data too long for column"
  - ddl: "alter table t1 modify column c datetime, algorithm=omc"
    message: "Incorrect datetime value"
  - ddl: "alter table t1 add unique key idx_c_d(c, d), algorithm=omc"
    message: "Duplicate entry"
  - ddl: "alter table t1 drop primary key, algorithm=omc"
    message: "Drop primary key is not supported"
  - ddl: "alter table t1 modify column c varchar(100) not null, algorithm=omc"
    message: "cannot be null"
cleanupDDLs:
  - "drop database test_omc30_all_failed2"