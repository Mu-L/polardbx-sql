dbName: "test_omc30_part_failed"
tableName: "t1"
prepareSqlList:
  - "use polardbx"
  - "drop database if exists test_omc30_part_failed"
  - "create database test_omc30_part_failed mode = auto"
  - "use test_omc30_part_failed;"
  - "set sql_mode = 'STRICT_TRANS_TABLES'"
  - "create table t1(a int AUTO_INCREMENT primary key, b bigint default 3, c varchar(10), d datetime, index idx_c(c)) partition by key(b) partitions 3;"
  - "insert into t1(b, c, d) values(1, 'a', now())"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
rejectDDLs:
#  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true)*/alter table t1 engine=innodb, algorithm=omc"
#    message: ""
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 add column e int, algorithm=omc"
    message: "online modify column checker found error"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 add index idx(b), algorithm=omc"
    message: "online modify column checker found error"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 rename index idx_c to local_idx_c, algorithm=omc"
    message: "online modify column checker found error"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 alter column b set default 33, algorithm=omc"
    message: "online modify column checker found error"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 alter column b drop default, algorithm=omc"
    message: "online modify column checker found error"
  - ddl: "alter table t1 add unique index idx(b), algorithm=omc"
    message: "Duplicate entry"
cleanupDDLs:
  - "drop database test_omc30_part_failed"