dbName: "test_omc30_all_failed"
tableName: "t1"
prepareSqlList:
  - "use polardbx"
  - "drop database if exists test_omc30_all_failed"
  - "create database test_omc30_all_failed mode = auto"
  - "use test_omc30_all_failed;"
  - "create table t1(a int AUTO_INCREMENT primary key, b bigint, c varchar(10), d datetime) partition by key(a) partitions 3;"
