dbName: "test_omc30_all_success_but_rollback"
tableName: "t1"
prepareSqlList:
  - "use polardbx"
  - "drop database if exists test_omc30_all_success_but_rollback"
  - "create database test_omc30_all_success_but_rollback mode = auto"
  - "use test_omc30_all_success_but_rollback;"
  - "create table t1(a int AUTO_INCREMENT primary key, b bigint default 3, c varchar(10), d datetime, index idx_c(c)) partition by key(a) partitions 3;"
  - "insert into t1(b, c, d) values(1, 'a', now())"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
rejectDDLs:
  #  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 engine=innodb, algorithm=omc"
  #    message: ""
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 add column e int, algorithm=omc"
    message: "FP_OMC_AFTER_EXECUTE_TASK_FAILED"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 add index idx(b), algorithm=omc"
    message: "FP_OMC_AFTER_EXECUTE_TASK_FAILED"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 rename index idx_c to local_idx_c, algorithm=omc"
    message: "FP_OMC_AFTER_EXECUTE_TASK_FAILED"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 alter column b set default 33, algorithm=omc"
    message: "FP_OMC_AFTER_EXECUTE_TASK_FAILED"
  - ddl: "/*+TDDL:cmd_extra(FP_OMC_AFTER_EXECUTE_TASK_FAILED=true)*/alter table t1 alter column b drop default, algorithm=omc"
    message: "FP_OMC_AFTER_EXECUTE_TASK_FAILED"
cleanupDDLs:
  - "drop database test_omc30_all_success_but_rollback"