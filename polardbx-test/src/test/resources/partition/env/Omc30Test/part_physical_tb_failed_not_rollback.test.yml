      message: "online modify column checker found error"
    - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 drop column c, algorithm=omc"
      message: "online modify column checker found error"
    - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 change column c e varchar(10), algorithm=omc"
      message: "online modify column checker found error"
    - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 drop index idx_c, algorithm=omc"
      message: "online modify column checker found error"
    - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 modify column c varchar(10) default 'abc', algorithm=omc"
      message: "online modify column checker found error"
    - ddl: "/*+TDDL:cmd_extra(FP_OMC_SKIP_BACK_FILL=true,FASTCHECKER_BATCH_SIZE=100)*/alter table t1 ROW_FORMAT=COMPRESSED, algorithm=omc"
      message: "online modify column checker found error"
