      message: "online modify column checker found error"
    - ddl: "alter table t1 modify column c varchar(5), algorithm=omc"
      message: "Data truncated for column 'c' at row 1"
    - ddl: "alter table t1 modify column c varchar(10) unique, algorithm=omc"
      message: "Duplicate entry"
cleanupDDLs:
