dbName: "test_omc30_part_failed_can_not_rollback"
tableName: "t1"
prepareSqlList:
  - "use polardbx"
  - "drop database if exists test_omc30_part_failed_can_not_rollback"
  - "create database test_omc30_part_failed_can_not_rollback mode = auto"
  - "use test_omc30_part_failed_can_not_rollback;"
  - "set sql_mode = 'STRICT_TRANS_TABLES'"
  - "create table t1(a int AUTO_INCREMENT primary key, b bigint default 3, c varchar(10), d datetime, index idx_c(c)) partition by key(b) partitions 3;"
  - "insert into t1(b, c, d) values(1, 'aaaabbcc', now())"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
  - "insert into t1(b, c, d) select b, c, d from t1"
rejectDDLs:
