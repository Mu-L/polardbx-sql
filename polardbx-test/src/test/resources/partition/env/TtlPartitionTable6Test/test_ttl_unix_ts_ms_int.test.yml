drop table if exists r_unix_ts_ms;
create table r_unix_ts_ms
(
a bigint ,
b datetime,
c varchar(32),
primary key(a)
)
partition by range(a)
(
partition p20250501 values less than(1746028800000),
partition p20250502 values less than(1746115200000),
partition p20250503 values less than(1746201600000),
partition p20250504 values less than(1746288000000),
partition p20250505 values less than(1746374400000)
);

alter table r_unix_ts_ms modify ttl
set
ttl_enable='off',
ttl_cleanup='on',
ttl_expr = `a` expire after 1 day timezone '+08:00',
ttl_part_interval=interval(1,day),
ttl_col_encoder=unix_timestamp(?) * 1000,
ttl_col_decoder=from_unixtime(? / 1000),
archive_type='partition',
archive_table_pre_allocate = 2,
archive_table_post_allocate = 2;

