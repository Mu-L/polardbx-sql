show create table r_yymmdd;

set TTL_DEBUG_CURRENT_DATETIME='2025-06-07 00:00:00';
alter table r_yymmdd cleanup expired data;
show create table r_yymmdd;

create table r_yymmdd_arc like r_yymmdd engine='Columnar' archive_mode='ttl';
set TTL_DEBUG_CURRENT_DATETIME='2025-06-06 12:00:00';
alter table r_yymmdd cleanup expired data;
show create table r_yymmdd;

