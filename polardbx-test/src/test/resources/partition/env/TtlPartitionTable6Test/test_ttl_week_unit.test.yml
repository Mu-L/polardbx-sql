drop table if exists ttl_7days_test;
create table ttl_7days_test
(
a int ,
b datetime,
c varchar(32),
primary key(a)
)
partition by range columns(b)
(
partition p20250601 values less than('2025-06-01'),
partition p20250602 values less than('2025-06-02'),
partition p20250603 values less than('2025-06-03'),
partition p20250604 values less than('2025-06-04'),
partition p20250605 values less than('2025-06-05')
);

set TTL_DEBUG_CURRENT_DATETIME='2024-06-04 11:00:00';
alter table ttl_7days_test modify ttl
set
ttl_enable='off',
ttl_cleanup='on',
ttl_expr=`b` expire after 2 day timezone '+08:00',
ttl_part_interval=interval(7,day),
archive_type='partition',
archive_table_pre_allocate = 2,
archive_table_post_allocate = 2;
show create table ttl_7days_test;

set TTL_DEBUG_CURRENT_DATETIME='2025-06-04 11:00:00';
alter table ttl_7days_test cleanup expired data;
show create table ttl_7days_test;

set TTL_DEBUG_CURRENT_DATETIME='2025-06-05 11:00:00';
