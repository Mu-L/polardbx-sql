dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
id int auto_increment,
  i int not null,
  ts0 timestamp default current_timestamp,
  ts1 timestamp default current_timestamp,
  dt2 datetime,
  t   datetime,
  updated tinyint unsigned default 0,
  primary key(id),
  key i_idx(i)
) auto_increment=1;"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  insert into gh_ost_test values (null, 7, null, now(), now(), '2010-10-20 10:20:30', 0);
  insert into gh_ost_test values (null, 11, null, now(), now(), '2010-10-20 10:20:30', 0);
  update gh_ost_test set ts2=now() + interval 1 minute, updated = 1 where i = 11 order by id desc limit 1;
  insert into gh_ost_test values (null, 13, null, now(), now(), '2010-10-20 10:20:30', 0);
  update gh_ost_test set ts2=now() + interval 1 minute, updated = 1 where i = 13 order by id desc limit 1;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test change column t t datetime not null"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"