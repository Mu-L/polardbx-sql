dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
id int auto_increment,
  i int not null,
  e enum('red', 'green', 'blue', 'orange') null default null collate 'utf8_bin',
  primary key(id)
) auto_increment=1;"
  - "insert into gh_ost_test values (null, 7, 'red');"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  insert into gh_ost_test values (null, 11, 'red');
  insert into gh_ost_test values (null, 13, 'green');
  insert into gh_ost_test values (null, 17, 'blue');
  set @last_insert_id := last_insert_id();
  update gh_ost_test set e='orange' where id = @last_insert_id;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test change e e varchar(32) not null default ''"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"