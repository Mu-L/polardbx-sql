dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
id int auto_increment,
  c1 int not null,
  c2 int not null,
  c3 int not null,
  primary key (id)
) auto_increment=1;"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  insert ignore into gh_ost_test values (1, 11, 23, 97);
  insert ignore into gh_ost_test values (2, 13, 27, 61);
  insert into gh_ost_test values (null, 17, 31, 53);
  set @last_insert_id := last_insert_id();
  update gh_ost_test set c1=c1+@last_insert_id, c2=c2+@last_insert_id, c3=c3+@last_insert_id where id=@last_insert_id order by id desc limit 1;
  delete from gh_ost_test where id=1;
  delete from gh_ost_test where c1=13;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test change column c2 c2a int not null, change column c3 c3 int not null after id"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"