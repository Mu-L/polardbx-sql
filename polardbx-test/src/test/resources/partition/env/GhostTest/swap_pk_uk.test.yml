dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
  id bigint,
  i int not null,
  ts timestamp(6),
  primary key(id),
  unique key its_uidx(i, ts)
) ;"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
  on schedule every 1 second
  starts current_timestamp
  ends current_timestamp + interval 60 second
  on completion not preserve
  enable
  do
begin
  insert into gh_ost_test values ((unix_timestamp() << 2) + 0, 11, now(6));
  insert into gh_ost_test values ((unix_timestamp() << 2) + 1, 13, now(6));
  insert into gh_ost_test values ((unix_timestamp() << 2) + 2, 17, now(6));
  insert into gh_ost_test values ((unix_timestamp() << 2) + 3, 19, now(6));
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test drop primary key, drop key its_uidx, add primary key (i, ts), add unique key id_uidx(id)"
expectFailure: "Alter table drop primary key is not supported"
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"