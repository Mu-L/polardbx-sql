dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
f float,
  i int not null,
  ts timestamp default current_timestamp,
  dt datetime,
  key i_idx(i),
  unique key f_uidx(f)
) auto_increment=1;"
prepareEvents:
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test add column v varchar(32)"
expectFailure: "Do not support online modify column when table has no primary key"
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"