dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "drop table if exists gh_ost_test_fk_parent;"
  - "create table gh_ost_test_fk_parent (
  id int auto_increment,
  ts timestamp,
  primary key(id)
  );"
  - "create table gh_ost_test (
id int auto_increment,
  i int not null,
  parent_id int not null,
  primary key(id),
  constraint test_fk foreign key (parent_id) references gh_ost_test_fk_parent (id) on delete no action
) auto_increment=1;"
  - "insert into gh_ost_test_fk_parent (id) values (1),(2),(3);"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  insert into gh_ost_test values (null, 11, 1);
  insert into gh_ost_test values (null, 13, 2);
  insert into gh_ost_test values (null, 17, 3);
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test engine=innodb"
expectFailure: "Do not support online modify column when table has foreign key"
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"