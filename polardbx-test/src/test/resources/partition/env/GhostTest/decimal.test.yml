dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
id int auto_increment,
  dec0 decimal(65,30) unsigned NOT NULL DEFAULT '0.000000000000000000000000000000',
  dec1 decimal(65,30) unsigned NOT NULL DEFAULT '1.000000000000000000000000000000',
  primary key(id)
) auto_increment=1;"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  insert into gh_ost_test values (null, 0.0, 0.0);
  insert into gh_ost_test values (null, 2.0, 4.0);
  insert into gh_ost_test values (null, 99999999999999999999999999999999999.000, 6.0);
  update gh_ost_test set dec1=4.5 where dec2=4.0 order by id desc limit 1;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test engine=innodb"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"