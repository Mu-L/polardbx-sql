dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: ""
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
id int auto_increment,
  create_time timestamp NULL DEFAULT '0000-00-00 00:00:00',
  update_time timestamp NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
  counter int(10) unsigned DEFAULT NULL,
  primary key(id)
) auto_increment=1;"
  - "insert into gh_ost_test values (1, '0000-00-00 00:00:00', now(), 0);"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
on schedule every 1 second
starts current_timestamp
ends current_timestamp + interval 60 second
on completion not preserve
enable
do
begin
  set session time_zone='+00:00';
  update gh_ost_test set counter = counter + 1 where id = 1;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test add column name varchar(1)"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"