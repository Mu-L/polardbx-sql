dbName: "test_ghost_ddl"
tableName: "gh_ost_test"
sqlMode: "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE"
prepareDb:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl "
  - "create database test_ghost_ddl"
  - "use test_ghost_ddl;"
  - "set names utf8mb4"
prepareTables:
  - "drop table if exists gh_ost_test;"
  - "create table gh_ost_test (
  id int(11) NOT NULL AUTO_INCREMENT,
  name varchar(512) DEFAULT NULL,
  v varchar(255) DEFAULT NULL COMMENT '添加普通列测试',
  PRIMARY KEY (id)
) ENGINE=InnoDB AUTO_INCREMENT=1 DEFAULT CHARSET=gbk;"
  - "insert into gh_ost_test values (null, 'gbk-test-initial', '添加普通列测试-添加普通列测试');"
  - "insert into gh_ost_test values (null, 'gbk-test-initial', '添加普通列测试-添加普通列测试');"
prepareEvents:
  - "drop event if exists gh_ost_test;"
  - "create event gh_ost_test
  on schedule every 1 second
  starts current_timestamp
  ends current_timestamp + interval 60 second
  on completion not preserve
  enable
  do
begin
  insert into gh_ost_test (name) values ('gbk-test-default');
  insert into gh_ost_test values (null, 'gbk-test', '添加普通列测试-添加普通列测试');
  update gh_ost_test set v='添加普通列测试' where v='添加普通列测试-添加普通列测试' order by id desc limit 1;
end"
alterTableCommand:
  - "alter table test_ghost_ddl.gh_ost_test engine=innodb"
expectFailure:
expectTableStructure:
cleanupDDLs:
  - "use information_schema"
  - "drop database if exists test_ghost_ddl;"