## ======== hash =========
drop table if exists cobar_hash_0_p8;
create table cobar_hash_0_p8 (a bigint，b bigint)
partition by udf_hash (
    `a` with udf_params (
      'cobar/PartitionByLong',
      '{
          "partitionCount" : "8",
          "partitionLength" : "128"
       }'
    )
)
partitions 8;
show create table cobar_hash_0_p8;

insert into cobar_hash_0_p8 values (100,100),(200,200),(300,300);
select a,b from cobar_hash_0_p8 where a=200;
drop table if exists cobar_hash_0_p8;
  
### ======== stringhash =========
drop table if exists cobar_strhash_0_p8;
create table cobar_strhash_0_p8(a varchar(32)，b bigint)
partition by udf_hash (
    `a` with udf_params (
      'cobar/PartitionByString',
      '{
          "partitionCount" : "8", 
          "partitionLength" : "128",
          "hashSlice" : "0:8"
      }'
    )
)
partitions 8;
show create table cobar_strhash_0_p8;

insert into cobar_strhash_0_p8 values ('100',100),('200',200),('300',300);
select a,b from cobar_strhash_0_p8 where a='200';
drop table if exists cobar_strhash_0_p8;

### ======== enum =========
drop table if exists cobar_enum_0_p5;
create table cobar_enum_0_p5
 (a bigint，b bigint)
partition by udf_hash(
  `a` with udf_params (
  'cobar/PartitionByFileMap',
  '{
      "defaultNode" : "0",
      "type" : "0",　
      "mapFile" :
      "
        10000=0
        10010=1
        10020=2
        10030=3
        10040=4
      "
    }')
)
partitions 5;
show create table cobar_enum_0_p5;
          
insert into cobar_enum_0_p5 values (10000,10000),(10020,10020),(10030,10030);
select a,b from cobar_enum_0_p5 where a=10030;
drop table if exists cobar_enum_0_p5;
  
### ======== multi-dimension =========
drop table if exists cobar_hash_strhash;
create table cobar_hash_strhash (a bigint，b varchar(32))
partition by udf_hash (
  `a` with udf_params (
  'cobar/PartitionByLong',
  '{
          "partitionCount" : "4",
          "partitionLength" : "128"
   }'
  )
)
partitions 4
subpartition by udf_hash (
  `b` with udf_params (
  'cobar/PartitionByString',
  '{
          "partitionCount" : "8",
          "partitionLength" : "128",
          "hashSlice" : "0:8"
  }'
  )
)
subpartitions 8;
show create table cobar_hash_strhash;

