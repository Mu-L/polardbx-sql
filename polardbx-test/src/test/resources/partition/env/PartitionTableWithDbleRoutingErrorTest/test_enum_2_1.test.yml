## test dble_db

set ENABLE_PUSH_DOWN_AUTO_INCREMENT=true;
set DEFAULT_COLLATION_FOR_UTF8MB4='utf8mb4_bin';
set COLLATION_SERVER='utf8mb4_bin';
set ENABLE_POST_PLANNER_PARTITION_HINT_PRUNING=true;

set ROUTE_TUPLE_USE_PRECHECK_BY_UDF_FUNC=true;
set ROUTE_TUPLE_IGNORE_BAD_VALUE_TYPE_CAST=true;
  
  
drop table if exists enum_table_2_1;
create table enum_table_2_1(id int)
  partition by udf_hash(
  `id` with udf_params(
  'dble/enum',
    '{
　　　 "type" : "0",
   "mapFile" :
                 "
                 0=0
                 aaa=0
                 1=1
                 bbb=1
                 2=2
                 3=3
                 "
    }'
  )
  )
  partitions 4;

insert into enum_table_2_1(id) values (0) /*dest_node:p1*/;
select part_route('', 'enum_table_2_1', 0) as dest_node;
insert into enum_table_2_1(id) values (1)  /*dest_node:p2*/;
select part_route('', 'enum_table_2_1', 1) as dest_node;
insert into enum_table_2_1(id) values (2)  /*dest_node:p3*/;
select part_route('', 'enum_table_2_1', 2) as dest_node;
insert into enum_table_2_1(id) values (3)  /*dest_node:p4*/;
select part_route('', 'enum_table_2_1', 3) as dest_node;
  
