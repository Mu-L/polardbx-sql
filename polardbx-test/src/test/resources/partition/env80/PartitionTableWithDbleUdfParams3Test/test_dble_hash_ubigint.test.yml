## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG
## LOCALITY_DN_LIST: $dn1, $dn2 ;

drop table if exists dblehash_tb_ubi;
create table if not exists dblehash_tb_ubi(a bigint unsigned)
charset utf8mb4 collate utf8mb4_bin
partition by udf_hash(
`a` with udf_params(
'dble/hash',
'{"partitionCount":"4", "partitionLength":"1"}'
)
)
partitions 4;
insert into dblehash_tb_ubi values(0);
select a from dblehash_tb_ubi where a=0;
  
