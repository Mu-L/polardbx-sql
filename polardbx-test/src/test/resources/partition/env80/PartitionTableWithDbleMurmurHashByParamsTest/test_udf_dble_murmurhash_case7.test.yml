## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG

drop table if exists dblemur_t7;
create table dblemur_t7
  (a varchar(64)，b bigint)
  partition by udf_hash(
  `a` with udf_params (
  'dble/unitmurmurhash',
  '{"partitionCount": "2","isDigitCheck": "1","shardingValueMaxLength": "20"}'
  )
  )
 partitions 2;


insert into dblemur_t7 values ('2', 2);
select * from dblemur_t7 where a='2';
select part_route('','dblemur_t7', '2');
  ## error_msg: $# check routeKey is legal #$
select part_route('','dblemur_t7', '');
  ## error_msg: $# check routeKey is legal #$
select part_route('','dblemur_t7', '1234567891234567891234567');
  ## error_msg: $# check routeKey is legal #$
select part_route('','dblemur_t7', 'aaa');

drop table dblemur_t7;
