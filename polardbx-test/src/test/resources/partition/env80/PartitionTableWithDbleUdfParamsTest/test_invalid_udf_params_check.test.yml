## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG
## LOCALITY_DN_LIST: $dn1, $dn2 ;

## test check invalid dble algorithm name;
## error_msg: $# invalid dble algorithm #$
create table dblehash_check_params_t1
  (a bigint，b bigint)
  partition by udf_hash (
    `a` with udf_params (
      'dble/hash1',
      '{"partitionCount" : "2,2","partitionLength" : "50,100"}'
    )
  ) partitions 4;

## test check invalid algorithm name of dble udf;
## error_msg: $# Failed to find #$
create table dblehash_check_params_t1
  (a bigint，b bigint)
  partition by udf_hash (
    `a` with udf_params (
      'dble_ext/hash1',
      '{"partitionCount" : "2,2","partitionLength" : "50,100"}'
    )
    ) partitions 4;
  
