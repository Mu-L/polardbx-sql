create table date_table(id date)
partition by udf_hash(
  `id` with udf_params(
    'dble/date',
  '{
　　　 "dateFormat" : "yyyy-MM-dd",
                     "sBeginDate" : "2017-12-01",
                     "sEndDate" : "2018-01-08",
                     "sPartionDay" : "10",
                     "defaultNode" : "3"
}'
  )
  )
  partitions 4;

