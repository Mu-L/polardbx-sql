INSERT INTO t2 VALUES(103, 1000);

# INSERT operations.
INSERT INTO t1 VALUES(1, 1);
INSERT INTO t1 VALUES(2, NULL);
#error ER_CHECK_CONSTRAINT_NOT_FOUND
## error_msg: $# ERR_EXECUTE_ON_MYSQL #$  
