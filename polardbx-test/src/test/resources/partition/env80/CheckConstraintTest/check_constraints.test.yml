CREATE TABLE t1 (
  id int primary key,
  CHECK (c1 <> c2),
  c1 INT CHECK (c1 > 10),
  c2 INT CONSTRAINT c2_positive CHECK (c2 > 0),
  c3 INT CHECK (c3 < 100),
  CONSTRAINT c1_nonzero CHECK (c1 <> 0),
  CHECK (c1 > c3),
  index (`c1`)
) ;
SHOW CREATE TABLE t1;
DROP TABLE t1;