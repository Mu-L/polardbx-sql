## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG
## LOCALITY_DN_LIST: $dn1, $dn2 ;
set ROUTE_TUPLE_USE_PRECHECK_BY_UDF_FUNC=true;
set ROUTE_TUPLE_IGNORE_BAD_VALUE_TYPE_CAST=true;
set ENABLE_PUSH_DOWN_AUTO_INCREMENT=true;
  
create table dblemurhash_tbl8 (
  id int not null primary key,
  name varchar(20)
  )
  partition by UDF_HASH(
  `id` with udf_params(
  'dble/unitmurmurhash',
  '{
"partitionCount" : "2",
"shardingValueMaxLength" : "20",
"leftPaddingChar" : "NO"
}'
  )
) 
partitions 4;

insert into dblemurhash_tbl8(id, name) values('5', 'a');
select * from dblemurhash_tbl8 where id = '5';
## error_msg: $# routeField is null or "" ! #$
insert into dblemurhash_tbl8(id, name) values('', 'a');
## error_msg: $# routeField is too long, over 20 #$
insert into dblemurhash_tbl8(id, name) values('123456789123456789123', 'a');
## error_msg: $# routeField is not digit ! #$
insert into dblemurhash_tbl8(id, name) values('a', 'a');
