## DISABLE_FAST_SQL_PARSER
## RESERVE_SEMICOLONS_FLAG

set TTL_DEBUG_USE_GSI_FOR_COLUMNAR_ARC_TBL = true;

USE polardbx;
DROP DATABASE IF EXISTS test_ttl_arc_npe_db;
CREATE DATABASE IF NOT EXISTS test_ttl_arc_npe_db mode='auto' DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_bin;
USE test_ttl_arc_npe_db;

CREATE TABLE ttl_npe_t1(
a int not null auto_increment,
b datetime default current_timestamp,
c varchar(64) default 'hello',
primary key(a)
)
TTL = TTL_DEFINITION(
TTL_ENABLE = 'OFF',
TTL_EXPR = `b` EXPIRE AFTER 30 DAY TIMEZONE '+08:00',
TTL_JOB = CRON '0 0 2 */1 * ? *' TIMEZONE '+08:00'
)
partition by key(a) partitions 2;

show create table ttl_npe_t1;

CREATE INDEX idx_npe_t1_b ON ttl_npe_t1(b);
show create table ttl_npe_t1;

DROP INDEX idx_npe_t1_b ON ttl_npe_t1;
show create table ttl_npe_t1;

ALTER TABLE ttl_npe_t1 MODIFY TTL SET ARCHIVE_TABLE_NAME = 'arc_ttl_npe_t1', ARCHIVE_TYPE = 'ROW';
show create table ttl_npe_t1;

ALTER TABLE ttl_npe_t1 MODIFY TTL SET ARCHIVE_TABLE_NAME = '', ARCHIVE_TYPE = '';
show create table ttl_npe_t1;

CREATE INDEX idx_npe_t1_c ON ttl_npe_t1(c);
show create table ttl_npe_t1;

DROP INDEX idx_npe_t1_c ON ttl_npe_t1;
show create table ttl_npe_t1;

USE polardbx;
DROP DATABASE IF EXISTS test_ttl_arc_npe_db;
